id: Test Power of Attorney and Delegation by Parent or guardian intro
continue button field: test_power_of_attorney_and_delegation_by_parent_or_guardian_intro
question: |
  Test Power of Attorney and Delegation by Parent or guardian
subquestion: |
  ### IMPORTANT - PLEASE READ
  - Please note that this form can be filled out with UP TO THREE CHILDREN
  - Please note that this form REQUIRES TWO WITNESSES
  
  ### Before you get started
  - Gather the necessary information about your children and the person you want to appoint.
  - Ensure you understand the powers you are granting and the limitations.
  
  ### When you are finished
  - Sign the document in the presence of witnesses and a notary public.
  - Provide copies to the appointed agent and any relevant institutions (like schools or healthcare providers).
  
  If you're a parent or guardian in Maine and need someone else to care for your children temporarily, this form is for you. It grants your chosen agent the authority to make decisions about your children's health, education, and general welfare.
---
id: Power of Attorney Details
question: "Signature & Consent Details"
subquestion: Provide the details of the signature and consent.
fields:
  - End date of user consent (up to one year from date of signing this form): users1_consent_end_date
    datatype: date
  - 2-digit year of user signature date (20XX): users1_signature_date_year
  - Day of month of user signature date: users1_signature_date_day
---
id: Witness Information
question: |
  Witness Information
subquestion: |
  Enter the addresses of the witnesses.
fields:
  - Street address of witness one: witnesses1_address_line1
  - City and state of witness one: witnesses1_address_line2
  - Street address of witness two: witnesses2_address_line1
  - City and state of witness two: witnesses2_address_line2
---
id: Notarization Details
question: |
  Notarization Details
subquestion: |
  Provide the county where the notarization took place.
fields:
  - "County of notarization": notarized_county
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
  ql_baseline.yml, rewritten to name this interview's own objects instead of the
  generic `x`. Edit them freely: they replace the AssemblyLine versions. Delete
  one to go back to the AssemblyLine wording.
---
id: children names
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
question: |
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  Name of child
  % else:
  Name of the ${ ordinal(i) } child
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: another child
question: |
  Is there another child to tell us about?
fields:
  - no label: children.there_is_another
    datatype: yesnoradio
---
id: notary names
sets:
  - notary[i].name.first
  - notary[i].name.last
  - notary[i].name.middle
  - notary[i].name.suffix
question: |
  % if hasattr(notary, 'ask_number') and notary.ask_number and notary.target_number == 1:
  Name of notary
  % else:
  Name of the ${ ordinal(i) } notary
  % endif
fields:
  - code: |
      notary[i].name_fields()
---
id: other parties names
sets:
  - "other_parties[i].name.first"
  - "other_parties[i].name.last"
  - "other_parties[i].name.middle"
  - "other_parties[i].name.suffix"
  - "other_parties[i].person_type"
question: |
  % if user_started_case:
  Name of ${ ordinal(i) } **custodian** in this matter
  % else:
  Name of ${ ordinal(i) } **plaintiff** or petitioner in this matter
  % endif
fields:
  - code: |
      other_parties[i].name_fields(person_or_business="unsure")
---
id: other party address
sets:
  - other_parties[i].address.address
  - other_parties[i].address.city
  - other_parties[i].address.state
  - other_parties[i].address.zip
  - other_parties[i].address.unit
  - other_parties[i].address.country
question: |
  What is ${ other_parties[i].possessive('address') }?
fields:
  - code: |
      other_parties[i].address_fields(
          country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE
      )
---
id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % elif al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Who is the ${ ordinal(i) } person on your side of the case?
  % else:
  What is the name of the ${ ordinal(i) } person who is adding their
  name to this form with you?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
id: user address
sets:
  - users[i].address.address
  - users[i].address.city
  - users[i].address.state
  - users[i].address.zip
  - users[i].address.unit
  - users[i].address.country
question: |
  % if i == 0 and al_person_answering == "user":
  What is your address?
  % else:
  What is ${ users[i] }'s address?
  % endif
fields:
  - label: |
      % if i > 0 and al_person_answering == "user":
      Same as your address
      % else:
      Same as ${ users[0] }'s address
      % endif
    field: users[i].address
    datatype: object_radio
    choices:
      - users[0].address if defined("users[0].address.address") else None
    object labeler: |
      lambda y: y.on_one_line()
    none of the above: |
      Somewhere else
    disable others: True
    show if:
      code: |
        i > 0 and defined("users[0].address.address")
  - code: |
      users[i].address_fields(
          country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE
      )
---
id: witnesses names
question: |
  Witness names
subquestion: |
  Enter full names of witnesses
fields:
  - full name of witness one: witnesses1_name_full
  - full name of witness two: witnesses2_name_full
---
id: another witness
question: |
  Is there another witness to tell us about?
fields:
  - no label: witnesses.there_is_another
    datatype: yesnoradio
---
id: preview test_power_of_attorney_and_delegation_by_parent_or_guardian
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.

