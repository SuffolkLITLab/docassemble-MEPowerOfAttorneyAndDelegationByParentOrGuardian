'Su nombre', 'Copy\n': 'Copiar ', 'Copy to clipboard\n': 'Copiar al portapapeles ', 'Copied!\n': '¡Copiado! ', 'Back to form\n': 'Volver al formulario ', 'About this form\n': 'Acerca de este formulario ', 'Start over\n': 'Comenzar de nuevo\n', 'Back\n': 'Volver\n', 'Exit and delete my answers\n': 'Salir y borrar mis respuestas\n', 'Do you want to delete your answers?\n': '¿Quiere borrar sus respuestas?\n', 'Your progress on this document will be completely erased. Any\nactions that were scheduled, such as reminders from this website,\nwill also be removed.\n\nClick "Exit and delete my answers" to delete your progress,\nor "Back" if you want to keep working.\n': 'Se borrará completamente su progreso en este documento. Las\nacciones que estaban programadas, como recordatorios de esta página web,\nse eliminarán igualmente.\n\nHaga clic en "Salir y borrar mis respuestas" para borrar su progreso,\no "Volver" si desea seguir trabajando.\n', 'Something went wrong\n': 'Hubo un error\n', 'Exit': 'Salir', 'Here is your work in progress\n': 'Aquí está su trabajo en progreso\n', 'Leave': 'Abandonar', 'Technical information\n': 'Información técnica\n', 'Get a copy of the documents in email\n': 'Obtenga una copia de los documentos por correo electrónico\n', 'Include an editable copy\n': 'Incluir una copia editable\n', 'We could not make your documents\n': 'No pudimos crear sus documentos\n', 'Please wait while we make your documents\n': 'Por favor espere mientras preparamos sus documentos', 'We could not generate a preview of your document\n': 'No pudimos crear una vista previa de su documento\n', 'Please wait while we generate a preview of your document\n': 'Por favor espere mientras generamos una vista previa de su documento', 'Terms of Use and Privacy Policy': 'Condiciones de uso y política de privacidad', 'green words': 'palabras verdes', 'Green words are legal terms or a short way of referring to something that needs more explanation. The definition or explanation pops up when you tap the green words. \n': 'Las palabras verdes son términos legales o una manera breve de referirse a algo que necesita una mayor explicación. La definición o explicación aparece cuando toca las palabras verdes. \n', 'I accept the terms of use': 'Acepto las condiciones de uso', 'Starting a new case': 'Iniciar un caso nuevo', 'Responding to a case': 'Responder a un caso', 'Okay, you are the **Plaintiff** or Petitioner in this case. The other \nside is the **Defendant** or Respondent.\n': 'Bueno, usted es el **Demandante** o el Peticionario en este caso. La otra  parte se denomina el **Demandado** o el Acusado. ', 'Okay, you are the **Defendant** or Respondent in this case. The other \nside is the **Plaintiff** or Petitioner.\n': 'Bueno, usted es el **Demandado** o el Acusado en este caso. La otra  parte se denomina el **Demandante** o el Peticionario. ', 'If you are the first person to file a form in the case, you \nstarted the case. You are the "Plaintiff" or the "Petitioner."\n\nIf you are responding to a case or court papers someone else filed, you\nare the "Defendant" or the "Respondent."\n': 'Si es la primera persona en presentar un formulario en el caso,  entonces usted es quien inició el caso. Usted sería el “Demandante” o el “Peticionario”.  \n\nSi está respondiendo a un caso o documentos del tribunal que presentó otra persona, usted sería el “Demandado” o el “Acusado”. ', 'How do I know?\n': '¿Cómo puedo saberlo? ', 'Who started this case?': '¿Quién inició este caso?', 'I started this case': 'Yo inicié este caso', 'I responded to this case': 'Yo respondí a este caso', 'Are you the **petitioner** or **plaintiff**?': '¿Es usted el **peticionario** o **demandante**?', 'Petitioner': 'Peticionario', 'Plaintiff': 'Demandante', "I don't know": 'No sé', 'Are you the **respondent** or **defendant**?': '¿Es usted el **demandado** o **acusado**?', 'Respondent': 'Acusado', 'Defendant': 'Demandado', 'Title (optional)\n': 'Título (opcional)\n', 'First name\n': 'Nombre ', 'Middle name\n': 'Segundo nombre ', 'Last name\n': 'Apellido ', 'Suffix\n': 'Sufijo ', 'Is this a person, or a business?\n': '¿Es un individuo o un negocio? ', 'Name of business or organization\n': 'Nombre del negocio o de la organización ', 'Person\n': 'Individuo ', 'Business or organization\n': 'Negocio u organización ', 'Street address\n': 'Dirección ', 'Apartment\n': 'Apartamento ', 'City\n': 'Ciudad ', 'Gender\n': 'Género ', 'Female\n': 'Mujer ', 'Male\n': 'Hombre ', 'Nonbinary\n': 'No binario ', 'Prefer not to say\n': 'Prefiero no decir ', 'Prefer to write something else\n': 'Prefiero escribir otra cosa ', 'Self-described gender\n': 'Género, descripción propia ', 'Unknown\n': 'Desconocido\n', 'Some forms require you to select either "Male" or "Female". If you do not select\n"Male" or "Female", your form may include an empty checkbox.\n': 'En algunos formularios, es obligación que seleccione “Hombre” o “Mujer”. Si no selecciona “Hombre” o “Mujer”, es posible que su formulario incluya una casilla de verificación vacía. ', 'State / Province\n': 'Estado / Provincia\n', 'Zip or postal code\n': 'Código Postal ', 'Postal code\n': 'Código Postal ', 'Country\n': 'País ', 'This address is impounded\n': 'Esta dirección está confiscada\n', '**IMPOUNDED**\n': '**CONFISCADA**\n', 'County\n': 'Condado\n', 'Birthdate': 'Fecha de nacimiento', 'Somewhere else\n': 'En otra parte\n', 'E-filing system': 'Sistema de presentación electrónica', 'e-filing system': 'sistema de presentación electrónica', 'Mail': 'Correo', 'mail': 'correo', 'Hand delivery': 'Entrega en mano', 'hand delivery': 'entrega en mano', 'Email': 'Correo electrónico', 'email': 'correo electrónico', 'Mobile number': 'Número de teléfono móvil', 'Other phone number': 'Otro número de teléfono', 'Email address': 'Dirección de correo electrónico', "If you do not have a phone number or email, provide\nspecific contact instructions. For example, use a friend's phone number.\nBut the friend must be someone you can rely on to give you a\nmessage.\n": 'Si no tiene un número de teléfono o correo electrónico, proporcione instrucciones específicas acerca de cómo contactarlo. Por ejemplo, puede proveer el teléfono de un amigo. Sin embargo, el amigo debe ser una persona de quien pueda depender para que le dé un mensaje. ', 'Why do I need to give my contact information?\n': '¿Por qué necesito dar mi información de contacto?\n', 'What is the case number used to track this case in court?\n': '¿Cuál es el número de caso utilizado para hacerle un seguimiento a este caso en el tribunal?\n', "I don't know the case number": 'No conozco el número de caso', 'Case number': 'Número de caso', 'Do you have a case number used to track this case in court?\n': '¿Tiene un número de caso que se utilice para hacerle un seguimiento a este caso en el tribunal?\n', 'I have a case number': 'Tengo un número de caso', 'Case number\n': 'Número de caso\n', 'Do you need to list a witness for this form?\n': '¿Necesita incluir el nombre de algún testigo en este formulario? ', 'Do you need to add another witness?\n': '¿Necesita agregar otro testigo? ', 'What is the name of the person who died?\n': '¿Como se llama la persona que falleció?\n', 'Any children?': '¿Hay hijos?', 'Do you have any witnesses?\n': '¿Tiene algún testigo? ', 'Any witnesses?': '¿Hay testigos?', 'Edit your answers about people on the other side of your case\n': 'Edite sus respuestas sobre las personas en el otro lado de su caso\n', 'Name': 'Nombre', 'Address': 'Dirección', 'Phone number': 'Número de teléfono', 'Phone': 'Teléfono', 'Fax number': 'Número de fax', 'Attorney number': 'Número de abogado', 'In some jurisdictions, attorneys will have an identification number. \nFor example, in Massachusetts, all attorneys have a BBO (Board of \nBar Overseers) number that is 6 digits long. \n': 'En algunas jurisdicciones, los abogados tienen un número de identificación.  Por ejemplo, en Massachusetts, todos los abogados tienen un número de BBO (Junta de  Supervisores del colegio de abogados) de 6 dígitos.  ', 'What is an attorney ID?\n': '¿Qué es una identificación de abogado?\n', 'When do you plan to file these forms that we are working on?\n': '¿Cuándo planea presentar estos formularios que estamos completando? ', 'Date': 'Fecha', 'Do you need an interpreter?\n': '¿Necesita un intérprete? ', 'You have the right to an interpreter.\n\nIf there is a chance you may not understand everything that is said in \nEnglish, or if other people may not be able to understand you, ask for an \ninterpreter.\n\nYou do not have to speak only through the interpreter, but you may have one \nif you need one.\n': 'Tiene derecho a recibir los servicios de un intérprete.  \n\nSi es posible que no comprenda todo lo que está en  Inglés, o si otras personas no pueden entenderlo, solicite un  intérprete.  \n\nNo es necesario que hable solo a través del intérprete, pero puede tener uno  si lo necesita. ', 'I need an interpreter': 'Necesito un intérprete', 'My preferred language is': 'El idioma que prefiero es el', 'Signing Under Oath\n': 'Firmar bajo juramento ', 'Your form must be signed under oath.\nThat means everything you say must be true as far as you know.\nYou may be punished by a judge if you intentionally\nsay something that is not true.\n': 'Debe firmar el formulario bajo juramento. Eso quiere decir que todo lo que diga debe ser verdad, a su leal saber y entender. Un juez podría castigarlo si intencionalmente declara algo que no es cierto. ', 'I affirm that the answers I have given are true, under the pains and penalties of perjury': 'Afirmo bajo pena de perjurio que las respuestas que he proporcionado son verdaderas', 'You cannot keep going unless you did your best to tell the truth.': 'No puede seguir adelante a menos que haya hecho todo lo posible por decir la verdad.', 'I am': 'Soy', 'Married': 'Casado/a', 'Widowed': 'Viudo/a', 'Divorced': 'Divorciado/a', 'Separated': 'Separado/a', 'Never married': 'Nunca me he casado', 'How do I pick a court?\n': '¿Cómo elijo un tribunal? ', 'City': 'Ciudad', 'State': 'Estado', 'Postal code': 'Código Postal', 'What is the name of the appeals court your case is in?\n': '¿Cómo se llama el tribunal de apelaciones en el que se encuentra su caso?\n', 'Your documents are almost ready\n': 'Sus documentos están casi listos\n', 'How do you want to sign them?\n': '¿Cómo los quiere firmar?\n', 'On a phone with my finger': 'En un teléfono con mi dedo', 'On this device': 'En este dispositivo', 'On the paper with a pen after I print the documents': 'En papel con un bolígrafo después de que imprima los documentos', 'Sign your forms  \n': 'Firme sus formularios  \n', 'Text me a link instead': 'Envíenme un mensaje de texto con un enlace', 'Cell phone number': 'Número de celular', 'How do I use this screen?\n': '¿Cómo uso esta pantalla?\n', 'Continue on the device you started the interview on\n': 'Siga usando el dispositivo en el que comenzó la entrevista\n', 'Thank you for signing. You can close this browser on your phone.\nKeep going on the computer you started the interview on.\n': 'Gracias por firmar. Puede cerrar este navegador en su teléfono. \nContinúe el proceso en la computadora en la que comenzó la entrevista.\n', 'Special instructions for the cover page\n': 'Instrucciones especiales para la portada\n', 'Information for clerk': 'Información para el secretario', 'Include information that you want the clerk to know. The clerk is the person\nwho will receive your paperwork and put it in an official court file. The\nclerk is not a decision maker on your case.\n\nDo not include information that is meant for the judge or the other party.\nDo not include information that is meant to be part of your official case.\n\nThere is a chance this information may end up in the public court file, so\ndo not include sensitive or private information.\n': 'Incluya la información que quiere que el secretario sepa. El secretario es la persona\n que recibirá su documentación y la pondrá en un archivo oficial del tribunal. El\n secretario no toma decisiones en su caso. \n\nNo incluya información destinada al juez o a la otra parte. \nNo incluya información que deba ser parte de su caso oficial. \n\nEs posible que esta información termine en el expediente público del tribunal, por lo que\n no incluya información delicada o privada.\n', 'What to include?\n': '¿Qué debe incluir?\n', 'Send to court': 'Enviar al tribunal', 'Final Review With Cover Page\n': 'Revisión final con portada\n', 'Send me a copy': 'Envíenme una copia', 'Back to download screen': 'Volver a la pantalla de descarga', 'Review of your answers\n': 'Revisión de sus respuestas\n', 'Did you start this case, or are you responding to a case\nthat someone else started?\n': '¿Usted inició este caso o está respondiendo a un caso que fue iniciado por otra persona?\n\n', 'Do you have any documents you want to upload?': '¿Tiene algún documento que le gustaría subir?', '**Okay**. You will have a chance to upload multiple documents. \nYou can also add additional pages to this document.\n': '**OK**. Tendrá la oportunidad de subir múltiples documentos. \nTambién le puede añadir páginas adicionales a este documento.\n', 'First document title': 'Título del primer documento', 'Upload the first document': 'Subir el primer documento', 'You will have a chance to upload additional pages for this document later.\n': 'Tendrá la oportunidad de subir páginas adicionales para este documento más tarde.\n', 'Document title': 'Título del documento', 'Upload the exhibit': 'Subir el anexo', 'Finished adding pages': 'Se terminaron de añadir páginas', 'Add another page': 'Añadir otra página', 'Upload a PDF, Word, or image file': 'Subir un archivo PDF, Word o de imagen', 'Finished adding documents': 'Se terminaron de añadir documentos', 'Add another document': 'Añadir otro documento', 'Preview your documents so far\n': 'Previsualizar sus documentos hasta ahora\n', 'Thumbnail\n': 'Miniatura\n', 'Title\n': 'Título\n', 'Total pages\n': 'Número total de páginas\n', 'Review your documents\n': 'Revisar sus documentos\n', 'Review your document pages\n': 'Revisar las páginas de su documento\n', 'Other\n': 'Otro\n', 'Language\n': 'Idioma\n', 'Example: "I normally sleep at 5th and Main."\n': 'Ejemplo: "Normalmente duermo en la calle 5 y Main".\n', 'First name': 'Primer nombre', 'Middle name': 'Segundo nombre', 'Last name': 'Apellido', 'Suffix': 'Fórmula de tratamiento', 'What name does the minor want to be called?\n': '¿Qué nombre quiere el menor de edad que le llamen?\n', 'What name does the petitioner want to be called?\n': '¿Qué nombre quiere el demandante que le llamen?\n', 'Has the minor changed their name before?\n': '¿El menor de edad ha cambiado su nombre anteriormente?\n', 'Is there another time that the minor changed their name?\n': '¿El menor de edad ha cambiado su nombre alguna otra vez?\n', "What was the minor's first legal name?\n": '¿Cuál fue el primer nombre legal del menor de edad?\n', 'Write the name as it appeared on their first birth certificate.\n': 'Escriba el nombre tal como aparecía en su primer certificado de nacimiento.\n', 'A pronoun is a word that can be used in place of your name. For example: he, she, or they.\nLearn more at [pronouns.org](https://pronouns.org/)\n': 'Un pronombre es una palabra que se puede utilizar en lugar de su nombre. Por ejemplo: él, ella, o ellos.\nMás información en [pronouns.org](https://pronouns.org/)\n', 'Check one or more pronouns that you want people to use to refer to you\n': 'Marque uno o más pronombres que desee que usen las personas al referirse a usted\n', 'Choose one or more pronouns\n': 'Elija uno o más pronombres\n', 'Something else\n': 'Otra cosa\n', 'Self described pronouns\n': 'Pronombres auto descritos\n', 'by phone at': 'por teléfono al', 'by email at': 'por correo electrónico a', 'by': 'por', 'Set up a Power of Attorney for your children\n': 'Prepare un poder para sus hijos\n', 'Power of Attorney and Delegation by Parent or guardian\n': 'Poder y delegación por parte del padre, la madre o el tutor\n', "### Is this the right form for you?\nIf you are a parent or guardian in Maine and need someone else to care for your children temporarily, this form is for you. It grants your chosen agent the power to make decisions about your children's health, education, and general welfare.\n\n### Before you get started\n- Gather the necessary information about your children and the person you want to appoint.\n- Make sure you understand the powers you are granting and the limitations.\n\n### When you are finished\n- Sign the document in the presence of two witnesses and a notary public.\n- Provide copies to the appointed agent and any relevant institutions (like schools or healthcare providers).\n\n": '### ¿Es este el formulario adecuado para usted?\nEste formulario es para usted si es padre, madre o tutor en Maine y necesita que otra persona cuide temporalmente de sus hijos. Le otorga al apoderado que usted elija la autoridad para tomar decisiones sobre la salud, la educación y el bienestar general de sus hijos.\n\n### Antes de comenzar\n- Reúna la información necesaria sobre sus hijos y la persona que desea designar.\n- Asegúrese de comprender las facultades que está otorgando y sus límites.\n\n### Cuando termine\n- Firme el documento en presencia de dos testigos y un notario público.\n- Entregue copias al apoderado designado y a las instituciones correspondientes, como las escuelas o los proveedores de atención médica.\n\n', 'Which best describes your role?\n': '¿Cuál de las siguientes opciones describe mejor su función?\n', 'Identify the capacity in which you are completing this form.\n': 'Indique en qué calidad está completando este formulario.\n', 'Parent': 'Padre/Madre', 'Court-appointed guardian': 'Tutor designado por el tribunal', 'Signature & Consent Details': 'Detalles de la firma y el consentimiento', 'Provide the details of the signature and consent.': 'Proporcione los detalles de la firma y el consentimiento.', 'Please review the end date': 'Revise la fecha de finalización', 'The end date you selected is more than one year from today. \n\nUnder Maine law, you cannot delegate authority for more than a year from the date of signing this form. \n\nYou can go back and change the date if needed.\n': 'La fecha de finalización que eligió es más de un año después de hoy.\n\nSegún la ley de Maine, no puede delegar la autoridad por más de un año a partir de la fecha en que firme este formulario.\n\nPuede volver atrás y cambiar la fecha si es necesario.\n', 'Please review the end date\n': 'Revise la fecha de finalización\n', "The end date you selected is before today's date.\n\nThe consent period cannot end before the date you sign this form.\n\nPlease go back and correct the end date before continuing. \n": 'La fecha de finalización que eligió es anterior a hoy.\n\nEl período de consentimiento no puede terminar antes de la fecha en que firme este formulario.\n\nVuelva atrás y corrija la fecha de finalización antes de continuar. \n', "Please review the child's date of birth\n": 'Revise la fecha de nacimiento del menor\n', 'What is the name of your first witness?\n': '¿Cómo se llama su primer testigo?\n', 'What is the name of your second witness?\n': '¿Cómo se llama su segundo testigo?\n', 'Notarization Details\n': 'Detalles de la certificación notarial\n', 'County where the notarization will take place.\n': 'Condado donde se realizará la certificación notarial.\n', 'County of notarization': 'Condado de la certificación notarial', 'How would you like to sign your form?\n': '¿Cómo desea firmar su formulario?\n', 'Choose how you would like your completed Power of Attorney document prepared.\n\n**Witnesses and notarization**\n\nYou must sign the form in the presence of two witnesses and a notary public. The witnesses observe your signature and the notary public acknowledges it.\n\nChoosing electronic signing does not eliminate these requirements. You will still need to complete the witness and notary signatures.\n': 'Elija cómo desea que se prepare su documento de poder completado.\n\n**Testigos y certificación notarial**\n\nDebe firmar el formulario en presencia de dos testigos y un notario público. Los testigos observan su firma y el notario público certifica el reconocimiento de su firma.\n\nElegir la firma electrónica no elimina estos requisitos. Aún deberá obtener las firmas de los testigos y del notario.\n', 'Sign electronically': 'Firmar electrónicamente', 'Leave signature fields blank': 'Dejar en blanco los espacios para las firmas', 'How many children are you including on this form?\n': '¿A cuántos menores está incluyendo en este formulario?\n', 'You may include up to three children.\n': 'Puede incluir hasta tres menores.\n', 'Unit': 'Unidad', 'ZIP Code': 'Código postal', 'Witness names\n': 'Nombres de los testigos\n', 'Enter full names of witnesses\n': 'Ingrese los nombres completos de los testigos\n', 'Full name of witness one': 'Nombre completo del primer testigo', 'Full name of witness two': 'Nombre completo del segundo testigo', 'Preview your form before you sign it\n': 'Obtenga una vista previa de su formulario antes de firmarlo\n', 'Review your answers\n': 'Revise sus respuestas\n', 'Edit': 'Editar', 'Edit users\n': 'Editar usuarios\n', 'Signature': 'Firma', 'Edit other_parties\n': 'Editar apoderado\n', 'Edit children\n': 'Editar menores\n', 'Edit witnesses\n': 'Editar testigos\n', 'Edit notary\n': 'Editar notario\n', 'Almost done\n': 'Ya casi termina\n', 'Instructions\n': 'Instrucciones\n', 'All forms to download for your records\n': 'Todos los formularios para descargar y guardar en sus archivos\n', 'All forms to file\n': 'Todos los formularios para presentar\n', 'Post-interview-Instructions': 'Instrucciones postentrevista', 'Power of attorney and delegation by parent or guardian': 'Poder y delegación por parte del padre, la madre o el tutor', 'Width': 'Ancho', 'Alt text\n': 'Texto alternativo\n', 'Alt text': 'Texto alternativo', 'Download answer set': 'Descargar juego de respuestas', 'Message': 'Mensaje', 'Do you want to start over?\n': '¿Quiere comenzar de nuevo?\n', 'Download all\n': 'Descargar todo\n', 'Download as one PDF\n': 'Descargar como un solo PDF', 'How many?': '¿Cuántos?', 'I will sign': 'Yo voy a firmar', 'What is your contact information?\n': '¿Cuál es su información de contacto? ', 'Other ways to reach you': 'Otros métodos para comunicarnos con usted', 'On a computer with my mouse': 'En una computadora con mi ratón', "Does the list above look wrong? If your case was filed in\na court we didn't list, choose from the full list below.\n": '¿La lista de arriba parece estar mal? Si su caso se presentó en un tribunal que no hemos mencionado, elija de la lista completa a continuación. ', 'Court name': 'Nombre del tribunal', 'Full name. Like: Eastern Housing Court\n': 'Nombre completo. Tal como: Tribunal de Vivienda del Este ', 'Court Department': 'Departamento del tribunal', 'E.g., Housing, District, Superior\n': 'Por ejemplo: Vivienda, Distrito, Superior ', 'Division': 'División', 'E.g., Eastern, Suffolk, East Boston\n': 'Por ejemplo: Este, Suffolk, Este de Boston ', 'County': 'Condado', 'bbo number': 'número bbo', 'Board of Bar Overseers, a regulatory board that tracks lawyers. All Massachusetts lawyers will have this number.\n': 'Junta de supervisores del colegio de abogados, una junta reguladora que monitorea a los abogados. Todos los abogados de Massachusetts tienen este número. ', 'He/him/his\n': 'Él\n', 'She/her/hers\n': 'Ella\n', 'They/them/theirs\n': 'Ellos\n', 'Ze/zir/zirs\n': 'Elle/Elles\n', 'Give someone permission to make educational decisions for your child \n': 'Autorice a alguien a tomar decisiones educativas por su hijo \n', 'What to know before you start': 'Lo que debe saber antes de comenzar', "## You can use this form if\n\n- Your child goes to school in Rhode Island\n- You are the parent or legal guardian of a child in a school in Rhode Island\n\n## What this form does\n\n  This form lets a trusted adult (a caregiver) get your child's school records. The caregiver can also make school decisions for your child if you are unavailable.\n\nAn illness, arrest, or other emergency can prevent you from making school decisions for your child. This form allows a trusted adult to step in to make school decisions for your child when you cannot.\n\nThis does not make the caregiver your child's {legal guardian}.\n\n## Signing this form\n\n**You must sign this form in front of a {notary}.** Rhode Island school districts require it before a caregiver can register a child.\n\nNeed a notary? You may be able to find one for free at your public library, your bank, or by calling United Way's 2-1-1 helpline.\n": '## Puede usar este formulario si\n\n- Su hijo asiste a una escuela en Rhode Island\n- Usted es el padre, la madre o el tutor legal de un menor que asiste a una escuela en Rhode Island\n\n## Qué hace este formulario\n\n  Este formulario permite que un adulto de confianza (una persona cuidadora) obtenga los expedientes escolares de su hijo. Esa persona también puede tomar decisiones escolares por su hijo si usted no está disponible.\n\nUna enfermedad, un arresto u otra emergencia pueden impedirle tomar decisiones escolares por su hijo. Este formulario permite que un adulto de confianza tome esas decisiones cuando usted no pueda hacerlo.\n\nEsto no convierte a la persona cuidadora en el {tutor legal} de su hijo.\n\n## Cómo firmar este formulario\n\n**Debe firmar este formulario ante un {notario}.** Los distritos escolares de Rhode Island lo exigen antes de que una persona cuidadora pueda inscribir a un menor.\n\n¿Necesita un notario? Quizás pueda encontrar uno gratis en su biblioteca pública, en su banco o llamando a la línea 2-1-1 de United Way.\n', 'Check if you can use this form\n': 'Compruebe si puede usar este formulario\n', '1. Does your child go to school in Rhode Island?': '1. ¿Su hijo asiste a una escuela en Rhode Island?', '2. Are you the parent or legal guardian of a child who goes to school in Rhode Island?': '2. ¿Usted es el padre, la madre o el tutor legal de un menor que asiste a una escuela en Rhode Island?', 'This form is not for you\n': 'Este formulario no es adecuado para usted\n', "This form only works for a child who goes to school in Rhode Island. You must be the child's parent or legal guardian. \n\nIf you made a mistake, click **Undo** to go back.\n": 'Este formulario solo sirve para un menor que asiste a una escuela en Rhode Island. Usted debe ser su padre, madre o tutor legal.\n\nSi cometió un error, haga clic en **Deshacer** para volver atrás.\n', 'Tap any green word to see what it means.\n': 'Toque cualquier palabra verde para ver su significado.\n', 'notary': 'notario', 'A notary (notary public) is a person licensed by the state to witness signatures. Many banks and public libraries have one, often for free.\n': 'Un notario (notario público) es una persona autorizada por el estado para dar fe de las firmas. Muchos bancos y bibliotecas públicas ofrecen este servicio, a menudo gratis.\n', 'caregiver': 'persona cuidadora', 'The trusted adult you are choosing to make school decisions for your child when you are not available.\n': 'El adulto de confianza que usted elige para tomar decisiones escolares por su hijo cuando usted no esté disponible.\n', 'legal guardian': 'tutor legal', 'A person a court has given the legal right to make decisions for a child. Only a court can make someone a legal guardian. This form does not do that.\n': 'Una persona a quien un tribunal le ha otorgado el derecho legal de tomar decisiones por un menor. Solo un tribunal puede designar a alguien como tutor legal. Este formulario no lo hace.\n', 'legal custody': 'custodia legal', 'The right to make important decisions for a child, like where they go to school or what medical care they receive. Parents may share legal custody, or one parent may have it alone.\n': 'El derecho a tomar decisiones importantes por un menor, como a qué escuela asiste o qué atención médica recibe. Los padres pueden compartir la custodia legal, o uno de ellos puede tenerla de forma exclusiva.\n', 'How many parents or legal guardians will sign this form?': '¿Cuántos padres o tutores legales firmarán este formulario?', "If you share {legal custody} with your child's other parent or legal guardian, **both of you should sign.** \n\nIf you have sole legal custody or are the child's only parent or legal guardian, you can sign alone.\n": 'Si comparte la {custodia legal} con el otro padre, la otra madre o el otro tutor legal de su hijo, **ambos deben firmar.**\n\nSi tiene la custodia legal exclusiva o es el único padre, madre o tutor legal del menor, puede firmar sin otra persona.\n', "What is the caregiver's address?": '¿Cuál es la dirección de la persona cuidadora?', 'Somewhere else': 'En otro lugar', 'Signing your form\n': 'Cómo firmar su formulario\n', 'Do you want to use a notary to sign this form?': '¿Desea firmar este formulario ante un notario?', 'Sign without a notary': 'Firmar sin notario', 'Print the form and sign it in front of a notary': 'Imprimir el formulario y firmarlo ante un notario', 'Who will be the caregiver?': '¿Quién será la persona cuidadora?', "The caregiver is the adult you are giving permission to make school decisions for your child while you are unavailable.\n\nThe caregiver will be able to:\n\n- Get your child's school records, including special education, counseling, and medical records\n- Talk to school staff about your child\n- Make decisions about your child's school, classroom, or program\n- Make decisions about services your child gets at school, including special education\n\nThis stays in effect until you cancel it in writing or your child turns 18.\n": 'La persona cuidadora es el adulto a quien usted autoriza a tomar decisiones escolares por su hijo cuando usted no esté disponible.\n\nLa persona cuidadora podrá:\n\n- Obtener los expedientes escolares de su hijo, incluidos los de educación especial, orientación y atención médica\n- Hablar con el personal escolar sobre su hijo\n- Tomar decisiones sobre la escuela, el salón de clases o el programa de su hijo\n- Tomar decisiones sobre los servicios que recibe su hijo en la escuela, incluida la educación especial\n\nEsta autorización sigue vigente hasta que usted la cancele por escrito o su hijo cumpla 18 años.\n', 'How many children are you listing on this form?': '¿Cuántos menores está incluyendo en este formulario?', 'You can list up to 4 children on this form. If you have more than 4 children, you can fill out this form again for the other children.\n': 'Puede incluir hasta 4 menores en este formulario. Si tiene más de 4 hijos, puede completar otro formulario para los demás.\n', 'Number of children': 'Número de menores', "What school district is this child's school in?": '¿En qué distrito escolar está la escuela de este menor?', 'Other or charter school': 'Otra escuela o escuela chárter', 'Not sure? Check a letter from the school, or ask the school office.\n': '¿No está seguro? Revise una carta de la escuela o pregunte en la oficina escolar.\n', 'Is there another child to tell us about?\n': '¿Hay otro menor del que deba informarnos?\n', 'Edit caregivers\n': 'Editar personas cuidadoras\n', 'Your form is ready\n': 'Su formulario está listo\n', 'Next Steps Document\n': 'Documento de próximos pasos\n', 'Rhode Island Educational Guardian Form\n': 'Formulario de tutor educativo de Rhode Island\n', 'Form to give the school \n': 'Formulario para entregar a la escuela \n', 'Allow Healthcare Decisions for your Child\n': 'Autorice decisiones sobre la atención médica de su hijo\n', 'community care facility': 'centro de atención comunitaria', 'Licensed residential or day program that provides non-medical care, supervision, and support services to children or adults who need help with daily living activities due to physical handicaps, developmental or mental impairments, or other special needs.\n': 'Un programa residencial o diurno autorizado que proporciona cuidados no médicos, supervisión y servicios de apoyo a menores o adultos que necesitan ayuda con las actividades de la vida diaria debido a discapacidades físicas, del desarrollo o mentales, u otras necesidades especiales.\n', 'A public official appointed by a government authority to act as an impartial witness when people sign important legal documents.\n': 'Un funcionario público designado por una autoridad gubernamental para actuar como testigo imparcial cuando las personas firman documentos legales importantes.\n', 'Rhode Island Power of Attorney for Children\n': 'Poder para menores de Rhode Island\n', '\nYou can use this form if you are a parent or legal guardian and want to choose someone to make healthcare decisions for your child. It is important to ensure that the chosen person is trustworthy and understands your wishes regarding medical care.\n\n### Before you get started\n- Gather the necessary information about your child and the chosen caregiver.\n- Make sure both parents are in agreement with the appointment.\n\n### When you are finished\n- Sign the document in front of a notary public to make it legally binding.\n- Provide a copy to the chosen caregiver and keep one for your records.\n': '\nPuede usar este formulario si es padre, madre o tutor legal y desea elegir a alguien para que tome decisiones sobre la atención médica de su hijo. Es importante asegurarse de que la persona elegida sea de confianza y comprenda sus deseos sobre la atención médica.\n\n### Antes de comenzar\n- Reúna la información necesaria sobre su hijo y la persona cuidadora elegida.\n- Asegúrese de que ambos padres estén de acuerdo con la designación.\n\n### Cuando termine\n- Firme el documento ante un notario público para que sea legalmente vinculante.\n- Entregue una copia a la persona cuidadora elegida y guarde otra para sus archivos.\n', 'Important caregiver information': 'Información importante sobre la persona cuidadora', '###### A caregiver should be:\n* Over 18 years old\n* Someone you trust\n* For example, a relative or close family friend\n\n\n###### None of the following may be a caregiver:\n* Your healthcare provider who is not a relative\n* An operator of a {community care facility} who is not a relative': '###### La persona cuidadora debe ser:\n* Mayor de 18 años\n* Alguien de su confianza\n* Por ejemplo, un familiar o un amigo cercano de la familia\n\n\n###### Ninguna de las siguientes personas puede ser cuidadora:\n* Un proveedor de atención médica suyo que no sea familiar\n* El operador de un {centro de atención comunitaria} que no sea familiar', 'Ensure that they are under 18 years old.': 'Asegúrese de que sea menor de 18 años.', 'Birthday': 'Fecha de nacimiento', 'Are you the parent of the child?': '¿Usted es el padre o la madre del menor?', 'Notary Information': 'Información del notario', 'In order for the form to be valid, you must get a {notary} to sign this form.\n\nAll Rhode Island Notaries Public are empowered to perform notarial acts for the general public.\n\n\n##### Where can I access a free Notary?\n* Community Action Partnership of Providence (CAPP)\n* Public libraries near you\n* Bank with which you have a bank account\n* United Way of Rhode Island (Dial 2-1-1) - they will be able to direct you to notary services and language services\n': 'Para que el formulario sea válido, debe obtener la firma de un {notario}.\n\nTodos los notarios públicos de Rhode Island están facultados para realizar actos notariales para el público en general.\n\n\n##### ¿Dónde puedo conseguir un notario gratuito?\n* Community Action Partnership of Providence (CAPP)\n* Bibliotecas públicas cercanas\n* El banco donde tiene una cuenta\n* United Way of Rhode Island (marque 2-1-1): pueden orientarle sobre servicios notariales y de idiomas\n', 'If you are not the parent, do you have all the necessary information to fill out the form?': 'Si no es el padre o la madre, ¿tiene toda la información necesaria para completar el formulario?', "### Required Information\n\n\n#### Parent information required:\n* Parent(s) first and last name\n* Parents address\n\n#### Child information required:\n* First and Last name\n* Birthday\n\n#### Caregiver's full name and address": '### Información requerida\n\n\n#### Información requerida de los padres:\n* Nombre y apellido de los padres\n* Dirección de los padres\n\n#### Información requerida del menor:\n* Nombre y apellido\n* Fecha de nacimiento\n\n#### Nombre completo y dirección de la persona cuidadora', 'Information?': '¿Información?', 'How many parents or guardians will be named on the form?': '¿Cuántos padres o tutores se nombrarán en el formulario?', 'Number of parents or guardians': 'Número de padres o tutores', 'Stop, you do not have the required information to continue\n': 'Deténgase: no tiene la información necesaria para continuar\n', 'Preview your form before you download it\n': 'Revise su formulario antes de descargarlo\n', 'Edit parents or guardians\n': 'Editar padres o tutores\n', 'All done\n': 'Todo listo\n', 'Completed Durable Power of Attorney Form\n': 'Formulario de poder duradero completado\n', 'What is the docket number for your case?\n': '¿Cuál es el número de expediente de su caso?\n', "I don't know the docket number": 'No conozco el número de expediente', 'Docket number': 'Número de expediente', 'Do you have a docket number for this case?\n': '¿Tiene un número de expediente para este caso?\n', 'I have a docket number': 'Tengo un número de expediente', 'What is the docket number for this case?\n': '¿Cuál es el número de expediente de este caso?\n', '<h2 class="h5"> Terms of Use and Privacy Policy</h2>\n\nThis website is free to use. Suffolk University Law School\'s Legal Innovation and Technology Lab ("LIT Lab"), a nonprofit, hosts the site.\n\nAnd we include information from:\n\n* Massachusetts Law Reform Institute\n* Massachusetts Legal Assistance Corporation\n* Greater Boston Legal Services\n* Northeast Legal Aid\n* Community Legal Aid\n* Legal Services Corporation\n\n<h3 class="h5">You need to know</h3>\n\n* This website does not constitute or provide legal advice. You should consult a lawyer for legal advice. If you need assistance finding a Lawyer you can use [https://masslrf.org](https://masslrf.org) to find one. \n* We use our best efforts to prepare the forms on this site and to keep them up to date. Law changes or court or local variations may make any forms generated by this site unenforceable.\n* This website is offered completely without warranty, including any implied warranties. The LIT Lab disclaims all liability for your use of information on this website or your reliance on the forms created by a guided interview.\n* You agree to indemnify and hold harmless the LIT Lab and the Law School for all claims arising out of your use of these guided interviews or the information that they give you.\n* The LIT Lab does not offer individual technical support for the interviews provided on this website.\n* Information you enter may not be protected by attorney-client privilege or attorney work product doctrine.\n* Do not use this system to conduct unauthorized practice of law. If you do, you may face civil or criminal liability.\n\n<h3 class="h5">To use this site</h3>\n\n* You need to be over 13 to use this site.\n* This site is for **anyone** 13 and over. For example: you can be the person who needs the help, a lawyer, or a social worker.\n* You may not sell the information or the contents of this site. But you can charge for your own time.\n* Please keep your use fair. Do not use this site in a way that is illegal or that makes it harder for other people to use.\n\n<h3 class="h5">Information we and others collect</h3>\n\n* We collect the information that you type to help you complete your forms. We delete all information 180 days after you last update it. You can also delete information immediately.\n* We log information including IP addresses and web browsers from all visitors. We use this information to keep our site secure. We keep logs for up to 180 days.\n* We use Google Maps to help fill in addresses automatically. This feature sends your IP address to Google Maps to get your approximate location.\n* We use Google Analytics to learn how people use our website. This helps us understand which pages are hardest to use. Google may use this information to show you better advertisements.\n* We use email and text message delivery services that may keep their own records of any messages you send. If you choose to log in with your phone number, this may include a record of the times you log in to the site.\n\n<h3 class="h5">We keep your information safe</h3>\n\n* We use the same technology that banks and online stores use to keep your information safe. We use:\n* 256 bit encryption\n* Software firewalls\n* Limited access controls\n* Continual monitoring\n* Regular security updates\n\n<h3 class="h5">Sharing your information</h3>\n\n* We never sell your information.\n* We share anonymous information with a small number of nonprofits and researchers. We use the information to improve our site and to improve free legal help in Massachusetts.\n* When you visit some pages of the site, the site may ask if you want to apply to get a free lawyer from legal aid. You get to decide if you want to share your personal information.\n* You may choose to email completed forms or share a link to your in-progress work at any time to any person.\n\n<h3 class="h5">These terms of use can change</h3>\n\nWe may change these Terms of Use at any time with no notice. Please review the terms on a regular basis to see any changes.\n\nIf you use the site after we make changes, you accept our changed Terms of Use.\n\n<h3 class="h5">The laws of Massachusetts apply to these Terms of Use</h3>\n\nIf a judge decides that one of the terms in this Terms of Use is unenforceable, it will not change the terms that remain.\n\n<h3 class="h5">If you still have questions</h3>\n\nSend any questions to:\n\nSuffolk Legal Innovation and Technology Lab  \n120 Tremont Street Suite 685  \nBoston, MA 02108': '<h2 class="h5"> Terminos de uso y politica de privacidad</h2>\n\nEste sitio web es gratuito. El Legal Innovation and Technology Lab ("LIT Lab") de Suffolk University Law School, una organizacion sin fines de lucro, aloja este sitio.\n\nTambien incluimos informacion de:\n\n* Massachusetts Law Reform Institute\n* Massachusetts Legal Assistance Corporation\n* Greater Boston Legal Services\n* Northeast Legal Aid\n* Community Legal Aid\n* Legal Services Corporation\n\n<h3 class="h5">Lo que necesita saber</h3>\n\n* Este sitio web no constituye ni ofrece asesoria legal. Debe consultar con un abogado para obtener asesoria legal. Si necesita ayuda para encontrar un abogado, puede usar [https://masslrf.org](https://masslrf.org). \n* Hacemos nuestro mejor esfuerzo para preparar los formularios de este sitio y mantenerlos actualizados. Cambios en la ley o variaciones del tribunal o locales pueden hacer que cualquier formulario generado por este sitio no pueda hacerse cumplir.\n* Este sitio web se ofrece completamente sin garantia, incluidas las garantias implicitas. El LIT Lab rechaza toda responsabilidad por su uso de la informacion de este sitio web o por su confianza en los formularios creados por una entrevista guiada.\n* Usted acepta indemnizar y eximir de responsabilidad al LIT Lab y a la facultad de derecho por cualquier reclamo que surja de su uso de estas entrevistas guiadas o de la informacion que le proporcionan.\n* El LIT Lab no ofrece apoyo tecnico individual para las entrevistas de este sitio web.\n* La informacion que usted escriba puede no estar protegida por el privilegio abogado-cliente ni por la doctrina del producto del trabajo del abogado.\n* No use este sistema para ejercer la abogacia sin autorizacion. Si lo hace, puede enfrentar responsabilidad civil o penal.\n\n<h3 class="h5">Para usar este sitio</h3>\n\n* Debe tener mas de 13 anos para usar este sitio.\n* Este sitio es para **cualquier persona** de 13 anos o mas. Por ejemplo: puede ser la persona que necesita ayuda, un abogado o un trabajador social.\n* No puede vender la informacion ni el contenido de este sitio. Pero puede cobrar por su propio tiempo.\n* Mantenga un uso justo. No use este sitio de manera ilegal ni de una forma que haga mas dificil que otras personas lo usen.\n\n<h3 class="h5">Informacion que recopilamos nosotros y otras personas</h3>\n\n* Recopilamos la informacion que usted escribe para ayudarle a completar sus formularios. Eliminamos toda la informacion 180 dias despues de la ultima vez que usted la actualiza. Tambien puede eliminar la informacion de inmediato.\n* Registramos informacion, incluidas las direcciones IP y los navegadores web, de todas las personas visitantes. Usamos esta informacion para mantener seguro nuestro sitio. Guardamos los registros hasta por 180 dias.\n* Usamos Google Maps para ayudar a completar direcciones automaticamente. Esta funcion envia su direccion IP a Google Maps para obtener su ubicacion aproximada.\n* Usamos Google Analytics para aprender como la gente usa nuestro sitio web. Esto nos ayuda a entender que paginas son mas dificiles de usar. Google puede usar esta informacion para mostrarle mejores anuncios.\n* Usamos servicios de entrega por correo electronico y mensaje de texto que pueden guardar sus propios registros de cualquier mensaje que usted envie. Si elige iniciar sesion con su numero de telefono, esto puede incluir un registro de las veces que inicia sesion en el sitio.\n\n<h3 class="h5">Mantenemos segura su informacion</h3>\n\n* Usamos la misma tecnologia que usan los bancos y las tiendas en linea para mantener segura su informacion. Usamos:\n* cifrado de 256 bits\n* cortafuegos de software\n* controles de acceso limitados\n* monitoreo continuo\n* actualizaciones regulares de seguridad\n\n<h3 class="h5">Compartir su informacion</h3>\n\n* Nunca vendemos su informacion.\n* Compartimos informacion anonima con un pequeno numero de organizaciones sin fines de lucro e investigadores. Usamos la informacion para mejorar nuestro sitio y para mejorar la ayuda legal gratuita en Massachusetts.\n* Cuando visita algunas paginas del sitio, el sitio puede preguntarle si quiere solicitar un abogado gratuito de asistencia legal. Usted decide si quiere compartir su informacion personal.\n* En cualquier momento puede elegir enviar por correo electronico formularios completos o compartir un enlace a su trabajo en progreso con cualquier persona.\n\n<h3 class="h5">Estos terminos de uso pueden cambiar</h3>\n\nPodemos cambiar estos Terminos de Uso en cualquier momento sin aviso. Revise los terminos con regularidad para ver cualquier cambio.\n\nSi usa el sitio despues de que hagamos cambios, acepta los Terminos de Uso modificados.\n\n<h3 class="h5">Las leyes de Massachusetts se aplican a estos Terminos de Uso</h3>\n\nSi un juez decide que una de las condiciones de estos Terminos de Uso no puede hacerse cumplir, eso no cambiara las condiciones que permanecen.\n\n<h3 class="h5">Si todavia tiene preguntas</h3>\n\nEnvie cualquier pregunta a:\n\nSuffolk Legal Innovation and Technology Lab  \n120 Tremont Street Suite 685  \nBoston, MA 02108', 'Let someone take care of your kids': 'Permita que alguien cuide de sus hijos', 'Let someone look after your kids': 'Permita que alguien se ocupe de sus hijos', "West Virginia's law for this form is for parents who get help from a **qualified nonprofit organization**. That is a charitable or religious group that:\n\n* Is a 501(c)(3) tax-exempt organization, **and**\n* Helps parents arrange temporary care for their children with this kind of form\n\nBefore you sign, the nonprofit checks the background of the person who will care for your children and trains them.\n": 'La ley de West Virginia que rige este formulario se aplica a los padres que reciben ayuda de una **organización sin fines de lucro que cumple los requisitos**. Se trata de un grupo benéfico o religioso que:\n\n* Está exento de impuestos conforme a la sección 501(c)(3), **y**\n* Ayuda a los padres a organizar el cuidado temporal de sus hijos mediante este tipo de formulario\n\nAntes de que usted firme, la organización verifica los antecedentes de la persona que cuidará de sus hijos y le proporciona capacitación.\n', 'What is a qualified nonprofit organization?\n': '¿Qué es una organización sin fines de lucro que cumple los requisitos?\n', 'Is a nonprofit helping you set this up?\n': '¿Una organización sin fines de lucro le está ayudando a hacer estos arreglos?\n', 'Yes, a nonprofit is helping me': 'Sí, una organización sin fines de lucro me está ayudando', "I'm not sure": 'No estoy seguro', "What is the nonprofit's name?": '¿Cómo se llama la organización sin fines de lucro?', 'Ask the organization:\n\n1. Are you a 501(c)(3) nonprofit?\n2. Will you do a background check on the person who will care for my children, and train them, before I sign?\n\nIf the answer to both is yes, it most likely counts.\n': 'Pregúntele a la organización:\n\n1. ¿Es una organización sin fines de lucro conforme a la sección 501(c)(3)?\n2. Antes de que yo firme, ¿verificará los antecedentes de la persona que cuidará de mis hijos y le proporcionará capacitación?\n\nSi responde que sí a ambas preguntas, lo más probable es que cumpla los requisitos.\n', 'How do I know if the group helping me counts?\n': '¿Cómo sé si el grupo que me ayuda cumple los requisitos?\n', 'Street address': 'Dirección', 'Zip code': 'Código postal', 'Choose one': 'Elija una opción', 'General Powers': 'Facultades generales', 'Only the powers I list': 'Solo las facultades que enumere', 'Start': 'Inicio', 'On a future date I choose': 'En una fecha futura que yo elija', 'Start month': 'Mes de inicio', 'Start day': 'Día de inicio', 'End month': 'Mes de finalización', 'End day': 'Día de finalización', 'This form is only for children under 18.\n': 'Este formulario solo es para menores de 18 años.\n', 'Review your form\n': 'Revise su formulario\n', 'Check that everything is correct. Click **Edit** to change an answer.\n': 'Compruebe que todo esté correcto. Haga clic en **Editar** para cambiar una respuesta.\n', 'Edit your name\n': 'Editar su nombre\n', 'Edit your children\n': 'Editar a sus hijos\n', 'Edit caregiver information\n': 'Editar información de la persona cuidadora\n', 'Almost done ': 'Ya casi termina ', 'Children addendum': 'Anexo de menores', 'Next steps\n': 'Próximos pasos\n', 'Filled form (signature still required)\n': 'Formulario completado (aún requiere firma)\n', 'All forms. Sign in front of a notary.\n': 'Todos los formularios. Firme ante un notario.\n', 'Your form\n': 'Su formulario\n', 'A notary is a person who watches you sign and verifies you are who you say you are. You and the caregiver must both sign this form in front of a notary.\n\nYou can find a notary:\n\n* At most banks and credit unions. It is often free if you have an account there.\n* At some shipping stores, libraries, and law offices.\n* By using the [West Virginia notary search](https://apps.sos.wv.gov/business/notary). Pick your county to see notaries near you.\n\n**Before you go:**\n\n* Call ahead to make sure a notary will be there.\n* Bring a photo ID, such as a license or a passport. The caregiver needs to bring one too.\n* If you do not have one of these documents, you can bring a witness to swear you are who you say you are. The witness cannot be the caregiver.\n* Do not sign the form until you are in front of the notary.\n': 'Un notario es una persona que observa su firma y verifica que usted sea quien dice ser. Usted y la persona cuidadora deben firmar este formulario ante un notario.\n\nPuede encontrar un notario:\n\n* En la mayoría de los bancos y cooperativas de crédito. A menudo es gratis si tiene una cuenta allí.\n* En algunas tiendas de envíos, bibliotecas y oficinas de abogados.\n* Mediante la [búsqueda de notarios de West Virginia](https://apps.sos.wv.gov/business/notary). Elija su condado para encontrar notarios cercanos.\n\n**Antes de ir:**\n\n* Llame con anticipación para asegurarse de que haya un notario disponible.\n* Lleve una identificación con foto, como una licencia de conducir o un pasaporte. La persona cuidadora también debe llevar una.\n* Si no tiene uno de estos documentos, puede llevar a un testigo que declare bajo juramento que usted es quien dice ser. Ese testigo no puede ser la persona cuidadora.\n* No firme el formulario hasta que esté ante el notario.\n', 'How do I find a notary?\n': '¿Cómo encuentro un notario?\n', 'North Dakota form to give parental rights to someone else\n': 'Formulario de North Dakota para delegar facultades parentales a otra persona\n', 'Choose someone to care for your child': 'Elija a alguien para que cuide de su hijo', "This form lets you choose another person to make decisions for your child.\n\nYou can use this form if you are a parent or legal guardian. You can give away some or all of your parental rights and responsibilities. The person you choose will not be able to allow your child to marry or be adopted.\n\nYou can give someone the ability to make decisions for six months or less. If you need someone to make decisions for longer than six months, you may need a [guardianship](https://www.ndcourts.gov/legal-self-help/minor-guardianship).\n\n### Before you get started\n- Have your child(ren)'s names and birth dates.\n- Have the name and address of the person you choose to care for your child(ren).\n- Make sure the person you choose is age 18 or older.\n\n### When you are finished\n- Sign the form in front of a notary public or court clerk to make it official.\n- Give copies to the person you have chosen and keep one for your records.\n": 'Este formulario le permite elegir a otra persona para que tome decisiones por su hijo.\n\nPuede usarlo si es padre, madre o tutor legal. Puede delegar algunas o todas sus facultades y responsabilidades parentales. La persona elegida no podrá autorizar el matrimonio ni la adopción de su hijo.\n\nPuede otorgar autoridad para tomar decisiones durante seis meses o menos. Si necesita que alguien tome decisiones durante más de seis meses, quizás necesite una [tutela](https://www.ndcourts.gov/legal-self-help/minor-guardianship).\n\n### Antes de comenzar\n- Tenga a mano los nombres y las fechas de nacimiento de sus hijos.\n- Tenga el nombre y la dirección de la persona que elija para cuidar de sus hijos.\n- Asegúrese de que esa persona tenga 18 años o más.\n\n### Cuando termine\n- Firme el formulario ante un notario público o el secretario del tribunal para formalizarlo.\n- Entregue copias a la persona elegida y guarde una para sus archivos.\n', 'Before you start\n': 'Antes de empezar', "Let's make sure this is the right form for you.\n": 'Asegurémonos de que este sea el formulario adecuado para usted.\n', "Contact your child's school, doctor, or day care to see if they will accept a power of attorney. This form is called a power of attorney. Some places will not accept this form.\n": 'Comuníquese con la escuela, el médico o la guardería de su hijo para preguntar si aceptarán un poder. Este formulario se llama poder. Algunas instituciones no lo aceptan.\n', "Will your child's school or provider accept a power of attorney form?": '¿La escuela o el proveedor de su hijo aceptará un formulario de poder?', 'For how long do you want to give your power?': '¿Durante cuánto tiempo desea delegar su autoridad?', 'Six months or less': 'Seis meses o menos', 'Longer than six months': 'Más de seis meses', 'This is not the right form for you.': 'Este no es el formulario adecuado para usted.', "You might need a different form if:\n\n* Your child's school or provider does not accept a power of attorney\n\n* You want to delegate your power for more than six months\n\n* To learn more, visit the North Dakota courts web page on [minor guardianships](https://www.ndcourts.gov/legal-self-help/minor-guardianship).\n": 'Quizás necesite otro formulario si:\n\n* La escuela o el proveedor de su hijo no acepta un poder\n\n* Desea delegar su autoridad por más de seis meses\n\n* Para obtener más información, visite la página de los tribunales de North Dakota sobre [tutelas de menores](https://www.ndcourts.gov/legal-self-help/minor-guardianship).\n', 'Age of caretaker': 'Edad de la persona cuidadora', 'How old is the person you will choose to care for your child(ren)?': '¿Qué edad tiene la persona que elegirá para cuidar de sus hijos?', '18 or older': '18 años o más', 'Under 18': 'Menor de 18 años', 'You will need to choose someone else': 'Deberá elegir a otra persona', 'The caretaker must be age 18 or older. If you want to choose someone else, click undo. If you cannot choose someone over 18, click exit.': 'La persona cuidadora debe tener 18 años o más. Si desea elegir a otra persona, haga clic en Deshacer. Si no puede elegir a una persona mayor de 18 años, haga clic en Salir.', 'Your name\n': 'Su nombre\n', 'What is your name?': '¿Cómo se llama usted?', 'Relationship\n': 'Parentesco o relación\n', 'What is your relationship to the children?\n': '¿Cuál es su parentesco o relación con los menores?\n', 'I am a parent': 'Soy el padre o la madre', 'I am a legal guardian': 'Soy el tutor legal', 'Your Address\n': 'Su dirección\n', 'What is your address?': '¿Cuál es su dirección?', 'Choose which rights and responsibilities to give\n': 'Elija qué facultades y responsabilidades desea delegar\n', 'Would you like to give all the rights and responsibilities that you have as a parent or guardian?\n': '¿Desea delegar todas las facultades y responsabilidades que tiene como padre, madre o tutor?\n', 'Yes, give all rights.': 'Sí, delegar todas las facultades.', 'The caretaker will not be able to allow your child to marry or be adopted.': 'La persona cuidadora no podrá autorizar el matrimonio ni la adopción de su hijo.', 'No, I need to choose specific rights.': 'No, necesito elegir facultades específicas.', 'Choose the rights you want to give:': 'Elija las facultades que desea delegar:', 'Education decisions': 'Decisiones educativas', 'Consent for activities': 'Consentimiento para actividades', 'Health care decisions': 'Decisiones sobre atención médica', 'Power to sign other documents': 'Facultad para firmar otros documentos', 'Other (fill in below):': 'Otra (complete abajo):', 'Describe the rights you want to give:': 'Describa las facultades que desea delegar:', 'Length of time\n': 'Duración\n', 'When do you want this to end?': '¿Cuándo desea que termine?', 'Must be within 6 months.': 'Debe ser dentro de los próximos 6 meses.', 'Email contact\n': 'Contacto por correo electrónico\n', 'What is your email address?': '¿Cuál es su dirección de correo electrónico?', 'Notary Information (optional)\n': 'Información del notario (opcional)\n', 'If you are with a notary now, fill in the information below. If you are with a court clerk, click Next.\n': 'Si está con un notario ahora, complete la información de abajo. Si está con el secretario del tribunal, haga clic en Siguiente.\n', 'Date of notary signing': 'Fecha de firma del notario', 'Notary commission expiration date': 'Fecha de vencimiento de la comisión del notario', 'Where are you signing this form?': '¿Dónde está firmando este formulario?', 'Choose your county:': 'Elija su condado:', 'Adams County': 'Condado de Adams', 'Barnes County': 'Condado de Barnes', 'Benson County': 'Condado de Benson', 'Billings County': 'Condado de Billings', 'Bottineau County': 'Condado de Bottineau', 'Bowman County': 'Condado de Bowman', 'Burke County': 'Condado de Burke', 'Burleigh County': 'Condado de Burleigh', 'Cass County': 'Condado de Cass', 'Cavalier County': 'Condado de Cavalier', 'Dickey County': 'Condado de Dickey', 'Divide County': 'Condado de Divide', 'Dunn County': 'Condado de Dunn', 'Eddy County': 'Condado de Eddy', 'Emmons County': 'Condado de Emmons', 'Foster County': 'Condado de Foster', 'Golden Valley County': 'Condado de Golden Valley', 'Grand Forks County': 'Condado de Grand Forks', 'Grant County': 'Condado de Grant', 'Griggs County': 'Condado de Griggs', 'Hettinger County': 'Condado de Hettinger', 'Kidder County': 'Condado de Kidder', 'LaMoure County': 'Condado de LaMoure', 'Logan County': 'Condado de Logan', 'McHenry County': 'Condado de McHenry', 'McIntosh County': 'Condado de McIntosh', 'McKenzie County': 'Condado de McKenzie', 'McLean County': 'Condado de McLean', 'Mercer County': 'Condado de Mercer', 'Morton County': 'Condado de Morton', 'Mountrail County': 'Condado de Mountrail', 'Nelson County': 'Condado de Nelson', 'Oliver County': 'Condado de Oliver', 'Pembina County': 'Condado de Pembina', 'Pierce County': 'Condado de Pierce', 'Ramsey County': 'Condado de Ramsey', 'Ransom County': 'Condado de Ransom', 'Renville County': 'Condado de Renville', 'Richland County': 'Condado de Richland', 'Rolette County': 'Condado de Rolette', 'Sargent County': 'Condado de Sargent', 'Sheridan County': 'Condado de Sheridan', 'Sioux County': 'Condado de Sioux', 'Slope County': 'Condado de Slope', 'Stark County': 'Condado de Stark', 'Steele County': 'Condado de Steele', 'Stutsman County': 'Condado de Stutsman', 'Towner County': 'Condado de Towner', 'Traill County': 'Condado de Traill', 'Walsh County': 'Condado de Walsh', 'Ward County': 'Condado de Ward', 'Wells County': 'Condado de Wells', 'Williams County': 'Condado de Williams', 'How many children do you have?\n': '¿Cuántos hijos tiene?\n', 'Name of notary or court clerk\n': 'Nombre del notario o del secretario del tribunal\n', 'What is your name?\n': '¿Cómo se llama usted?\n', 'What is your phone number?': '¿Cuál es su número de teléfono?', 'Edit attorney_in_fact\n': 'Editar al apoderado\n', 'Are you ready to sign now?': '¿Está listo para firmar ahora?', 'You need to sign this form in front of a notary or a court clerk. If you are not ready, you can print the form and sign it later.': 'Debe firmar este formulario ante un notario o el secretario del tribunal. Si aún no está listo, puede imprimirlo y firmarlo después.', 'Are you with a notary or court clerk now?': '¿Está ahora con un notario o el secretario del tribunal?', 'You are almost done': 'Ya casi termina', 'ND Power of Attorney Minor Short Form v2\n': 'Poder para un menor de North Dakota, formulario breve, versión 2\n', 'nd power of attorney minor short form v2': 'poder para un menor de North Dakota, formulario breve, versión 2', 'Nd power of attorney minor short form v2\n': 'Poder para un menor de North Dakota, formulario breve, versión 2\n', "Check the child's age": 'Compruebe la edad del menor', "The birthdate you entered says that this child\nor ward is older than 18.\n\nThis form is for appointing a caregiver for\na minor. Please review the child's information before\ncontinuing.\n": 'La fecha de nacimiento que ingresó indica que este hijo o persona bajo tutela tiene más de 18 años.\n\nEste formulario es para designar a una persona cuidadora para un menor. Revise la información del menor antes de continuar.\n', 'Change the number of children': 'Cambiar el número de menores', 'Exit interview': 'Salir de la entrevista', 'Delegate temporary authority for your child’s care\n': 'Delegue temporalmente la autoridad para cuidar de su hijo\n', 'A biological or adoptive parent.\n': 'El padre o la madre biológicos o adoptivos.\n', 'Someone a court picked to care for a child and make choices for them.\n': 'Una persona elegida por un tribunal para cuidar de un menor y tomar decisiones por él.\n', 'custodian': 'custodio', 'Someone who is not a parent that has been given legal and physical custody by a court.\n': 'Una persona que no es el padre ni la madre y a quien un tribunal le ha otorgado la custodia legal y física del menor.\n', 'ward': 'persona bajo tutela', 'A child who is appointed a guardian.\n': 'Un menor para quien se ha designado un tutor.\n', 'parental powers': 'facultades parentales', 'The rights and responsibilities a parent has to care and make decisions about the health, education, and safety of their child.\n': 'Los derechos y las responsabilidades que tiene un padre o una madre para cuidar de su hijo y tomar decisiones sobre su salud, educación y seguridad.\n', 'A person who is 18 years or older that you want to give parental powers to.\n': 'Una persona de 18 años o más a quien desea otorgar facultades parentales.\n', 'NJ Temporary Caregiver Form': 'Formulario de persona cuidadora temporal de New Jersey', 'Fill out this form if you are a {parent}, {custodian}, or {guardian} of a minor child or {ward} in NJ wishing to temporarily give {parental powers} to someone else.\n\n### Before you get started\n* Collect names, addresses and phone numbers of the\n    * Person you share custody with (if applicable),\n    * {Caregiver} and\n    * Alternate caregiver\n* Collect names and birthdates of your children or wards.\n\n### Important information to know\n* You do not lose any of your parental powers when you give a caregiver power to care for your child through this form.\n* You can only give the caregiver powers that you have.\n* The caregiver you choose must be at least 18 years old.\n* The caregiver will have the powers for up to one year from the date of an event you will choose in this form.\n* You can renew the powers by repeating this process.\n* You can take back the powers at any time by telling the caregiver.\n\n### When you are finished\n* Sign the form in the presence of two witnesses. \n* The person you share custody with must also sign, if applicable. \n* A notary may also be needed, depending on the powers you give.\n* Give a copy to the caregiver and keep a copy for yourself.\n': 'Complete este formulario si es {padre o madre}, {custodio} o {tutor} de un menor o una {persona bajo tutela} en New Jersey y desea delegar temporalmente {facultades parentales} a otra persona.\n\n### Antes de comenzar\n* Reúna los nombres, las direcciones y los números de teléfono de:\n    * La persona con quien comparte la custodia, si corresponde\n    * La {persona cuidadora}\n    * La persona cuidadora suplente\n* Reúna los nombres y las fechas de nacimiento de sus hijos o de las personas bajo su tutela.\n\n### Información importante que debe saber\n* No pierde ninguna de sus facultades parentales al otorgarle a una persona cuidadora la autoridad para cuidar de su hijo mediante este formulario.\n* Solo puede otorgarle las facultades que usted tiene.\n* La persona cuidadora que elija debe tener al menos 18 años.\n* La persona cuidadora tendrá las facultades por un máximo de un año a partir de un hecho que usted elegirá en este formulario.\n* Puede renovar las facultades repitiendo este proceso.\n* Puede revocar las facultades en cualquier momento informándoselo a la persona cuidadora.\n\n### Cuando termine\n* Firme el formulario en presencia de dos testigos.\n* La persona con quien comparte la custodia también debe firmar, si corresponde.\n* También puede ser necesario un notario, según las facultades que otorgue.\n* Entregue una copia a la persona cuidadora y guarde otra para usted.\n', 'Are you a parent, custodian or guardian?': '¿Usted es padre, madre, custodio o tutor?', 'What is your phone number?\n': '¿Cuál es su número de teléfono?\n', 'How many children or wards are you appointing a caregiver for?': '¿Para cuántos hijos o personas bajo su tutela está designando a una persona cuidadora?', 'This form is not right for you\n': 'Este formulario no es el adecuado para usted\n', 'This form is for parents, guardians, and custodians of a minor child or ward in NJ who want to temporarily give parental powers to someone else.\n\nBased on your answer, this form is not right for you.\n': 'Este formulario es para padres, tutores y custodios de un menor o una persona bajo tutela en New Jersey que desean delegar temporalmente facultades parentales a otra persona.\n\nSegún su respuesta, este formulario no es adecuado para usted.\n', 'Caregiver screens': 'Pantallas de la persona cuidadora', 'Caregiver \n': 'Persona cuidadora \n', 'Alternate caregiver': 'Persona cuidadora suplente', 'Food, shelter, mental and physical safety, etc.': 'Alimentos, vivienda, seguridad física y mental, etc.', 'Make education decisions': 'Tomar decisiones educativas', 'Enrollment, access to school records, sign permission slips, any and all decisions about school, including special education.': 'Inscripción, acceso a los expedientes escolares, firma de permisos y todas las decisiones escolares, incluidas las de educación especial.', 'Make medical, dental, and mental health decisions': 'Tomar decisiones médicas, dentales y de salud mental', 'Including signing of documents, waivers and releases, access to medical records, admitting or discharge from any hospital or medical care facility, meetings with any health care provider, consenting, withholding, changing or withdrawal of procedures.': 'Incluye firmar documentos, renuncias y autorizaciones; acceder a expedientes médicos; autorizar ingresos o altas de hospitales o centros médicos; reunirse con proveedores de atención médica; y otorgar, negar, modificar o retirar el consentimiento para procedimientos.', 'Make travel and related decisions ': 'Tomar decisiones sobre viajes y asuntos relacionados ', 'For example, hotel rooms. This applies to both national and international travel.': 'Por ejemplo, habitaciones de hotel. Esto se aplica a viajes nacionales e internacionales.', 'Make financial and legal decisions ': 'Tomar decisiones financieras y legales ', 'Make other decisions ': 'Tomar otras decisiones ', 'All of the above': 'Todas las anteriores', 'These powers will start when\n': 'Estas facultades comenzarán cuando\n', 'This form is signed': 'Se firme este formulario', 'An event I choose on the next screen happens': 'Ocurra un hecho que elegiré en la siguiente pantalla', 'One year after your choice above.\n': 'Un año después de lo que eligió arriba.\n', 'When will they end?': '¿Cuándo terminarán?', 'The caregiver powers should start if I\n': 'Las facultades de la persona cuidadora deben comenzar si yo\n', 'If you select more than one, the one-year period begins when the first event occurs.': 'Si selecciona más de uno, el período de un año comienza cuando ocurra el primer hecho.', 'Am in immigration detention, removed, or deported': 'Estoy en detención migratoria, soy expulsado o deportado', 'Am arrested': 'Soy arrestado', 'Am sent to serve in the military': 'Soy enviado a prestar servicio militar', 'Die and have made no other arrangements': 'Fallezco sin haber hecho otros arreglos', 'Other': 'Otro', 'Describe the other event': 'Describa el otro hecho', 'Keep this short. The form has room for about 100 characters.': 'Sea breve. El formulario tiene espacio para unos 100 caracteres.', 'Do you share custody with anyone?': '¿Comparte la custodia con alguien?', 'When you share custody with someone, generally they must also sign this form. If you select no, you will be asked to select or write a reason or reasons why they will not sign. Some reasons include that the person is unreachable, cannot be located, unable to consent because of a disability, etc.\n': 'Cuando comparte la custodia con otra persona, por lo general esa persona también debe firmar este formulario. Si selecciona que no, deberá seleccionar o escribir los motivos por los que no firmará. Por ejemplo, no se puede comunicar con esa persona, no se la puede localizar o no puede dar su consentimiento debido a una discapacidad.\n', 'Help me decide': 'Ayúdeme a decidir', 'Do not have custody': 'No tiene la custodia', 'Are mentally or physically unable to consent': 'No puede dar su consentimiento debido a una incapacidad mental o física', 'Have died': 'Ha fallecido', 'For at least the last 2 years or 1/3 of the child’s life (whichever is less).': 'Durante al menos los últimos 2 años o un tercio de la vida del menor, el período que sea más corto.', 'Cannot be located': 'No se puede localizar', 'Are unreachable': 'No se puede contactar', 'Keep this short. The form has room for about 450 characters.': 'Sea breve. El formulario tiene espacio para unos 450 caracteres.', 'Other explanation': 'Otra explicación', 'Keep this short. The form has room for about 400 characters.': 'Sea breve. El formulario tiene espacio para unos 400 caracteres.', 'I have sole custody, because the other parent\n': 'Tengo la custodia exclusiva porque el otro padre o la otra madre\n', 'Is unknown': 'Es desconocido', 'Does not have custody': 'No tiene la custodia', 'Has died': 'Ha fallecido', '**Why you have sole custody**\n\nEdit the reasons\n': '**Por qué tiene la custodia exclusiva**\n\nEditar los motivos\n', 'Edit children information\n': 'Editar información de los menores\n', 'Edit person you share custody with information\n': 'Editar información de la persona con quien comparte la custodia\n', 'Edit your information\n': 'Editar su información\n', 'Edit alternate caregiver information\n': 'Editar información de la persona cuidadora suplente\n', 'Form Complete!\n': '¡Formulario completado!\n', 'NJ Power of Attorney Delegation Fillable-with-fields-with-fields9-19\n': 'Poder de delegación de New Jersey, formulario con campos 9-19\n', 'NJ Power of Attorney Delegation': 'Poder de delegación de New Jersey', 'nj power of attorney delegation fillablewithfieldswithfields919 next steps': 'próximos pasos del formulario de poder de delegación de New Jersey', 'Next Steps\n': 'Próximos pasos\n', 'Al next steps intro prompt': 'Indicación inicial de los próximos pasos', 'Petition for temporary guardian appointment\n': 'Solicitud de designación de un tutor temporal\n', 'Get a temporary guardian for my child in Connecticut': 'Obtenga un tutor temporal para su hijo en Connecticut', "## Before you get started\n- Make sure you have the child's birth certificate and the Affidavit Concerning Children (JD-FM-164).\n- Get all information about the child and the proposed guardian.\n\n## When you are finished\n- Submit the completed petition along with the required documents to the appropriate probate court. There will be a document at the end of the interview that will tell you what to do next. \n\nYou can use this form if you are a parent or a court-appointed guardian of a minor. Make sure to file it in the probate district where the child resides. \n": '## Antes de comenzar\n- Asegúrese de tener el acta de nacimiento del menor y la Declaración jurada sobre menores (JD-FM-164).\n- Reúna toda la información sobre el menor y la persona propuesta como tutor.\n\n## Cuando termine\n- Presente la solicitud completada junto con los documentos requeridos ante el tribunal de sucesiones correspondiente. Al final de la entrevista habrá un documento que le indicará qué hacer después.\n\nPuede usar este formulario si es padre, madre o tutor designado por un tribunal para un menor. Asegúrese de presentarlo en el distrito judicial de sucesiones donde reside el menor. \n', 'Petition details\n': 'Detalles de la solicitud\n', 'Click this link to figure out which court name and district number is right for your petition: \n[CT probate court locator](https://www.ctprobate.gov/court-locator)': 'Haga clic en este enlace para determinar el nombre del tribunal y el número de distrito correspondientes a su solicitud:\n[Buscador de tribunales de sucesiones de Connecticut](https://www.ctprobate.gov/court-locator)', 'Probate court name': 'Nombre del tribunal de sucesiones', 'District number': 'Número de distrito', 'Child information\n': 'Información del menor\n', "Child's last name (In the matter of)": 'Apellido del menor (en el asunto de)', 'when was the child born?': '¿Cuándo nació el menor?', 'Where does the child live?': '¿Dónde vive el menor?', "what is the address of child's permanent home? (if different from where child lives)": '¿Cuál es la dirección del hogar permanente del menor, si es diferente de donde vive?', 'where is the child while this form is being filled out (if different from where child lives)': '¿Dónde se encuentra el menor mientras se completa este formulario, si es diferente de donde vive?', "Who is filling out this form? the child's Parent or a Court-appointed guardian? ": '¿Quién está completando este formulario: el padre o la madre del menor, o un tutor designado por el tribunal? ', 'Parent or Court-appointed guardian ': 'Padre, madre o tutor designado por el tribunal ', 'Court-Appointed Guardian': 'Tutor designado por el tribunal', 'Telephone number': 'Número de teléfono', 'Proposed temporary guardian information': 'Información de la persona propuesta como tutor temporal', 'Proposed Temporary Guardian name': 'Nombre de la persona propuesta como tutor temporal', 'Proposed Temporary Guardian telephone number': 'Teléfono de la persona propuesta como tutor temporal', 'Proposed Temporary Guardian date of birth ': 'Fecha de nacimiento de la persona propuesta como tutor temporal ', "Child's parents information\n": 'Información de los padres del menor\n', 'List ALL people who have guardianship rights over the child. (For each person, list name, address, telephone number, including the date of birth for any person who is under the age of 18, any person in the military service\nor any person under conservatorship or legal disability)\n': 'Enumere a TODAS las personas que tengan derechos de tutela sobre el menor. Para cada persona, indique su nombre, dirección y teléfono. Incluya la fecha de nacimiento de toda persona menor de 18 años, que preste servicio militar o que esté bajo curatela o tenga una incapacidad legal.\n', "Mother's details": 'Datos de la madre', "Father's details (if you do not know, write unknown status)": 'Datos del padre (si no los conoce, escriba «Unknown», que significa «desconocido»)', 'Guardians of the minor child': 'Tutores del menor', 'Reasons for guardianship\n': 'Motivos de la tutela\n', 'Illness, absence from the area, military leave, other ': 'Enfermedad, ausencia de la zona, servicio militar u otro motivo ', 'Why are you making this request for guardianship?': '¿Por qué solicita esta tutela?', 'Legal proceedings\n': 'Procedimientos judiciales\n', 'Has the child been living in Connecticut for the past 6 months?': '¿El menor ha vivido en Connecticut durante los últimos 6 meses?', 'Is anyone fighting over or going to court about custody of this child, in any state?': '¿Alguien está disputando la custodia de este menor o acudiendo a un tribunal por ella, en cualquier estado?', 'Has there been a proceeding in the past in Connecticut or any state affecting the custody of the child?': '¿Ha habido antes algún procedimiento en Connecticut u otro estado que afectara la custodia del menor?', 'Is there a current safety or service agreement between the Department of Children and Families and the parent/guardian of the minor child?': '¿Existe actualmente un acuerdo de seguridad o de servicios entre el Departamento de Niños y Familias y el padre, la madre o el tutor del menor?', 'Does anyone involved have a a current protective or restraining order? (if YES you must bring it to the court)': '¿Alguna de las personas involucradas tiene una orden de protección o de restricción vigente? Si responde que SÍ, debe llevarla al tribunal.', 'Has the court ordered someone to pay child support for this child?': '¿El tribunal le ha ordenado a alguien pagar la manutención de este menor?', 'When should the guardianship end? (1 year at most)\n': '¿Cuándo debe terminar la tutela? Un año como máximo.\n', 'Guardianship end date': 'Fecha de finalización de la tutela', 'Petition Appointment of TG CT PC-504 with fields\n': 'Solicitud de designación de tutor temporal de Connecticut, PC-504, con campos\n', 'All forms to deliver to court\n': 'Todos los formularios para entregar al tribunal\n', 'petition appointment of tg ct pc504 with fields': 'solicitud de designación de tutor temporal de Connecticut, PC-504, con campos', 'Delegate parental power effectively\n': 'Delegue eficazmente las facultades parentales\n', 'Colorado Delegation of Guardian\n': 'Delegación de facultades por parte del padre, la madre o el tutor (Colorado)\n', '### Before you get started\n- Carefully choose your "Attorney in Fact", who will be the caregiver.\n- Locate a notary for the form.\n\n### When you are finished\n- Sign the document in front of a notary public.\n- Give the signed, notarized original to the named Attorney in Fact and keep a copy for your records.\n\nUse this form if you are a parent or guardian who needs to temporarily delegate your power. It is important to make sure that the person you are naming is trustworthy and can handle the responsibilities.\n': '### Antes de comenzar\n- Elija cuidadosamente a su «apoderado», quien será la persona cuidadora.\n- Busque un notario para el formulario.\n\n### Cuando termine\n- Firme el documento ante un notario público.\n- Entregue el original firmado y certificado por el notario al apoderado designado y guarde una copia para sus archivos.\n\nUse este formulario si es padre, madre o tutor y necesita delegar temporalmente su autoridad. Es importante asegurarse de que la persona designada sea de confianza y pueda asumir las responsabilidades.\n', 'Parent/Guardian Information\n': 'Información del padre, de la madre o del tutor\n', 'What is your relationship to the child?': '¿Cuál es su parentesco o relación con el menor?', 'Guardian': 'Tutor', 'Date of parent or guardian signature': 'Fecha de firma del padre, de la madre o del tutor', 'How long would you like this person to take care of the child?\n': '¿Por cuánto tiempo desea que esta persona cuide del menor?\n', 'When should this permission end? Enter a date up to 12 months after you sign this form.\n': '¿Cuándo debe terminar esta autorización? Ingrese una fecha que no supere los 12 meses después de firmar este formulario.\n', 'When would you like the permission to end?': '¿Cuándo desea que termine la autorización?', 'Is there a notary with you?': '¿Hay un notario con usted?', 'When and where was this document notarized?\n': '¿Cuándo y dónde se certificó este documento ante notario?\n', 'State where notarization occurred': 'Estado donde se realizó la certificación notarial', 'Day of notarization': 'Día de la certificación notarial', 'Month of notarization': 'Mes de la certificación notarial', 'Year of notarization': 'Año de la certificación notarial', 'Expiration of notarization': 'Fecha de vencimiento de la comisión del notario', 'Edit notarized\n': 'Editar datos de la certificación notarial\n', 'colorado delegation of guardian': 'Delegación de facultades por parte del padre, la madre o el tutor (Colorado)', 'File a Petition for Temporary Guardianship in Georgia\n': 'Presente una solicitud de tutela temporal en Georgia\n', 'Petition For Temporary Letters of Guardianship of Minor in Georgia': 'Solicitud de documentos de nombramiento de tutor temporal de un menor en Georgia', "## What is this form?\n- Use this form to ask the court to name you as a child's temporary guardian. The child's parents must agree to the guardianship. If a parent does not agree, the court will want to know why and may not accept this form. \n\n## Who should be filling out this form?\n- This form is for the person who wants to become the child's temporary guardian.\n  \n## Why would I use this form? \n- You would use this form to legally step in and care for a child when their parents are temporarily unable to care for them, but the parents are still willing to cooperate or keep their parental rights.\n- This form could be used for medical decisions, school enrollment, if a parent becomes sick, or making everyday life decisions for the child. \n  \n## To fill in the form:\n- Have information about the child and both parents ready.\n- Make sure you have a copy of the child's birth certificate. If you don't, you might risk the court rejecting the form or taking longer to process your request. \n- You may include copies of other documents, like a custody order or a parent's death certificate. If you don't have copies of other documents, you can still file this form without them.\n\n## When you are finished:\n- Check your answers, then print at least three copies of the form.\n- You can sign the papers ahead of time in front of a Notary Public (a person at a bank or store who officially stamps legal papers). Or, you can bring everyone to the court house and sign them in front of a court clerk. No matter what, you cannot sign the papers alone at home —an official person must watch you write your name.\n- File the signed form with the Probate Court in your county.\n- Keep a copy for yourself. \n": '## ¿Qué es este formulario?\n- Use este formulario para pedirle al tribunal que le nombre tutor temporal de un menor. Los padres del menor deben estar de acuerdo con la tutela. Si uno de los padres no está de acuerdo, el tribunal querrá saber por qué y es posible que no acepte este formulario. \n\n## ¿Quién debe completar este formulario?\n- Este formulario es para la persona que desea ser el tutor temporal del menor.\n  \n## ¿Por qué usaría este formulario?\n- Use este formulario para hacerse cargo legalmente del cuidado de un menor cuando sus padres no puedan cuidarlo temporalmente, pero aún estén dispuestos a cooperar o conserven sus derechos parentales.\n- Puede usarse para tomar decisiones médicas, inscribir al menor en la escuela, atenderlo si uno de los padres se enferma o tomar decisiones de la vida diaria por él. \n  \n## Para completar el formulario:\n- Tenga lista la información del menor y de ambos padres.\n- Asegúrese de tener una copia del acta de nacimiento del menor. Si no la tiene, existe el riesgo de que el tribunal rechace el formulario o tarde más en tramitar su solicitud.\n- Puede incluir copias de otros documentos, como una orden de custodia o el certificado de defunción de uno de los padres. Si no tiene copias de esos otros documentos, aun así puede presentar este formulario.\n\n## Cuando termine:\n- Revise sus respuestas e imprima al menos tres copias del formulario.\n- Puede firmar los documentos por adelantado ante un notario público, una persona en un banco o una tienda que certifica documentos legales. O puede acudir al tribunal con todas las personas que deban firmar y hacerlo ante el secretario del tribunal. En ningún caso puede firmar los documentos a solas en su casa: una persona autorizada debe observar su firma.\n- Presente el formulario firmado ante el tribunal de sucesiones de su condado.\n- Guarde una copia para usted. \n', "Do You Have the Parent's Signed Consent?": '¿Tiene el consentimiento firmado del padre o de la madre?', "Before continuing, tell us if you have the parent's signed consent for the temporary guardianship.\n\nIf the parent agrees to the guardianship but has not signed yet  or if they are unable to be reached for some reason, you can still continue with this form.": 'Antes de continuar, indique si tiene el consentimiento firmado del padre o de la madre para la tutela temporal.\n\nSi el padre o la madre está de acuerdo con la tutela pero aún no ha firmado, o si por algún motivo no se puede contactar a esa persona, puede continuar con este formulario.', "Do you have the parent's signed consent?": '¿Tiene el consentimiento firmado del padre o de la madre?', "Why Don't You Have the Parent's Signed Consent?": '¿Por qué no tiene el consentimiento firmado del padre o de la madre?', 'There are a few reasons why a parent might not have signed the consent form yet:\n\n* They agree, but have not signed yet.\n* They refuse to sign because they do not want you to become guardian. \n* The parent is missing, in prison, or out of reach.\n* If you choose "other circumstances", make sure to write what those circumstances are later on in this form.': 'Hay varios motivos por los que el padre o la madre quizás no haya firmado aún el formulario de consentimiento:\n\n* Está de acuerdo, pero aún no ha firmado.\n* Se niega a firmar porque no quiere que usted sea el tutor.\n* No se sabe dónde está, está en prisión o no se le puede contactar.\n* Si elige «otras circunstancias», asegúrese de explicarlas más adelante en este formulario.', 'What is happening with the parent?': '¿Cuál es la situación del padre o de la madre?', 'Parent agrees but has not signed yet': 'El padre o la madre está de acuerdo, pero aún no ha firmado', 'Parent refuses to sign because they disagree': 'El padre o la madre se niega a firmar porque no está de acuerdo', 'Parent is missing or cannot be found': 'No se sabe dónde está el padre o la madre o no se le puede localizar', 'Other Circumstances': 'Otras circunstancias', 'If a parent who has full legal rights -- called a natural guardian -- says no to the temporary guardian request, the judge will throw out the request right away without having a court hearing.\n\nBut if a parent who doesn\'t have those full legal rights says no, the court will set up a meeting or hearing to talk about it. If that is the case, start the form again and make sure to choose "other circumstances". Write the information in the "Other information" section later on the form. \n\nIf the child is unsafe, you may need to seek help through Juvenile Court.\n\n* To learn more, visit the Georgia courts web page on [minor guardianships](https://www.fultonprobatega.org/208/Minor-Guardianship-Conservatorship).\n': 'Si un padre o una madre con plenos derechos legales, a quien se llama tutor natural, se opone a la solicitud de tutela temporal, el juez desestimará la solicitud de inmediato sin celebrar una audiencia judicial.\n\nPero si se opone un padre o una madre que no tiene esos plenos derechos legales, el tribunal programará una reunión o audiencia para tratar el asunto. En ese caso, comience el formulario de nuevo y asegúrese de elegir «otras circunstancias». Explíquelas en la sección «Otra información» más adelante en el formulario.\n\nSi el menor no está a salvo, quizás deba solicitar ayuda al tribunal de menores.\n\n* Para obtener más información, visite la página de los tribunales de Georgia sobre [tutelas de menores](https://www.fultonprobatega.org/208/Minor-Guardianship-Conservatorship).\n', "Answer these questions about yourself. You are asking to become the child's temporary guardian.": 'Responda estas preguntas sobre usted. Usted está solicitando ser el tutor temporal del menor.', 'What is your address?\n': '¿Cuál es su dirección?\n', "Will another person also serve as the child's temporary guardian?": '¿Otra persona también será tutor temporal del menor?', 'This could be a spouse, partner, or another person who will help you make decisions for the child.': 'Puede ser su cónyuge, su pareja u otra persona que le ayude a tomar decisiones por el menor.', 'Is there another temporary guardian?': '¿Hay otro tutor temporal?', "What is the other temporary guardian's name?": '¿Cómo se llama el otro tutor temporal?', "Child's Name": 'Nombre del menor', '**If you are filing a form for more than one child, you must complete a separate form for each child.**': '**Si va a presentar un formulario para más de un menor, debe completar un formulario separado para cada menor.**', 'Minor selection form ': 'Formulario de elección del menor ', 'Because the child is 14 or older, they are expected to fill out a "Minor Selection Form". This form is the teenager’s official way to tell the judge, "This is the adult I want to live with and take care of me."\n\nIf they don\'t fill out the form, the court will want to know why, so write that information into the "Other Information" section later in this form. \n\nYou can [download and print the Minor Selection Form in the temporary guardianship packet](https://www.gasupreme.us/wp-content/uploads/2017/06/GPCSF28_0717.pdf).': 'Como el menor tiene 14 años o más, se espera que complete un «Formulario de elección del menor» (Minor Selection Form). Mediante ese formulario, el adolescente le indica oficialmente al juez: «Este es el adulto con quien quiero vivir y que quiero que me cuide».\n\nSi no lo completa, el tribunal querrá saber por qué. Explíquelo en la sección «Otra información» más adelante en este formulario.\n\nPuede [descargar e imprimir el Formulario de elección del menor incluido en el paquete de tutela temporal](https://www.gasupreme.us/wp-content/uploads/2017/06/GPCSF28_0717.pdf).', 'What is your relationship to the child? ': '¿Cuál es su parentesco o relación con el menor? ', "If you do not know the mother's address, check the box below.\n": 'Si no conoce la dirección de la madre, marque la casilla de abajo.\n', 'Apartment or unit': 'Apartamento o unidad', 'ZIP code': 'Código postal', "Mother's address is unknown": 'Se desconoce la dirección de la madre', "Mother's Consent and Custody": 'Consentimiento y custodia de la madre', "If you do not have a signed consent form, you can print one from the court's website.": 'Si no tiene un formulario de consentimiento firmado, puede imprimir uno desde el sitio web del tribunal.', 'Ending parental rights means a court permanently cuts the legal relationship between a parent and child, taking away all rights to see or make decisions for the child so they can have a safe and stable home.': 'La terminación de los derechos parentales significa que un tribunal pone fin permanentemente a la relación legal entre un padre o una madre y su hijo. Le quita todos los derechos de ver al menor o de tomar decisiones por él para que pueda tener un hogar seguro y estable.', "Custody is the right of a parent to make major decisions about a child's life, like schooling and healthcare.": 'La custodia es el derecho de un padre o una madre a tomar decisiones importantes sobre la vida de un menor, como su educación y atención médica.', "Joint custody is an arrangement where both parents share the responsibility of making big decisions or splitting the child's living time.": 'La custodia compartida es un acuerdo por el que ambos padres comparten la responsabilidad de tomar decisiones importantes o se reparten el tiempo que el menor vive con cada uno.', "Sole custody is an arrangement where only one parent has the ability to make big decisions or serve as the child's primary home.": 'La custodia exclusiva es un acuerdo por el que solo uno de los padres puede tomar decisiones importantes o proporcionar el hogar principal del menor.', "Spouse's full name": 'Nombre completo del cónyuge', "Spouse's address": 'Dirección del cónyuge', "If you do not know the father's address, check the box below. You can leave the address fields blank.": 'Si no conoce la dirección del padre, marque la casilla de abajo. Puede dejar en blanco los espacios de la dirección.', "Father's address is unknown": 'Se desconoce la dirección del padre', "Explain why you are asking to become the child's temporary guardian.": 'Explique por qué solicita ser el tutor temporal del menor.', 'For example, this form could be used for:\n\n* Medical decisions\n* Enrolling a child in school\n* A parent is too sick to make decisions for the child\n* The parent needs help making decision for the child for some other reason\n\n  ': 'Por ejemplo, este formulario puede usarse para:\n\n* Tomar decisiones médicas\n* Inscribir a un menor en la escuela\n* Atender una situación en que un padre o una madre está demasiado enfermo para tomar decisiones por el menor\n* Ayudar a un padre o una madre a tomar decisiones por el menor por algún otro motivo\n\n  ', 'Why do you need to be a temporary guardian?': '¿Por qué necesita ser tutor temporal?', 'Other Information\n': 'Otra información\n', '**You can use this section to:**\n\n- Explain any missing information.\n- Give other details about the parent (like if a parent is in prison, living in a shelter, or deployed overseas)\n- If the parent did not sign a consent form, use this space to say why.\n- Sometimes, the judge needs to appoint a special, independent lawyer to speak up for a child or a parent. This is called a Guardian ad Litem. Use this section to let the Judge know if anyone needs that extra help.\n- If the child is 14 or older and did not fill out a "Minor Selection Form", use this spot to tell the judge why.': '**Puede usar esta sección para:**\n\n- Explicar cualquier información que falte.\n- Proporcionar otros datos sobre el padre o la madre, por ejemplo, si está en prisión, vive en un refugio o está destinado en el extranjero.\n- Explicar por qué el padre o la madre no firmó el formulario de consentimiento.\n- A veces el juez debe designar a un abogado especial e independiente para representar los intereses de un menor o de uno de sus padres. Esta persona se llama tutor ad litem (Guardian ad Litem). Use esta sección para informar al juez si alguien necesita esa ayuda adicional.\n- Explicar por qué el menor no completó el «Formulario de elección del menor» si tiene 14 años o más.', 'Other information (optional)': 'Otra información (opcional)', 'Do you have a lawyer?': '¿Tiene abogado?', 'Is a lawyer helping you with this form?': '¿Un abogado le está ayudando con este formulario?', "Lawyer's Name": 'Nombre del abogado', 'Fill in the name of the lawyer helping you with this form.\n': 'Ingrese el nombre del abogado que le ayuda con este formulario.\n', "Lawyer's Phone Number": 'Teléfono del abogado', "Lawyer's Office Address": 'Dirección de la oficina del abogado', "Lawyer's State Bar Number": 'Número de inscripción del abogado en el colegio de abogados estatal', 'State bar number': 'Número de inscripción en el colegio de abogados estatal', 'You can ask your lawyer for this number.': 'Puede pedirle este número a su abogado.', 'Court Information': 'Información del tribunal', 'If you live in Georgia and are filing this form in the county where you live, write that county below. \n\nIf you live in another state, you can still ask to be a temporary guardian in Georgia. You have to file the paperwork in the Georgia county where the child is right now, while you are taking care of them.': 'Si vive en Georgia y va a presentar este formulario en el condado donde vive, escriba ese condado abajo.\n\nSi vive en otro estado, también puede solicitar ser tutor temporal en Georgia. Debe presentar los documentos en el condado de Georgia donde se encuentra el menor mientras usted lo cuida.', 'Georgia county where you will file the form': 'Condado de Georgia donde presentará el formulario', 'Check your answers below. Click Edit to change your guardian information.\n': 'Revise sus respuestas de abajo. Haga clic en Editar para cambiar su información como tutor.\n', 'Edit guardian information\n': 'Editar información del tutor\n', 'Edit mothers\n': 'Editar datos de la madre\n', 'Edit fathers\n': 'Editar datos del padre\n', 'Edit attorneys\n': 'Editar los abogados\n', 'Your form is ready.': 'Su formulario está listo.', 'Next Step Instructions\n': 'Instrucciones de próximos pasos\n', 'Temporary Guardianship Form\n': 'Formulario de tutela temporal\n', 'Massachusetts Temporary Agent Form\n': 'Formulario de agente temporal de Massachusetts\n', "Someone who is legally a child's parent.\n": 'Una persona que es legalmente el padre o la madre de un menor.\n', 'legal custodian': 'custodio legal', 'Someone who has been given the legal right to care for a child.\n': 'Una persona a quien se le ha otorgado el derecho legal de cuidar de un menor.\n', 'appointing party': 'parte que otorga la autorización', 'The parent, legal guardian, or legal custodian who is picking someone to care for the child.\n': 'El padre, la madre, el tutor legal o el custodio legal que elige a alguien para cuidar del menor.\n', 'agent': 'agente', 'The adult you choose to take care of your child and make choices for your child while you are not able to. Your agent must be 18 or older and must agree to do this.\n': 'El adulto que usted elige para cuidar de su hijo y tomar decisiones por él cuando usted no pueda hacerlo. Su agente debe tener 18 años o más y aceptar esta responsabilidad.\n', 'temporary agent': 'agente temporal', 'The person you choose to care for your child and make choices for your child while you are not able to.\n': 'La persona que usted elige para cuidar de su hijo y tomar decisiones por él cuando usted no pueda hacerlo.\n', 'backup agent': 'agente suplente', 'A second person who can care for your child if the first person you choose is not available. The backup agent cannot act for you until you are detained or missing.\n': 'Una segunda persona que puede cuidar de su hijo si la primera persona elegida no está disponible. El agente suplente no puede actuar en su nombre hasta que usted esté detenido o no se sepa dónde está.\n', 'MA Temporary Agent Authorization Form': 'Formulario de autorización de agente temporal de Massachusetts', '### Is this form right for you?\n- You can use this form if you are a {parent}, {legal guardian}, or {legal custodian}. It lets you choose someone to care for your child if you are suddenly separated from your child. The person you choose is your {agent}. Your agent must understand and agree to the responsibilities.\n- This form only takes effect if:\n    - you are detained by law enforcement,\n    - you are deported from the United States, or\n    - your agent does not know where you are for 24 hours.\n- It does not take effect for other reasons, such as a medical procedure, an illness, or work travel.\n- Once it takes effect, it lasts for 60 days, unless you change or cancel it in writing before then.\n\n\n### What do you need to complete this form?\n- Two witnesses.\n- Each witness must be at least 18, and your {agent} cannot be one of them.\n- Have your {agent} agree.\n- Get the other parent’s written permission if they are alive, easy to find, and able and willing to care for your child.\n\n### When you are done\n- Have the form signed by witnesses and the chosen agent.\n- Have the form notarized.\n- Keep a copy for yourself and give copies to the chosen agent(s).\n\n': '### Is this form right for you?\n- Puede usar este formulario si es {padre o madre}, {tutor legal} o {custodio legal}. Le permite elegir a alguien para cuidar de su hijo si se separan de repente. La persona elegida será su {apoderado}. Debe comprender y aceptar las responsabilidades.\n- Este formulario solo entra en vigor si:\n    - las autoridades lo detienen,\n    - usted es deportado de Estados Unidos, o\n    - su apoderado no sabe dónde está usted durante 24 horas.\n- No entra en vigor por otros motivos, como un procedimiento médico, una enfermedad o un viaje de trabajo.\n- Una vez que entra en vigor, dura 60 días, a menos que usted lo modifique o cancele por escrito antes.\n\n\n### What do you need to complete this form?\n- Dos testigos.\n- Cada testigo debe tener al menos 18 años, y su {apoderado} no puede ser uno de ellos.\n- Obtenga la aceptación de su {apoderado}.\n- Obtenga el permiso escrito del otro padre o de la otra madre si vive, se le puede localizar fácilmente y puede y desea cuidar de su hijo.\n\n### When you are done\n- Obtenga las firmas de los testigos y del apoderado elegido.\n- Obtenga la certificación notarial del formulario.\n- Guarde una copia para usted y entregue copias a los apoderados elegidos.\n\n', 'Have your parental rights been terminated?\n': '¿Se han terminado sus derechos parentales?\n', 'Answer **Yes** if a court ended (took away) your parental rights.\n\nAlso answer **Yes** if you signed papers giving up your parental rights.\n': 'Responda **Sí** si un tribunal terminó sus derechos parentales, es decir, se los quitó.\n\nTambién responda **Sí** si firmó documentos para renunciar a sus derechos parentales.\n', 'Is there a court order that says you cannot give these rights and duties to someone else?\n': '¿Existe una orden judicial que le prohíbe delegar estos derechos y deberes a otra persona?\n', 'Answer **Yes** if a court order says you cannot give your rights and duties as a parent to someone else.\n\nAlso answer **Yes** if a court order gives custody of your child to someone else. The order does not have to use the words "you cannot give these rights."\n': 'Responda **Sí** si una orden judicial le prohíbe delegar sus derechos y deberes como padre o madre a otra persona.\n\nTambién responda **Sí** si una orden judicial le otorga a otra persona la custodia de su hijo. La orden no tiene que decir expresamente «no puede delegar estos derechos».\n', 'You are ineligible to complete this form.\n': 'No cumple los requisitos para completar este formulario.\n', 'Important information\n': 'Información importante\n', 'Read each statement and check the box to show you read it.\n': 'Lea cada declaración y marque la casilla para indicar que la leyó.\n', 'I may change or cancel this affidavit. If I do, I must give a copy of the updated or canceled affidavit to everyone who received the original.': 'Puedo modificar o cancelar esta declaración jurada. Si lo hago, debo entregar una copia de la declaración modificada o cancelada a todas las personas que recibieron la original.', 'This document only takes effect if I am detained by law enforcement, I am deported from the United States, or my agent does not know where I am for 24 hours. Proof may include a government document showing my detention or deportation. It may also be a statement from my lawyer or from my agent.': 'Este documento solo entra en vigor si las autoridades me detienen, soy deportado de Estados Unidos o mi agente no sabe dónde estoy durante 24 horas. Como prueba se puede presentar un documento del gobierno que demuestre mi detención o deportación. También puede ser una declaración de mi abogado o de mi agente.', 'This document stays in effect for 60 days after it takes effect. I can change or cancel it in writing before then.': 'Este documento sigue vigente durante 60 días desde que entra en vigor. Puedo modificarlo o cancelarlo por escrito antes de que termine ese plazo.', 'Your Information\n': 'Su información\n', "Are you the child's {parent}, {legal guardian}, or {legal custodian}? Tap a green word to see what it means.\n": '¿Usted es {padre o madre}, {tutor legal} o {custodio legal} del menor? Toque una palabra verde para ver su significado.\n', 'Parental status': 'Calidad respecto al menor', 'Legal guardian': 'Tutor legal', 'Legal custodian': 'Custodio legal', 'Did the other parent agree to you choosing an agent?\n': '¿El otro padre o la otra madre aceptó que usted eligiera un agente?\n', 'Tell us if your child’s other parent agreed to the agent or agents you chose. If you do not know who the other parent is, answer **No**.\n': 'Indique si el otro padre o la otra madre de su hijo aceptó al agente o los agentes que eligió. Si no sabe quién es, responda **No**.\n', 'The other parent\n': 'El otro padre o la otra madre\n', 'Write the other parent’s information here. (This section does not need to be completed before a notary.)\n': 'Escriba aquí la información del otro padre o de la otra madre. Esta sección no tiene que completarse ante un notario.\n', 'Why is the other parent not giving permission?\n': '¿Por qué el otro padre o la otra madre no da su permiso?\n', "You need the other parent's permission unless one of these is true. Choose the reason that fits.\n": 'Necesita el permiso del otro padre o de la otra madre, a menos que se dé una de estas circunstancias. Elija el motivo que corresponda.\n', 'Reason the other parent is not giving permission': 'Motivo por el que el otro padre o la otra madre no da su permiso', 'The other parent has died': 'El otro padre o la otra madre ha fallecido', 'I do not know where the other parent is': 'No sé dónde está el otro padre o la otra madre', 'The other parent is not willing to care for the child': 'El otro padre o la otra madre no quiere cuidar del menor', 'The other parent is not able to care for the child': 'El otro padre o la otra madre no puede cuidar del menor', 'Are you completing this form together with your agent(s)?\n': '¿Está completando este formulario junto con su agente o sus agentes?\n', 'Tap a green word to see who each person is.\n\n* You (the {appointing party})\n* {Temporary agent}\n* {Backup agent} (optional)\n': 'Toque una palabra verde para ver quién es cada persona.\n\n* Usted, la {parte que otorga la autorización}\n* {Agente temporal}\n* {Agente suplente}, opcional\n', 'Have the agent(s) review, date, and sign the form in front of the witnesses and notary.\n': 'Pida a los apoderados que revisen, fechen y firmen el formulario ante los testigos y el notario.\n', 'Is your {agent} 18 years old or above?\n': '¿Su {agente} tiene 18 años o más?\n', 'Your agent must be 18 years old or older. Only an adult can be a caregiver.\n': 'Su agente debe tener 18 años o más. Solo un adulto puede ser una persona cuidadora.\n', 'Choose a different person who is 18 or older. If you picked the wrong answer, tap **Undo** to change it.\n': 'Elija a otra persona que tenga 18 años o más. Si eligió la respuesta equivocada, toque **Deshacer** para cambiarla.\n', 'acknowledgement date': 'fecha de aceptación', 'This is the day your agent read this form and agreed to be your agent.\n': 'Es el día en que su agente leyó este formulario y aceptó ser su agente.\n', 'Agent Details\n': 'Datos del agente\n', 'Write the name and address of the person you want to take care of your child or children. This person is called “the agent.” The agent can make any decision for your children that you could make.\n': 'Escriba el nombre y la dirección de la persona que desea que cuide de su hijo o sus hijos. Esta persona se llama «agente». El agente puede tomar las mismas decisiones por sus hijos que usted podría tomar.\n', 'see an example': 'ver un ejemplo', 'The agent cannot change my child’s school.\n': 'El agente no puede cambiar a mi hijo de escuela.\n', 'Write down anything you don’t want the agent to do.\n': 'Escriba todo lo que no desea que haga el agente.\n', 'Tap the green words to {see an example}.\n': 'Toque las palabras verdes para {ver un ejemplo}.\n', 'Acts not allowed for agent': 'Actos que el agente no puede realizar', 'Would you like to add a {backup agent}?\n': '¿Desea agregar a un {agente suplente}?\n', 'Tap the green words to see what a backup agent is.\n': 'Toque las palabras verdes para ver qué es un agente suplente.\n', 'Are you completing this form together with your backup agent?\n': '¿Está completando este formulario junto con su agente suplente?\n', 'This is the day your backup agent read this form and agreed to be your backup agent.\n': 'Es el día en que su agente suplente leyó este formulario y aceptó ser su agente suplente.\n', 'Backup Agent\n': 'Agente suplente\n', 'Write the backup agent’s name, address, and phone number here. The backup agent must agree that he or she cannot act for you until you are detained or missing.\n': 'Escriba aquí el nombre, la dirección y el teléfono del agente suplente. Esta persona debe aceptar que no puede actuar en su nombre hasta que usted esté detenido o no se sepa dónde está.\n', 'My backup agent is 18 years old or older.': 'Mi agente suplente tiene 18 años o más.', 'Continue': 'Continuar', 'Who must sign and initial this form?\n\n- You\n- Your Agent\n- The other parent, if available\n- Your backup agent, if you chose one\n\nYou must sign the form in front of a notary and two witnesses. Your agent and backup agent cannot be witnesses.\n': '¿Quiénes deben firmar y poner sus iniciales en este formulario?\n\n- Usted\n- Su apoderado\n- El otro padre o la otra madre, si está disponible\n- Su apoderado suplente, si eligió uno\n\nDebe firmar el formulario ante un notario y dos testigos. Su apoderado y su apoderado suplente no pueden ser testigos.\n', 'Preview your form\n': 'Revise su formulario\n', 'Temporary Agent Form\n': 'Formulario de agente temporal\n', 'temporary agent esp 2': 'nombramiento de agente temporal', 'Planning for family emergency packet\n': 'Paquete de planificación para una emergencia familiar\n', 'planning for family emergency packet': 'paquete de planificación para una emergencia familiar', 'Weekly': 'Semanalmente', 'Once every two weeks': 'Cada dos semanas', 'Twice per month': 'Dos veces al mes', 'Monthly': 'Mensualmente', 'Once every 3 months': 'Una vez cada 3 meses', 'Once every 6 months': 'Una vez cada 6 meses', 'Yearly': 'Anualmente', 'Daily': 'Diariamente', 'Every weekday': 'Todos los días de entre semana', 'Twice Weekly': 'Dos veces por semana', 'Checking Account': 'Cuenta de cheques', 'Savings Account': 'Cuenta de ahorros', 'Certificate of Deposit': 'Certificado de depósito', 'Individual Retirement Account': 'Cuenta de jubilación individual', 'Money or Mutual Fund': 'Dinero o fondo mutuo', 'Stocks or Bonds': 'Acciones o bonos', 'Trust Fund': 'Fondo fiduciario', 'Vehicle': 'Vehículo', 'Real Estate': 'Bienes raíces', 'Other Asset': 'Otro activo', 'Individual Retirement Account (IRA)': 'Cuenta de jubilación individual (IRA)', 'A job or self-employment': 'Un empleo o trabajo por cuenta propia', 'Social Security Retirement Benefits': 'Beneficios de jubilación del Seguro Social', 'Social Security Disability Benefits': 'Beneficios de incapacidad del Seguro Social', 'Supplemental Security Income (SSI)': 'Seguridad de Ingreso Suplementario (SSI)', 'Pension': 'Pensión', 'Other public assistance': 'Otra asistencia pública', 'Food Stamps (SNAP)': 'Cupones de alimentos (SNAP)', 'Income from real estate (rent, etc)': 'Ingresos de bienes inmuebles (alquiler, etc.)', 'Room and/or Board Payments': 'Pagos de alojamiento y/o alimentos', 'Child Support': 'Manutención infantil', 'Alimony': 'Pensión conyugal', 'Other Support': 'Otro apoyo', 'Rent': 'Alquiler', 'Mortgage': 'Hipoteca', 'Food': 'Alimentos', 'Utilities': 'Servicios públicos', 'Other Heating/Cooking Fuel': 'Otro combustible para calefacción/cocina', 'Clothing': 'Ropa', 'Credit Card Payments': 'Pagos de tarjetas de crédito', 'Property Tax (State and Local)': 'Impuesto sobre la propiedad (estatal y local)', 'Other taxes and fees related to your home': 'Otros impuestos y tarifas relacionados con su vivienda', 'Medical Insurance (including health, dental, and vision)': 'Seguro médico (salud, dental y de la vista)', 'Medical costs (after amount paid by insurance)': 'Costos médicos (después de los montos pagados por el seguro)', 'Car operation and maintenance': 'Operación y mantenimiento de vehículos', 'Other transportation': 'Otro transporte', 'Church or charitable donations': 'Donaciones eclesiásticas o caritativas', 'Loan, credit, or lay-away payments': 'Pagos de préstamos, créditos o apartados', 'Support to someone not in household': 'Apoyo a alguien que no está en el hogar', 'Edit incomes\n': 'Editar ingresos\n', 'Type': 'Tipo', 'Times per year': 'Veces por año', 'Amount': 'Cantidad', 'Edit values\n': 'Editar valores\n', 'What is your job title?\n': '¿Cuál es su título laboral?\n', 'Job name': 'Nombre del empleo', 'I am self-employed': 'Soy empleado autónomo', "Employer's name": 'Nombre del empleador', "---\n\nEmployer's contact information\n": '---\n\nInformación de contacto del empleador\n', 'Zip or postal code': 'Código postal', 'What is your federal tax amount?': '¿Cuál es el monto de su impuesto federal?', 'What do you pay for insurance?': '¿Cuánto paga por seguros?', 'Does the job have other incomes?': '¿El empleo tiene otros ingresos?', 'Does the job have other deductions?': '¿El empleo tiene otras deducciones?', 'Is this a part time job': '¿Este es un empleo a tiempo parcial?', 'Hourly or salary?': '¿Sueldo por hora o salario?', 'Hourly': 'Sueldo por hora', 'Salary': 'Salario', 'How many hours are worked during that time?': '¿Cuántas horas se trabajan durante ese tiempo?', "Enter a number, like 40. If you don't know, enter your best guess.": 'Ingrese un número (p. ej., 40). Si no lo sabe, ingrese su mejor estimación.', 'How often do you get paid?': '¿Con qué frecuencia le pagan?', 'How many hours do you work during that time?': '¿Cuántas horas trabaja durante ese tiempo?', 'Other incomes\n': 'Otros ingresos\n', 'Type of income': 'Tipo de ingreso', 'Do not use any of these characters in the name: `( ) { } * ^ #`.\n': 'No use ninguno de estos caracteres en el nombre: `( ) { } * ^ #`.\n', 'How often do you get paid this amount?': '¿Con qué frecuencia le pagan esta cantidad?', 'Do you have another source of income?': '¿Tiene otra fuente de ingresos?', 'Other deductions\n': 'Otras deducciones\n', 'Deduction name': 'Nombre de la deducción', 'Is there other money being taken out?': '¿Se descuenta alguna otra cantidad?', 'How many jobs do you have?\n': '¿Cuántos empleos tiene?\n', 'Job title': 'Título laboral', 'Edit jobs\n': 'Editar empleos\n', 'Title': 'Título', 'Employer': 'Empleador', 'Annual Gross Income': 'Ingreso bruto anual', 'Annual Deductions': 'Deducciones anuales', 'What kind of expenses do you have?\n': '¿Qué tipo de gastos tiene?\n', 'Type of expense': 'Tipo de gasto', 'Other (explain)': 'Otro (explique)', 'How often do you pay this amount?': '¿Con qué frecuencia paga esta cantidad?', 'Amount per month': 'Monto por mes', 'Edit expenses\n': 'Editar gastos\n', 'What sources of income do you have, not including employment?\n': '¿Qué fuentes de ingresos tiene (sin incluir el empleo)?\n', 'Source of income': 'Fuente del ingreso', 'What type of income?': '¿Qué tipo de ingreso?', 'Times per year you receive this income': 'Veces al año que recibe este ingreso', 'Amount of income': 'Monto del ingreso', 'Who owns this?': '¿Quién es el propietario de esto?', 'Is the job hourly?': '¿El trabajo tiene sueldo por hora?', 'How many hours do you work in each period?': '¿Cuántas horas trabaja en cada período?', 'What is your hourly pay for this job?': '¿Cuál es su pago por hora en este empleo?', 'What are your wages for this job?': '¿Cuál es su sueldo en este empleo?', 'Amount deducted from your pay': 'Monto deducido de su sueldo', 'Tell us about this asset\n': 'Háblenos sobre este activo\n', 'What type of asset is it?': '¿Qué tipo de activo es?', 'Does this asset earn any income (like rent or interest)?': '¿Este activo genera algún ingreso (como alquiler o intereses)?', 'How often do you get the income?': '¿Con qué frecuencia recibe el ingreso?', 'How many assets do you have?\n': '¿Cuántos activos tiene?\n', 'Current market value': 'Valor de mercado actual', 'Balance (for a financial account, may be identical to market value)': 'Saldo (para una cuenta financiera, puede ser idéntico al valor de mercado)', 'How much does this asset earn you (in interest, dividends or other regular payments to you)?': '¿Cuánto le genera este activo (en intereses, dividendos u otros pagos habituales)?', 'How often do you get money for this asset?': '¿Con qué frecuencia recibe dinero por este activo?', 'Tell us about your vehicle\n': 'Háblenos sobre su vehículo\n', 'Year': 'Año', 'Make': 'Marca', 'For example, Ford, Honda': 'Por ejemplo, Ford, Honda', 'Model': 'Modelo', 'For example, Fusion, Civic': 'Por ejemplo, Fusión, Civic', 'Market value': 'Valor de mercado', 'Loan balance': 'Saldo del préstamo', 'How many vehicles do you have?\n': '¿Cuántos vehículos tiene?\n', 'e.g, Ford, Honda': 'p. ej., Ford, Honda', 'e.g., Fusion, Civic': 'p. ej., Fusion, Civic', 'Current value': 'Valor actual', 'Tell us about the value\n': 'Cuéntenos sobre el valor\n', 'Value': 'Valor', 'Transaction type': 'Tipo de transacción', 'Expense': 'Gasto', 'Income': 'Ingreso', 'Source': 'Fuente', 'Full time wages': 'Sueldo de tiempo completo', 'Part time wages': 'Sueldo de tiempo parcial', 'Tips': 'Propinas', 'Insurance': 'Seguro', 'Federal taxes': 'Impuestos federales', 'State taxes': 'Impuestos estatales', 'Social security': 'Seguro Social', 'Start your guardianship petition today\n': 'Comience hoy su solicitud de tutela\n', 'Maryland Petition for Guardianship of Minor\n': 'Solicitud de tutela de un menor en Maryland\n', '### Before you start\n- Gather all needed information about the minor and your connection to them.\n- Have any required documents, like birth certificates, ready to include.\n\n### When you are done\n- Check your petition for accuracy and completeness.\n- Send the petition to the right court along with any required fees.\n\nYou can use this form if you are seeking guardianship of a minor child. If the minor is not a child, a different form is needed. Make sure to fill out separate petitions for each minor unless they are full siblings in the same situation. Half-siblings need separate petitions.\n\nThis petition asks the court to appoint a guardian of the **person** of a minor. It does not ask for guardianship of the minor’s property.\n': '### Antes de comenzar\n- Reúna toda la información necesaria sobre el menor y su relación con él.\n- Tenga listos los documentos requeridos, como las actas de nacimiento, para adjuntarlos.\n\n### Cuando termine\n- Revise que su solicitud sea correcta y esté completa.\n- Preséntela ante el tribunal correspondiente junto con las tasas requeridas.\n\nPuede usar este formulario si solicita la tutela de un menor. Para una persona adulta se necesita otro formulario. Complete solicitudes separadas para cada menor, a menos que sean hermanos de padre y madre y se encuentren en la misma situación. Los medios hermanos necesitan solicitudes separadas.\n\nEsta solicitud pide al tribunal que designe a un tutor de la **persona** de un menor. No solicita la tutela de los bienes del menor.\n', 'Are you 18 years of age or older?\n': '¿Tiene 18 años o más?\n', 'You must be 18 or older to use this form\n': 'Debe tener 18 años o más para usar este formulario\n', "Because you answered that you are under 18, you can't file a petition for guardianship of a minor with this form.\n\nIf you are under 18 and need help with a guardianship or custody situation, you can ask a trusted adult to help you, or contact [Maryland Legal Aid](https://www.mdlab.org) for free legal help.\n\nIf you answered by mistake, you can go back and change your answer.\n": 'Como indicó que tiene menos de 18 años, no puede presentar una solicitud de tutela de un menor con este formulario.\n\nSi es menor de 18 años y necesita ayuda con una situación de tutela o custodia, puede pedir ayuda a un adulto de confianza o comunicarse con [Maryland Legal Aid](https://www.mdlab.org) para obtener asistencia legal gratuita.\n\nSi respondió por error, puede volver atrás y cambiar su respuesta.\n', 'Who is filling out this petition?\n': '¿Quién está completando esta solicitud?\n', 'I am an attorney filing for a client': 'Soy abogado y presento la solicitud en nombre de un cliente', 'I am a parent of the child': 'Soy el padre o la madre del menor', 'I want to be appointed guardian': 'Deseo que me designen tutor', 'Your attorney details\n': 'Sus datos como abogado\n', 'Fax number\n': 'Número de fax\n', "Skip this if there isn't one.\n": 'Omita este campo si no tiene uno.\n', 'Date of signing\n': 'Fecha de firma\n', 'Signature date': 'Fecha de firma', 'Which kind of court are you filing in?\n': '¿Ante qué tipo de tribunal presentará la solicitud?\n', 'Circuit Court': 'Tribunal de Circuito (Circuit Court)', "Orphans' Court": "Tribunal de Huérfanos (Orphans' Court)", 'Which county are you filing in?\n': '¿En qué condado presentará la solicitud?\n', 'If you are filing in Baltimore City, choose Baltimore City.\n': 'Si la presentará en la ciudad de Baltimore, elija Baltimore City.\n', "What is the court's address?\n": '¿Cuál es la dirección del tribunal?\n', "What is the court's phone number?\n": '¿Cuál es el número de teléfono del tribunal?\n', "Enter the legal parents' full names. Leave the second blank if there is only one known parent.\n": 'Ingrese los nombres completos de los padres legales. Deje el segundo campo en blanco si solo se conoce a uno de los padres.\n', "First parent's full name": 'Nombre completo del primer padre o de la primera madre', "Second parent's full name": 'Nombre completo del segundo padre o de la segunda madre', 'Their age': 'Su edad', 'Is there another child on this petition?\n': '¿Hay otro menor en esta solicitud?\n', 'Is the next child a full sibling of the children already listed, in the same situation?': '¿El siguiente menor es hermano de padre y madre de los menores ya incluidos y está en la misma situación?', 'For example: grandmother, aunt, family friend.\n': 'Por ejemplo: abuela, tía, amigo de la familia.\n', 'Relationship': 'Parentesco o relación', 'Is any child a beneficiary of the Department of Veterans Affairs?\n': '¿Alguno de los menores recibe beneficios del Departamento de Asuntos de los Veteranos?\n', 'If yes, the court will need a certificate from the Department of Veterans Affairs. You will attach it to your petition.\n': 'Si responde que sí, el tribunal necesitará un certificado del Departamento de Asuntos de los Veteranos. Deberá adjuntarlo a su solicitud.\n', 'Tell us about the conviction\n': 'Cuéntenos sobre la condena\n', 'The crime': 'El delito', 'Year of conviction': 'Año de la condena', 'Court where it happened': 'Tribunal donde se dictó la condena', 'Why the court should still appoint the guardian (good cause)': 'Por qué el tribunal debe designar al tutor a pesar de la condena (motivo justificado)', "Prospective guardian's conviction\n": 'Condena de la persona propuesta como tutor\n', 'Why the court should still appoint them (good cause)': 'Por qué el tribunal debe designar a esta persona a pesar de la condena (motivo justificado)', 'Why is guardianship needed?\n': '¿Por qué se necesita la tutela?\n', 'Briefly explain in your own words.\n': 'Explíquelo brevemente con sus propias palabras.\n', 'Reason for guardianship': 'Motivo de la tutela', 'Other court cases\n': 'Otros casos judiciales\n', 'List all other court cases about the child or children, including juvenile court, and all cases involving the petitioner or prospective guardian in any court. Write "None" if there are none.\n': 'Enumere todos los demás casos judiciales sobre el menor o los menores, incluidos los casos ante tribunales de menores, y todos los casos en cualquier tribunal que involucren al solicitante o a la persona propuesta como tutor. Escriba «None» («ninguno») si no hay casos.\n', 'Cases about the child or children': 'Casos sobre el menor o los menores', 'Cases involving the petitioner or prospective guardian': 'Casos que involucran al solicitante o a la persona propuesta como tutor', 'Email (if known)': 'Correo electrónico (si lo conoce)', 'Do the children have any siblings who are not on this petition?\n': '¿Los menores tienen hermanos que no estén incluidos en esta solicitud?\n', 'Is there another sibling to tell us about?\n': '¿Hay otro hermano del que deba informarnos?\n', 'Does any of the following apply to the child or children?\n': '¿Alguna de las siguientes opciones se aplica al menor o a los menores?\n', 'Check all that apply. We will ask for their details next.\n': 'Marque todas las opciones que correspondan. A continuación le pediremos los datos de esas personas o entidades.\n', 'A guardian who has already been appointed': 'Un tutor ya designado', 'Someone holding a power of attorney for the child': 'Una persona que tiene un poder para tomar decisiones por el menor', 'An attorney for the child': 'Un abogado del menor', 'Someone else who has taken responsibility for the child': 'Otra persona que ha asumido la responsabilidad del menor', 'A government agency paying benefits for the child': 'Una entidad gubernamental que paga beneficios para el menor', "Someone with an interest in the child's property": 'Una persona que tiene un interés en los bienes del menor', "Someone else who controls the child or the child's property": 'Otra persona que tiene control sobre el menor o sus bienes', 'A person or agency eligible to be guardian of the child': 'Una persona o entidad que reúne los requisitos para ser tutor del menor', 'Other heirs at law': 'Otros herederos por ley', 'None of these apply': 'Ninguna de estas opciones corresponde', 'The guardian who has already been appointed\n': 'El tutor ya designado\n', 'The person holding a power of attorney\n': 'La persona que tiene un poder\n', "The child's attorney\n": 'El abogado del menor\n', 'The person who has taken responsibility for the child\n': 'La persona que ha asumido la responsabilidad del menor\n', 'The government agency paying benefits\n': 'La entidad gubernamental que paga beneficios\n', "Enter the agency's name in the first box and leave the last name blank if it doesn't apply.\n": 'Ingrese el nombre de la entidad en el primer campo y deje el apellido en blanco si no corresponde.\n', "The person with an interest in the child's property\n": 'La persona con un interés en los bienes del menor\n', "The person who controls the child or the child's property\n": 'La persona que tiene control sobre el menor o sus bienes\n', 'The person or agency eligible to be guardian\n': 'La persona o entidad que reúne los requisitos para ser tutor\n', 'The other heir at law\n': 'El otro heredero por ley\n', 'Your name and contact details\n': 'Su nombre y sus datos de contacto\n', "Enter the attorney's information.\n": 'Ingrese la información del abogado.\n', 'Optional.\n': 'Opcional.\n', 'Has the child lived anywhere else in the last five years?\n': '¿El menor ha vivido en otro lugar en los últimos cinco años?\n', 'Do not count the child\'s current home. Answer "Yes" if the child has lived at any other address, or with anyone else, during the past five years.\n': 'No cuente el hogar actual del menor. Responda «Sí» si el menor ha vivido en otra dirección o con otra persona durante los últimos cinco años.\n', 'Tell us who the child lived with, the address, and about when. You can add more places on the next screen.\n': 'Indique con quién vivió el menor, la dirección y las fechas aproximadas. Puede agregar más lugares en la siguiente pantalla.\n', 'Who the child lived with': 'Con quién vivió el menor', 'Their address': 'Su dirección', 'Approximate dates': 'Fechas aproximadas', 'Is there another place the child lived in the last five years?\n': '¿Hay otro lugar donde el menor haya vivido en los últimos cinco años?\n', '**Other interested people**\n\nEdit the list of people and their details.\n': '**Otras personas interesadas**\n\nEdite la lista de personas y sus datos.\n', 'Edit petitioner\n': 'Editar solicitante\n', 'Edit attorney\n': 'Editar abogado\n', 'Gender': 'Género', 'Edit siblings\n': 'Editar hermanos\n', 'Edit places the child has lived\n': 'Editar lugares donde ha vivido el menor\n', 'Lived with': 'Vivió con', 'Dates': 'Fechas', 'Next steps (keep for yourself)\n': 'Próximos pasos (para guardar)\n', 'Petition for Guardianship of a Minor\n': 'Solicitud de tutela de un menor\n', 'labeled labeled ccgn001withfieldswithfields': 'solicitud de tutela de un menor, CC-GN-001, con campos', 'Fill out the Caregiver Authorization Form\n': 'Complete el formulario de autorización para la persona cuidadora\n', "Caregiver's Authorization Affidavit": 'Declaración jurada de autorización para el cuidador', "Use this form for a child under 18 who lives with an adult caregiver in California.\nThe caregiver must be at least 18 years old.\n\nThe form can be used for school enrollment and school-related medical care.\nA relative caregiver can also complete the additional section for other medical and dental care.\n\nIf you are helping someone, enter the caregiver's information. The caregiver must\nreview and sign the affidavit. A parent's signature, notarization, and court filing are not required.\n": 'Use este formulario para un menor de 18 años que vive con una persona cuidadora adulta en California.\nLa persona cuidadora debe tener al menos 18 años.\n\nEl formulario puede usarse para la inscripción escolar y la atención médica relacionada con la escuela.\nSi la persona cuidadora es un familiar, también puede completar la sección adicional para otra atención médica y dental.\n\nSi está ayudando a otra persona, ingrese la información de la persona cuidadora. Esa persona debe revisar y firmar la declaración jurada. No se requiere la firma de los padres, certificación notarial ni presentación ante un tribunal.\n', 'The caregiver must be 18 or older': 'La persona cuidadora debe tener 18 años o más', "This affidavit is for an adult caregiver. Another adult who lives with the child may be able to use it.\n\nFor help with school enrollment, contact the school district's liaison or\n[read about other caregiving options](https://selfhelp.courts.ca.gov/guardianship/other-options).\n": 'Esta declaración jurada es para una persona cuidadora adulta. Otro adulto que viva con el menor quizás pueda usarla.\n\nPara obtener ayuda con la inscripción escolar, comuníquese con la persona de enlace del distrito escolar o [lea sobre otras opciones de cuidado](https://selfhelp.courts.ca.gov/guardianship/other-options).\n', 'Who is filling out this interview?': '¿Quién está completando esta entrevista?', 'I am the caregiver': 'Soy la persona cuidadora', 'I am helping the caregiver': 'Estoy ayudando a la persona cuidadora', 'The additional medical section is for relative caregivers. Examples include grandparents,\naunts, uncles, siblings, first cousins, and stepparents. See the full definition below.\n': 'La sección médica adicional es para personas cuidadoras que sean familiares. Algunos ejemplos son los abuelos, las tías, los tíos, los hermanos, los primos hermanos y los padrastros o las madrastras. Consulte la definición completa de abajo.\n', 'Relative under the definition on this form': 'Familiar según la definición de este formulario', 'A relative is an adult related to the child by blood, adoption, or affinity (relationship through marriage) within\nthe fifth degree of kinship. This includes stepparents, stepsiblings, relatives\nwhose status is preceded by great, great-great, or grand, and spouses of those\nrelatives, even if the marriage ended through death or divorce.\n': 'Un familiar es una persona adulta relacionada con el menor por consanguinidad, adopción o afinidad (parentesco por matrimonio) hasta el quinto grado. Esto incluye a padrastros, madrastras, hermanastros y todos los parientes cuyo vínculo esté precedido por las palabras «bis», «tatar» o «abuelo/a», así como al cónyuge de cualquiera de estas personas, aun cuando el matrimonio haya terminado por fallecimiento o divorcio.\n', 'Which statements are true for the caregiver?': '¿Cuáles de estas declaraciones son verdaderas para la persona cuidadora?', "These are the statements in item 6 of the affidavit. Select a statement only if the\nwhole statement is true. If you are helping, answer from the caregiver's point of view.\n\nBoth statements can apply, for example, if one parent was notified and did not object,\nbut the other parent cannot be reached. Not having contacted someone yet does not,\nby itself, mean they cannot be contacted.\n": 'Estas son las declaraciones del punto 6 de la declaración jurada. Seleccione una declaración solo si es verdadera en su totalidad. Si está ayudando a otra persona, responda desde el punto de vista de la persona cuidadora.\n\nAmbas declaraciones pueden corresponder; por ejemplo, si se notificó a uno de los padres y no se opuso, pero no se puede contactar al otro. No haber contactado a alguien todavía no significa, por sí solo, que no se pueda contactar a esa persona.\n', "I told the child's parents or legal custodians that I intend to authorize medical care, and I have received no objection.": 'Informé a los padres o custodios legales del menor que tengo la intención de autorizar atención médica y no he recibido ninguna objeción.', "I am unable to contact the child's parents or legal custodians right now to notify them that I intend to authorize medical care.": 'En este momento no puedo contactar a los padres o custodios legales del menor para informarles que tengo la intención de autorizar atención médica.', 'Caregiver identification': 'Identificación de la persona cuidadora', "Item 8 of the additional medical section asks for the caregiver's identification number.\nIf the caregiver does not have a California license, state ID, or consular card, the form allows\nanother form of identification, such as a Medi-Cal or Social Security number.\n": 'El punto 8 de la sección médica adicional pide el número de identificación de la persona cuidadora. Si no tiene una licencia de California, una identificación estatal ni una tarjeta consular, el formulario permite otra identificación, como un número de Medi-Cal o del Seguro Social.\n', "Select the caregiver's identification document:": 'Seleccione el documento de identificación de la persona cuidadora:', "California driver's license (CDL)": 'Licencia de conducir de California (CDL)', 'California state ID card': 'Tarjeta de identificación del estado de California', 'Consular identification card (Matrícula Consular)': 'Tarjeta de identificación consular (Matrícula Consular)', 'Medi-Cal identification card': 'Tarjeta de identificación de Medi-Cal', 'Social Security number (SSN)': 'Número del Seguro Social (SSN)', 'The caregiver does not have an identification number to enter': 'La persona cuidadora no tiene un número de identificación que pueda ingresar', "California driver's license number (8 characters):": 'Número de licencia de conducir de California (8 caracteres):', '1 letter followed by 7 digits (e.g., D1234567)': '1 letra seguida de 7 dígitos (por ejemplo, D1234567)', 'California state ID card number (8 characters):': 'Número de tarjeta de identificación del estado de California (8 caracteres):', '1 letter followed by 7 digits (e.g., I1234567)': '1 letra seguida de 7 dígitos (por ejemplo, I1234567)', 'Consular identification card number:': 'Número de tarjeta de identificación consular:', 'Consular card number (e.g., MC12345678)': 'Número de tarjeta consular (por ejemplo, MC12345678)', 'Medi-Cal identification number (9 characters):': 'Número de identificación de Medi-Cal (9 caracteres):', '9 alphanumeric characters (e.g., 98765432A)': '9 caracteres alfanuméricos (por ejemplo, 98765432A)', 'Social Security number (9 digits):': 'Número del Seguro Social (9 dígitos):', '9 digits (XXX-XX-XXXX)': '9 dígitos (XXX-XX-XXXX)', 'You cannot use this form for a child who is 18 or older.\n': 'No puede usar este formulario para un menor que tenga 18 años o más.\n', 'You cannot use this form for a child who is 18 or older.': 'No puede usar este formulario para un menor que tenga 18 años o más.', 'Date of birth': 'Fecha de nacimiento', 'Where do the caregiver and child live?': '¿Dónde viven la persona cuidadora y el menor?', 'Enter the home address where they live together.\n': 'Ingrese la dirección del hogar donde viven juntos.\n', 'Preview the affidavit': 'Revise la declaración jurada', 'Review your answers': 'Revise sus respuestas', 'Edit caregiver\n': 'Editar persona cuidadora\n', 'Edit child\n': 'Editar menor\n', 'Birth date': 'Fecha de nacimiento', 'Your caregiver affidavit is ready': 'Su declaración jurada de persona cuidadora está lista', "Caregiver's Authorization Affidavit\n": 'Declaración jurada de autorización para el cuidador\n', 'Using your caregiver affidavit\n': 'Cómo usar su declaración jurada de persona cuidadora\n', 'Next Steps & Instructions Guide (Separate Document)\n': 'Guía de próximos pasos e instrucciones (documento separado)\n', 'Complete Caregiver Packet (Affidavit + Next Steps)\n': 'Paquete completo para la persona cuidadora (declaración jurada y próximos pasos)\n', 'Affidavit Copies for School and Healthcare Providers\n': 'Copias de la declaración jurada para la escuela y los proveedores de atención médica\n', 'caregiver authorization affidavit form finalwithfields': 'formulario de declaración jurada de autorización de la persona cuidadora, con campos', 'How will the caregiver use this form?': '¿Cómo usará la persona cuidadora este formulario?', 'School-related medical care includes vaccinations and exams required for school\nenrollment or participation in school activities.\n': 'La atención médica relacionada con la escuela incluye vacunas y exámenes requeridos para la inscripción o la participación en actividades escolares.\n', 'School enrollment and school-related medical care': 'Inscripción escolar y atención médica relacionada con la escuela', 'Medical or dental care beyond school requirements': 'Atención médica o dental que va más allá de los requisitos escolares', 'The additional medical section is for relatives': 'La sección médica adicional es para familiares', 'A caregiver who is not a relative can use this affidavit for school enrollment\nand school-related medical care. The additional section for other medical and\ndental care is for relative caregivers.\n': 'Una persona cuidadora que no sea familiar puede usar esta declaración jurada para la inscripción escolar y la atención médica relacionada con la escuela. La sección adicional para otra atención médica y dental es para personas cuidadoras que sean familiares.\n', 'What would you like to do?': '¿Qué desea hacer?', 'Prepare the school-related version': 'Preparar la versión para asuntos escolares', 'Review the relationship answer': 'Revisar la respuesta sobre el parentesco', 'Read about other caregiving options': 'Leer sobre otras opciones de cuidado', 'Item 6 has not been completed': 'El punto 6 no se ha completado', 'Neither statement in item 6 was selected. The additional medical section is not\ncomplete with these answers. Do not select a statement unless it is true.\n\nIf someone with legal custody has objected, this affidavit does not resolve that\ndisagreement. Read about other options or get legal help before relying on it\nfor that medical decision.\n': 'No se seleccionó ninguna de las declaraciones del punto 6. Con estas respuestas, la sección médica adicional no está completa. No seleccione una declaración a menos que sea verdadera.\n\nSi una persona con custodia legal se ha opuesto, esta declaración jurada no resuelve ese desacuerdo. Lea sobre otras opciones u obtenga asistencia legal antes de usarla para autorizar esa decisión médica.\n', 'Review the item 6 answers': 'Revisar las respuestas del punto 6', 'Item 8 has not been completed': 'El punto 8 no se ha completado', 'An identification number is needed to complete the additional medical section.\nYou can still prepare the school-related version without entering one.\n': 'Se necesita un número de identificación para completar la sección médica adicional. Aun así, puede preparar la versión para asuntos escolares sin ingresar uno.\n', 'Review the identification choices': 'Revisar las opciones de identificación', 'Other caregiving options': 'Otras opciones de cuidado', "[California Courts explains other options for caring for a child](https://selfhelp.courts.ca.gov/guardianship/other-options).\nThe [Alliance for Children's Rights](https://allianceforchildrensrights.org/resources/caregivers-affidavit/)\nalso has information about caregiver affidavits.\n\nA caregiver affidavit does not change the parents' or legal guardians' rights.\nGet legal help if there is a disagreement about the child's care.\n": "[Los Tribunales de California explican otras opciones para cuidar de un menor](https://selfhelp.courts.ca.gov/guardianship/other-options).\nLa organización [Alliance for Children's Rights](https://allianceforchildrensrights.org/resources/caregivers-affidavit/) también ofrece información sobre las declaraciones juradas de personas cuidadoras.\n\nUna declaración jurada de persona cuidadora no modifica los derechos de los padres ni de los tutores legales. Obtenga asistencia legal si hay un desacuerdo sobre el cuidado del menor.\n", 'How will the caregiver sign the affidavit?': '¿Cómo firmará la persona cuidadora la declaración jurada?', 'Print and sign on paper': 'Imprimir y firmar en papel', 'What signing date should appear on the affidavit?': '¿Qué fecha de firma debe aparecer en la declaración jurada?', 'Use the actual signing date. If it changes, update the date before signing.\n': 'Use la fecha real de firma. Si cambia, actualícela antes de firmar.\n', 'Signing date': 'Fecha de firma', 'The caregiver must review and sign': 'La persona cuidadora debe revisar y firmar', 'Set up a Power of Attorney for your children': 'Prepare un poder para sus hijos', 'Power of Attorney and Delegation by Parent or guardian': 'Poder y delegación por parte del padre, la madre o el tutor', "If you are a parent or guardian in Maine and need someone else to care for your children temporarily, this form is for you. It grants your chosen agent the power to make decisions about your children's health, education, and general welfare.": 'Este formulario es para usted si es padre, madre o tutor en Maine y necesita que otra persona cuide temporalmente de sus hijos. Le otorga al apoderado que usted elija la autoridad para tomar decisiones sobre la salud, la educación y el bienestar general de sus hijos.', '- Gather the necessary information about your children and the person you want to appoint.\n- Make sure you understand the powers you are granting and the limitations.': '- Reúna la información necesaria sobre sus hijos y la persona que desea designar.\n- Asegúrese de comprender las facultades que está otorgando y sus límites.', '- Sign the document in the presence of two witnesses and a notary public.\n- Provide copies to the appointed agent and any relevant institutions (like schools or healthcare providers).': '- Firme el documento en presencia de dos testigos y un notario público.\n- Entregue copias al apoderado designado y a las instituciones correspondientes, como las escuelas o los proveedores de atención médica.', 'Which best describes your role?': '¿Cuál de las siguientes opciones describe mejor su función?', 'Identify the capacity in which you are completing this form.': 'Indique en qué calidad está completando este formulario.', 'How long do you want': '¿Por cuánto tiempo desea que', 'to have power of attorney over your child or children?': 'tenga un poder para tomar decisiones sobre su hijo o sus hijos?', 'The end date you selected is more than one year from today. \n\nUnder Maine law, you cannot delegate authority for more than a year from the date of signing this form. \n\nYou can go back and change the date if needed.': 'La fecha de finalización que eligió es más de un año después de hoy.\n\nSegún la ley de Maine, no puede delegar la autoridad por más de un año a partir de la fecha en que firme este formulario.\n\nPuede volver atrás y cambiar la fecha si es necesario.', "The end date you selected is before today's date.\n\nThe consent period cannot end before the date you sign this form.\n\nPlease go back and correct the end date before continuing.": 'La fecha de finalización que eligió es anterior a hoy.\n\nEl período de consentimiento no puede terminar antes de la fecha en que firme este formulario.\n\nVuelva atrás y corrija la fecha de finalización antes de continuar.', "Please review the child's date of birth": 'Revise la fecha de nacimiento del menor', 'is': 'tiene', 'years old.\n\nThis form is intended for minor children. The date of birth you selected indicates that this child is 18 or older.\n\nYou may continue, but please confirm that this is the correct form for your situation.': 'años.\n\nEste formulario está destinado a menores de edad. La fecha de nacimiento que eligió indica que este menor tiene 18 años o más.\n\nPuede continuar, pero confirme que este sea el formulario adecuado para su situación.', 'What is': '¿Cuál es', "'s address?": 'su dirección?', 'What is the name of your first witness?': '¿Cómo se llama su primer testigo?', 'What is the name of your second witness?': '¿Cómo se llama su segundo testigo?', 'Notarization Details': 'Detalles de la certificación notarial', 'County where the notarization will take place.': 'Condado donde se realizará la certificación notarial.', 'How would you like to sign your form?': '¿Cómo desea firmar su formulario?', 'Choose how you would like your completed Power of Attorney document prepared.\n\n**Witnesses and notarization**\n\nYou must sign the form in the presence of two witnesses and a notary public. The witnesses observe your signature and the notary public acknowledges it.\n\nChoosing electronic signing does not eliminate these requirements. You will still need to complete the witness and notary signatures.': 'Elija cómo desea que se prepare su documento de poder completado.\n\n**Testigos y certificación notarial**\n\nDebe firmar el formulario en presencia de dos testigos y un notario público. Los testigos observan su firma y el notario público certifica el reconocimiento de su firma.\n\nElegir la firma electrónica no elimina estos requisitos. Aún deberá obtener las firmas de los testigos y del notario.', 'How many children are you including on this form?': '¿A cuántos menores está incluyendo en este formulario?', 'You may include up to three children.': 'Puede incluir hasta tres menores.', 'Name of child': 'Nombre del menor', 'Name of the': 'Nombre del', 'child': 'menor', 'Who are you giving power of attorney over your child or children to?': '¿A quién le está otorgando un poder para tomar decisiones sobre su hijo o sus hijos?', 'Name of': 'Nombre de', '**plaintiff** or petitioner in this matter': '**demandante** o solicitante en este asunto', 'Name of notary': 'Nombre del notario', 'Who is the': '¿Quién es la', 'person on your side of the case?': 'persona de su parte en el caso?', 'What is the name of the': '¿Cómo se llama la', 'person who is adding their\nname to this form with you?': 'persona que está agregando su nombre a este formulario junto con usted?', 'Maine': 'Maine', 'ME': 'ME', 'hidden': 'hidden', 'Witness names': 'Nombres de los testigos', 'Enter full names of witnesses': 'Ingrese los nombres completos de los testigos', 'Here is a preview of the form you will sign on the next page.': 'Esta es una vista previa del formulario que firmará en la siguiente página.', 'Open the form preview in a new tab. Use the "Edit answers" button to edit your\nanswers.': 'Abra la vista previa del formulario en una pestaña nueva. Use el botón «Editar respuestas» para cambiar sus respuestas.', 'Return to this interview tab to continue and sign your form.': 'Regrese a esta pestaña de la entrevista para continuar y firmar su formulario.', '**Parent or Guardian**': '**Padre, madre o tutor**', '**Power of Attorney Details**\n\n**Appointed agent:**': '**Detalles del poder**\n\n**Apoderado designado:**', '**Address:**': '**Dirección:**', '**End date of authority:**': '**Fecha de finalización de la autoridad:**', '**Signature date:**': '**Fecha de firma:**', '**Signature Method**': '**Método de firma**', '**Witnesses**': '**Testigos**', '**Notary**': '**Notario**', '**Notarization Details**\n\nCounty of notarization:': '**Detalles de la certificación notarial**\n\nCondado de la certificación notarial:', 'Edit witnesses': 'Editar testigos', 'Edit notary': 'Editar notario', 'Almost done': 'Ya casi termina', 'Thank you': 'Gracias', '. Your form is ready to download and deliver.': '. Su formulario está listo para descargar y entregar.', '**Important:** Because you are a court-appointed guardian, you must file this Power of Attorney with the court that appointed you. The delegation does not take legal effect until it is filed with the court.': '**Importante:** Como usted es un tutor designado por el tribunal, debe presentar este poder ante el tribunal que lo designó. La delegación no entra en vigor legalmente hasta que se presente ante el tribunal.', 'Use the options on this page to view, download and send your form. Use the\n"Edit answers" button to fix any mistakes.': 'Use las opciones de esta página para ver, descargar y enviar su formulario. Use el botón «Editar respuestas» para corregir cualquier error.', 'Instructions': 'Instrucciones', 'All forms to download for your records': 'Todos los formularios para descargar y guardar en sus archivos', 'All forms to file': 'Todos los formularios para presentar', 'power_of_attorney_and_delegation_by_parent_or_guardian_next_steps': 'power_of_attorney_and_delegation_by_parent_or_guardian_next_steps', 'power_of_attorney_and_delegation_by_parent_or_guardian': 'power_of_attorney_and_delegation_by_parent_or_guardian', 'P': 'P', 'Give someone permission to make educational decisions for your child': 'Autorice a alguien a tomar decisiones educativas por su hijo', '- Your child goes to school in Rhode Island\n- You are the parent or legal guardian of a child in a school in Rhode Island': '- Su hijo asiste a una escuela en Rhode Island\n- Usted es el padre, la madre o el tutor legal de un menor que asiste a una escuela en Rhode Island', "This form lets a trusted adult (a caregiver) get your child's school records. The caregiver can also make school decisions for your child if you are unavailable.\n\nAn illness, arrest, or other emergency can prevent you from making school decisions for your child. This form allows a trusted adult to step in to make school decisions for your child when you cannot.\n\nThis does not make the caregiver your child's {legal guardian}.": 'Este formulario permite que un adulto de confianza (una persona cuidadora) obtenga los expedientes escolares de su hijo. Esa persona también puede tomar decisiones escolares por su hijo si usted no está disponible.\n\nUna enfermedad, un arresto u otra emergencia pueden impedirle tomar decisiones escolares por su hijo. Este formulario permite que un adulto de confianza tome esas decisiones cuando usted no pueda hacerlo.\n\nEsto no convierte a la persona cuidadora en el {tutor legal} de su hijo.', "**You must sign this form in front of a {notary}.** Rhode Island school districts require it before a caregiver can register a child.\n\nNeed a notary? You may be able to find one for free at your public library, your bank, or by calling United Way's 2-1-1 helpline.": '**Debe firmar este formulario ante un {notario}.** Los distritos escolares de Rhode Island lo exigen antes de que una persona cuidadora pueda inscribir a un menor.\n\n¿Necesita un notario? Quizás pueda encontrar uno gratis en su biblioteca pública, en su banco o llamando a la línea 2-1-1 de United Way.', 'Check if you can use this form': 'Compruebe si puede usar este formulario', 'This form is not for you': 'Este formulario no es adecuado para usted', "This form only works for a child who goes to school in Rhode Island. You must be the child's parent or legal guardian. \n\nIf you made a mistake, click **Undo** to go back.": 'Este formulario solo sirve para un menor que asiste a una escuela en Rhode Island. Usted debe ser su padre, madre o tutor legal.\n\nSi cometió un error, haga clic en **Deshacer** para volver atrás.', 'Tap any green word to see what it means.': 'Toque cualquier palabra verde para ver su significado.', 'A notary (notary public) is a person licensed by the state to witness signatures. Many banks and public libraries have one, often for free.': 'Un notario (notario público) es una persona autorizada por el estado para dar fe de las firmas. Muchos bancos y bibliotecas públicas ofrecen este servicio, a menudo gratis.', 'The trusted adult you are choosing to make school decisions for your child when you are not available.': 'El adulto de confianza que usted elige para tomar decisiones escolares por su hijo cuando usted no esté disponible.', 'A person a court has given the legal right to make decisions for a child. Only a court can make someone a legal guardian. This form does not do that.': 'Una persona a quien un tribunal le ha otorgado el derecho legal de tomar decisiones por un menor. Solo un tribunal puede designar a alguien como tutor legal. Este formulario no lo hace.', 'The right to make important decisions for a child, like where they go to school or what medical care they receive. Parents may share legal custody, or one parent may have it alone.': 'El derecho a tomar decisiones importantes por un menor, como a qué escuela asiste o qué atención médica recibe. Los padres pueden compartir la custodia legal, o uno de ellos puede tenerla de forma exclusiva.', "This tool helps you fill out Rhode Island's Educational Guardian form in 3 steps:\n\nStep 1. Write or select your answers to the following questions.": 'Esta herramienta le ayuda a completar el formulario de tutor educativo de Rhode Island en 3 pasos:\n\nPaso 1. Escriba o seleccione sus respuestas a las siguientes preguntas.', 'Step 2. Preview before printing.': 'Paso 2. Revise la vista previa antes de imprimir.', 'Step 3. Download and print the final form. \n\nThis site is not a lawyer. If you would like a lawyer, find [your local legal aid provider](https://www.lsc.gov/what-legal-aid/find-legal-aid).': 'Paso 3. Descargue e imprima el formulario final.\n\nEste sitio no es un abogado. Si desea consultar a un abogado, encuentre [un proveedor de asistencia legal en su zona](https://www.lsc.gov/what-legal-aid/find-legal-aid).', '**Click any underlined word, like {caregiver}, for its meaning.**': '**Haga clic en cualquier palabra subrayada, como {persona cuidadora}, para ver su significado.**', 'To continue, you must accept our terms of use.': 'Para continuar, debe aceptar nuestras condiciones de uso.', "If you share {legal custody} with your child's other parent or legal guardian, **both of you should sign.** \n\nIf you have sole legal custody or are the child's only parent or legal guardian, you can sign alone.": 'Si comparte la {custodia legal} con el otro padre, la otra madre o el otro tutor legal de su hijo, **ambos deben firmar.**\n\nSi tiene la custodia legal exclusiva o es el único padre, madre o tutor legal del menor, puede firmar sin otra persona.', 'Where does': '¿Dónde vive', 'live?': '?', 'Signing your form': 'Cómo firmar su formulario', '**You do not need a notary to sign this form.** Only Providence schools ask for a notarized letter.': '**No necesita un notario para firmar este formulario.** Solo las escuelas de Providence piden una carta con certificación notarial.', 'We strongly recommend using a notary, because:': 'Recomendamos encarecidamente acudir a un notario por los siguientes motivos:', 'It proves who you are.': 'Comprueba su identidad.', 'A notary checks your ID to make sure you are the person signing.': 'Un notario revisa su identificación para asegurarse de que usted sea la persona que firma.', 'It makes your signature more trustworthy.': 'Da mayor credibilidad a su firma.', 'It helps schools, courts, and other organizations trust that the right person signed.': 'Ayuda a las escuelas, los tribunales y otras organizaciones a confiar en que firmó la persona correcta.', 'A notary cannot sign on this screen. **If you want a notary, you will print the form and sign it in front of them.**': 'El notario no puede firmar en esta pantalla. **Si desea acudir a un notario, imprima el formulario y fírmelo en su presencia.**', "'s school is in": 'asiste a una escuela en', 'Providence has a special rule.\n\nIf your caregiver signs': 'Providence tiene una regla especial.\n\nSi la persona cuidadora inscribe a', 'up for school, they **must** show a letter from you. The letter must be signed in front of a notary. **To be safe, sign this form in front of a notary.**': 'en la escuela, **debe** presentar una carta suya. La carta debe estar firmada ante un notario. **Para mayor seguridad, firme este formulario ante un notario.**', 'is 18 or older': 'tiene 18 años o más', 'This form is written for children under 18. It may not work for': 'Este formulario está redactado para menores de 18 años. Es posible que no sirva para', "The caregiver is the adult you are giving permission to make school decisions for your child while you are unavailable.\n\nThe caregiver will be able to:\n\n- Get your child's school records, including special education, counseling, and medical records\n- Talk to school staff about your child\n- Make decisions about your child's school, classroom, or program\n- Make decisions about services your child gets at school, including special education\n\nThis stays in effect until you cancel it in writing or your child turns 18.": 'La persona cuidadora es el adulto a quien usted autoriza a tomar decisiones escolares por su hijo cuando usted no esté disponible.\n\nLa persona cuidadora podrá:\n\n- Obtener los expedientes escolares de su hijo, incluidos los de educación especial, orientación y atención médica\n- Hablar con el personal escolar sobre su hijo\n- Tomar decisiones sobre la escuela, el salón de clases o el programa de su hijo\n- Tomar decisiones sobre los servicios que recibe su hijo en la escuela, incluida la educación especial\n\nEsta autorización sigue vigente hasta que usted la cancele por escrito o su hijo cumpla 18 años.', 'You can list up to 4 children on this form. If you have more than 4 children, you can fill out this form again for the other children.': 'Puede incluir hasta 4 menores en este formulario. Si tiene más de 4 hijos, puede completar otro formulario para los demás.', "What is your child's name?": '¿Cómo se llama su hijo?', 'What is the name of your oldest child?': '¿Cómo se llama su hijo de mayor edad?', 'What is the name of your next oldest child?': '¿Cómo se llama su siguiente hijo de mayor edad?', 'Barrington': 'Barrington', 'Bristol Warren': 'Bristol Warren', 'Burrillville': 'Burrillville', 'Central Falls': 'Central Falls', 'Chariho': 'Chariho', 'Coventry': 'Coventry', 'Cranston': 'Cranston', 'Cumberland': 'Cumberland', 'East Greenwich': 'East Greenwich', 'East Providence': 'East Providence', 'Exeter-West Greenwich': 'Exeter-West Greenwich', 'Foster': 'Foster', 'Foster-Glocester': 'Foster-Glocester', 'Glocester': 'Glocester', 'Jamestown': 'Jamestown', 'Johnston': 'Johnston', 'Lincoln': 'Lincoln', 'Little Compton': 'Little Compton', 'Middletown': 'Middletown', 'Narragansett': 'Narragansett', 'New Shoreham': 'New Shoreham', 'Newport': 'Newport', 'North Kingstown': 'North Kingstown', 'North Providence': 'North Providence', 'North Smithfield': 'North Smithfield', 'Pawtucket': 'Pawtucket', 'Portsmouth': 'Portsmouth', 'Providence': 'Providence', 'Scituate': 'Scituate', 'Smithfield': 'Smithfield', 'South Kingstown': 'South Kingstown', 'Tiverton': 'Tiverton', 'Warwick': 'Warwick', 'West Warwick': 'West Warwick', 'Westerly': 'Westerly', 'Woonsocket': 'Woonsocket', 'Not sure? Check a letter from the school, or ask the school office.': '¿No está seguro? Revise una carta de la escuela o pregunte en la oficina escolar.', 'Is there another child to tell us about?': '¿Hay otro menor del que deba informarnos?', "What is the other parent or guardian's name?": '¿Cómo se llama el otro padre, la otra madre o el otro tutor?', 'Is anyone else on your side of this case?': '¿Hay otra persona de su parte en este caso?', 'Is anyone else adding their name to this form with you?': '¿Hay otra persona que agregará su nombre a este formulario junto con usted?', 'So far you have told us about': 'Hasta ahora nos ha informado sobre', 'Here is a preview of the form.\n\n**Click the image of the form to preview it. It will open in a new tab.**': 'Esta es una vista previa del formulario.\n\n**Haga clic en la imagen del formulario para verlo. Se abrirá en una pestaña nueva.**', '**Use the "Edit answers" button below to edit your answers.**': '**Use el botón «Editar respuestas» que aparece abajo para cambiar sus respuestas.**', 'If everything looks good, click **Next**.': 'Si todo está correcto, haga clic en **Siguiente**.', '**Parents or guardians**': '**Padres o tutores**', 'This form has room for 4 children. To add another child, fill out the form again.': 'Este formulario tiene espacio para 4 menores. Para agregar otro menor, complete otro formulario.', 'Your form is ready': 'Su formulario está listo', 'Here is what you should do now: \n\n1. View or download the **Next Steps Document** to see what to do next.\n\n2. View or download the **Rhode Island Educational Guardian Form** to see your form.\n\nIf you need to change anything, click **Edit answers**.': 'Esto es lo que debe hacer ahora:\n\n1. Vea o descargue el **Documento de próximos pasos** para saber qué hacer a continuación.\n\n2. Vea o descargue el **Formulario de tutor educativo de Rhode Island** para ver su formulario.\n\nSi necesita cambiar algo, haga clic en **Editar respuestas**.', 'Important:': 'Importante:', 'Do not sign the form until you are standing in front of a notary. Rhode Island school districts will not accept it otherwise.': 'No firme el formulario hasta que esté ante un notario. Los distritos escolares de Rhode Island no lo aceptarán de otro modo.', 'Next Steps Document': 'Documento de próximos pasos', 'Rhode Island Educational Guardian Form': 'Formulario de tutor educativo de Rhode Island', 'Form to give the school': 'Formulario para entregar a la escuela', 'ri_educational_guardian_next_steps': 'ri_educational_guardian_next_steps', 'test rhode island educational form interviewwithfields': 'test rhode island educational form interviewwithfields', 'ri_educational_guardian': 'ri_educational_guardian', 'Allow Healthcare Decisions for your Child': 'Autorice decisiones sobre la atención médica de su hijo', 'Licensed residential or day program that provides non-medical care, supervision, and support services to children or adults who need help with daily living activities due to physical handicaps, developmental or mental impairments, or other special needs.': 'Un programa residencial o diurno autorizado que proporciona cuidados no médicos, supervisión y servicios de apoyo a menores o adultos que necesitan ayuda con las actividades de la vida diaria debido a discapacidades físicas, del desarrollo o mentales, u otras necesidades especiales.', 'A public official appointed by a government authority to act as an impartial witness when people sign important legal documents.': 'Un funcionario público designado por una autoridad gubernamental para actuar como testigo imparcial cuando las personas firman documentos legales importantes.', 'Rhode Island Power of Attorney for Children': 'Poder para menores de Rhode Island', 'You can use this form if you are a parent or legal guardian and want to choose someone to make healthcare decisions for your child. It is important to ensure that the chosen person is trustworthy and understands your wishes regarding medical care.': 'Puede usar este formulario si es padre, madre o tutor legal y desea elegir a alguien para que tome decisiones sobre la atención médica de su hijo. Es importante asegurarse de que la persona elegida sea de confianza y comprenda sus deseos sobre la atención médica.', '- Gather the necessary information about your child and the chosen caregiver.\n- Make sure both parents are in agreement with the appointment.': '- Reúna la información necesaria sobre su hijo y la persona cuidadora elegida.\n- Asegúrese de que ambos padres estén de acuerdo con la designación.', '- Sign the document in front of a notary public to make it legally binding.\n- Provide a copy to the chosen caregiver and keep one for your records.': '- Firme el documento ante un notario público para que sea legalmente vinculante.\n- Entregue una copia a la persona cuidadora elegida y guarde otra para sus archivos.', '* Over 18 years old\n* Someone you trust\n* For example, a relative or close family friend': '* Mayor de 18 años\n* Alguien de su confianza\n* Por ejemplo, un familiar o un amigo cercano de la familia', '* Your healthcare provider who is not a relative\n* An operator of a {community care facility} who is not a relative': '* Un proveedor de atención médica suyo que no sea familiar\n* El operador de un {centro de atención comunitaria} que no sea familiar', 'Name of caregiver': 'Nombre de la persona cuidadora', 'Name of your child': 'Nombre de su hijo', "Name of the parent's child": 'Nombre del hijo del padre o de la madre', 'When was': '¿Cuándo nació', 'born?': '?', 'In order for the form to be valid, you must get a {notary} to sign this form.\n\nAll Rhode Island Notaries Public are empowered to perform notarial acts for the general public.': 'Para que el formulario sea válido, debe obtener la firma de un {notario}.\n\nTodos los notarios públicos de Rhode Island están facultados para realizar actos notariales para el público en general.', '* Community Action Partnership of Providence (CAPP)\n* Public libraries near you\n* Bank with which you have a bank account\n* United Way of Rhode Island (Dial 2-1-1) - they will be able to direct you to notary services and language services': '* Community Action Partnership of Providence (CAPP)\n* Bibliotecas públicas cercanas\n* El banco donde tiene una cuenta\n* United Way of Rhode Island (marque 2-1-1): pueden orientarle sobre servicios notariales y de idiomas', '* Parent(s) first and last name\n* Parents address': '* Nombre y apellido de los padres\n* Dirección de los padres', '* First and Last name\n* Birthday': '* Nombre y apellido\n* Fecha de nacimiento', 'Stop, you do not have the required information to continue': 'Deténgase: no tiene la información necesaria para continuar', 'What is the name of the second parent or guardian?': '¿Cómo se llama el segundo padre, la segunda madre o el segundo tutor?', 'What is the name of the Parent(s) who you are filling this form for?': '¿Cómo se llaman los padres para quienes está completando este formulario?', 'Preview your form before you download it': 'Revise su formulario antes de descargarlo', '**Parents or Guardians**': '**Padres o tutores**', '* Name:': '* Nombre:', '* Address:': '* Dirección:', '**Children**': '**Menores**', '* Birthday:': '* Fecha de nacimiento:', '**Caregivers**': '**Personas cuidadoras**', 'Edit parents or guardians': 'Editar padres o tutores', '. Your form is ready to download and deliver.\n\nUse the options on this page to view, download and send your form. Use the\n"Edit answers" button to fix any mistakes.': '. Su formulario está listo para descargar y entregar.\n\nUse las opciones de esta página para ver, descargar y enviar su formulario. Use el botón «Editar respuestas» para corregir cualquier error.', 'Do not sign this form until you are in the presence of a notary.': 'No firme este formulario hasta que esté ante un notario.', 'Remember: Do not sign this form until you are in the presence of a notary.': 'Recuerde: no firme este formulario hasta que esté ante un notario.', 'Completed Durable Power of Attorney Form': 'Formulario de poder duradero completado', 'ridurableminorwithfields_next_steps': 'ridurableminorwithfields_next_steps', 'ridurableminorwithfields': 'ridurableminorwithfields', 'Ridurableminor-with-fields': 'Ridurableminor-with-fields', "This form lets you pick another adult (the “caregiver”) to look after  child(ren) for up to one year. The caregiver can make choices about your child's school and health care. You are still the parent, and you can cancel this at any time.": 'Este formulario le permite elegir a otro adulto (la «persona cuidadora») para que cuide de los menores durante un máximo de un año. La persona cuidadora puede tomar decisiones sobre la escuela y la atención médica de su hijo. Usted sigue siendo el padre o la madre, y puede cancelar esta autorización en cualquier momento.', 'You can use this form if: \n\n- You are a parent, guardian, or legal custodian of one or more child(ren) under the age of 18.\n- Your children live in West Virginia.\n- You wish to pick someone to take care of your kids if you cannot.\n- A qualified nonprofit organization is helping you set this up.': 'Puede usar este formulario si:\n\n- Es padre, madre, tutor o custodio legal de uno o más menores de 18 años.\n- Sus hijos viven en West Virginia.\n- Desea elegir a alguien para que cuide de sus hijos si usted no puede hacerlo.\n- Una organización sin fines de lucro que cumple los requisitos le está ayudando a hacer estos arreglos.', "Have this information ready:\n\n- Your child(ren)'s full name(s) and birthday(s).\n- The caregiver's full name, address, and phone numbers.\n- The dates you want this power to start and end.": 'Tenga lista esta información:\n\n- Los nombres completos y las fechas de nacimiento de sus hijos.\n- El nombre completo, la dirección y los números de teléfono de la persona cuidadora.\n- Las fechas en que desea que este poder comience y termine.', '- Check your answers and print the form.\n- You and the caregiver must sign it in front of a notary.\n- Give the caregiver a copy. Keep a copy for yourself.\n- This form does not get filed with a court.': '- Revise sus respuestas e imprima el formulario.\n- Usted y la persona cuidadora deben firmarlo ante un notario.\n- Entregue una copia a la persona cuidadora. Guarde otra para usted.\n- Este formulario no se presenta ante un tribunal.', "West Virginia's law for this form is for parents who get help from a **qualified nonprofit organization**. That is a charitable or religious group that:\n\n* Is a 501(c)(3) tax-exempt organization, **and**\n* Helps parents arrange temporary care for their children with this kind of form\n\nBefore you sign, the nonprofit checks the background of the person who will care for your children and trains them.": 'La ley de West Virginia que rige este formulario se aplica a los padres que reciben ayuda de una **organización sin fines de lucro que cumple los requisitos**. Se trata de un grupo benéfico o religioso que:\n\n* Está exento de impuestos conforme a la sección 501(c)(3), **y**\n* Ayuda a los padres a organizar el cuidado temporal de sus hijos mediante este tipo de formulario\n\nAntes de que usted firme, la organización verifica los antecedentes de la persona que cuidará de sus hijos y le proporciona capacitación.', 'What is a qualified nonprofit organization?': '¿Qué es una organización sin fines de lucro que cumple los requisitos?', 'Is a nonprofit helping you set this up?': '¿Una organización sin fines de lucro le está ayudando a hacer estos arreglos?', 'This form is for parents who are working with a **qualified nonprofit organization**. That is a charitable or religious group that is a 501(c)(3) tax-exempt organization and helps parents arrange temporary care for their children.': 'Este formulario es para padres que trabajan con una **organización sin fines de lucro que cumple los requisitos**. Se trata de un grupo benéfico o religioso exento de impuestos conforme a la sección 501(c)(3) que ayuda a los padres a organizar el cuidado temporal de sus hijos.', 'Ask the organization:\n\n1. Are you a 501(c)(3) nonprofit?\n2. Will you do a background check on the person who will care for my children, and train them, before I sign?\n\nIf the answer to both is yes, it most likely counts.': 'Pregúntele a la organización:\n\n1. ¿Es una organización sin fines de lucro conforme a la sección 501(c)(3)?\n2. Antes de que yo firme, ¿verificará los antecedentes de la persona que cuidará de mis hijos y le proporcionará capacitación?\n\nSi responde que sí a ambas preguntas, lo más probable es que cumpla los requisitos.', 'How do I know if the group helping me counts?': '¿Cómo sé si el grupo que me ayuda cumple los requisitos?', 'Check with the group helping you first': 'Consulte primero con el grupo que le ayuda', 'This form is for families working with a nonprofit': 'Este formulario es para familias que trabajan con una organización sin fines de lucro', 'Ask the organization if it is a 501(c)(3) nonprofit and if it will do a background check and training for the person who will care for your children. If it will, come back and start again.': 'Pregúntele a la organización si es una entidad sin fines de lucro conforme a la sección 501(c)(3) y si verificará los antecedentes de la persona que cuidará de sus hijos y le proporcionará capacitación. Si lo hará, regrese y comience de nuevo.', "West Virginia's law for this form only covers parents who get help from a qualified nonprofit. Without one, this form may not do what you need.": 'La ley de West Virginia que rige este formulario solo se aplica a los padres que reciben ayuda de una organización sin fines de lucro que cumple los requisitos. Sin esa ayuda, es posible que este formulario no sirva para lo que necesita.', "**Is the person who will care for your children a relative?** Legal Aid of West Virginia's [Kinship Connector](https://legalaidwv.org/kinship-connector/) can help you make a temporary care agreement with a relative, like a grandparent, aunt or uncle. You do not need a nonprofit to use it.\n\nFor other ways to arrange care for your children, contact [Legal Aid of West Virginia](https://legalaidwv.org) or talk to a lawyer.": '**¿La persona que cuidará de sus hijos es un familiar?** [Kinship Connector](https://legalaidwv.org/kinship-connector/), de Legal Aid of West Virginia, puede ayudarle a hacer un acuerdo de cuidado temporal con un familiar, como un abuelo, una abuela, una tía o un tío. No necesita la ayuda de una organización sin fines de lucro para usarlo.\n\nPara conocer otras opciones para organizar el cuidado de sus hijos, comuníquese con [Legal Aid of West Virginia](https://legalaidwv.org) o consulte a un abogado.', 'What': 'Lo que', 'does before you sign': 'hace antes de que usted firme', 'Before you sign this form,': 'Antes de que usted firme este formulario,', 'has to:\n\n* Do a background check on': 'debe:\n\n* Verificar los antecedentes de', '* Train': '* Capacitar a', 'on how to care for your children under this form, including how to spot and report abuse or neglect\n\nAfter you sign, give': 'sobre cómo cuidar de sus hijos conforme a este formulario, incluido cómo detectar y denunciar el maltrato o la negligencia\n\nDespués de firmar, entregue a', 'a copy. They have to keep it.': 'una copia. La organización debe conservarla.', "'s address and phone number": 'dirección y número de teléfono', "'s home phone number": 'teléfono de casa', "'s  work phone number": 'teléfono del trabajo', 'What should': '¿Qué debería', 'be able to do?': 'poder hacer?', 'If you want': 'Si desea que', 'to do most things for your': 'haga por su', 'that you do today, select **General Powers**. If you would like to choose exactly what you want': 'la mayoría de las cosas que usted hace actualmente, seleccione **Facultades generales**. Si desea elegir exactamente lo que quiere que', 'to be able to do for your': 'pueda hacer por su', ', select **Only the powers I list** and write them in the box below.\n\n**If you pick general powers,': ', seleccione **Solo las facultades que enumere** y escríbalas en el recuadro de abajo.\n\n**Si elige las facultades generales,', 'can do the following things for your': 'podrá hacer lo siguiente por su', ':**\n\n* Deal with your': ':**\n\n* Encargarse de los asuntos de la escuela de su', "'s school, including enrolling them, giving permission for activities, and attending events\n* Decide what medical and dental care your": ', incluida la inscripción, la autorización de actividades y la asistencia a eventos\n* Decidir qué atención médica y dental debe recibir su', 'should have \n* Decide what things they can do, like you do now\n\n**': '\n* Decidir qué actividades puede hacer, como lo hace usted actualmente\n\n**', 'cannot:**\n\n* Let your': 'no podrá:**\n\n* Permitir que su', 'be adopted or get married\n* Let your': 'sea adoptado o se case\n* Permitir que su', 'get an abortion\n* End the rights you have as a parent': 'se someta a un aborto\n* Poner fin a sus derechos como padre o madre', 'What do you want': '¿Qué desea que', 'to be able to do?': 'pueda hacer?', 'When can': '¿Cuándo podrá', 'start and stop making choices for your': 'comenzar y dejar de tomar decisiones por su', 'If you pick **Immediately**, it starts today. If you want it to start later, choose the month and day.': 'Si elige **De inmediato**, comienza hoy. Si desea que comience después, elija el mes y el día.', "'s power can last up to 1 year from the start date. For example, if it starts on February 1, it can end as late as January 31 of the next year.": 'podrá ejercer su autoridad durante un máximo de 1 año a partir de la fecha de inicio. Por ejemplo, si comienza el 1 de febrero, puede terminar como máximo el 31 de enero del año siguiente.', 'Immediately (today,': 'De inmediato (hoy,', "Child's name": 'Nombre del menor', 'This form is only for children under 18.': 'Este formulario solo es para menores de 18 años.', 'Who do you want to be the caregiver?': '¿Quién desea que sea la persona cuidadora?', 'Review your form': 'Revise su formulario', 'Open the form preview in a new tab. Use the "Edit answers" button to edit your answers.': 'Abra la vista previa del formulario en una pestaña nueva. Use el botón «Editar respuestas» para cambiar sus respuestas.', 'Return to this interview tab to continue and download your form.': 'Regrese a esta pestaña de la entrevista para continuar y descargar su formulario.', 'Check that everything is correct. Click **Edit** to change an answer.': 'Compruebe que todo esté correcto. Haga clic en **Editar** para cambiar una respuesta.', '**You**': '**Usted**', '**Your': '**Su', '**Caregiver**': '**Persona cuidadora**', "'s address and phone numbers**\n\nAddress:": 'dirección y números de teléfono**\n\nDirección:', 'Home phone:': 'Teléfono de casa:', 'Work phone:': 'Teléfono del trabajo:', '**What': '**Lo que', 'can do**': 'puede hacer**', 'You picked:': 'Usted eligió:', '**When it starts and ends**\n\nStarts:': '**Cuándo comienza y termina**\n\nComienza:', ')\n\nEnds:': ')\n\nTermina:', 'Edit your name': 'Editar su nombre', 'Edit your children': 'Editar a sus hijos', 'Edit caregiver information': 'Editar información de la persona cuidadora', '. Your form is ready to download and print.\n\n**Your form is not finished yet.** You and the caregiver must both sign it in front of a notary public. Do not sign it until you are in front of the notary. This form does not get filed with a court.': '. Su formulario está listo para descargar e imprimir.\n\n**Su formulario aún no está terminado.** Usted y la persona cuidadora deben firmarlo ante un notario público. No lo firmen hasta que estén ante el notario. Este formulario no se presenta ante un tribunal.', 'children_addendum': 'children_addendum', 'Next steps': 'Próximos pasos', 'Filled form (signature still required)': 'Formulario completado (aún requiere firma)', 'All forms. Sign in front of a notary.': 'Todos los formularios. Firme ante un notario.', 'Your form': 'Su formulario', 'A notary is a person who watches you sign and verifies you are who you say you are. You and the caregiver must both sign this form in front of a notary.\n\nYou can find a notary:\n\n* At most banks and credit unions. It is often free if you have an account there.\n* At some shipping stores, libraries, and law offices.\n* By using the [West Virginia notary search](https://apps.sos.wv.gov/business/notary). Pick your county to see notaries near you.\n\n**Before you go:**\n\n* Call ahead to make sure a notary will be there.\n* Bring a photo ID, such as a license or a passport. The caregiver needs to bring one too.\n* If you do not have one of these documents, you can bring a witness to swear you are who you say you are. The witness cannot be the caregiver.\n* Do not sign the form until you are in front of the notary.': 'Un notario es una persona que observa su firma y verifica que usted sea quien dice ser. Usted y la persona cuidadora deben firmar este formulario ante un notario.\n\nPuede encontrar un notario:\n\n* En la mayoría de los bancos y cooperativas de crédito. A menudo es gratis si tiene una cuenta allí.\n* En algunas tiendas de envíos, bibliotecas y oficinas de abogados.\n* Mediante la [búsqueda de notarios de West Virginia](https://apps.sos.wv.gov/business/notary). Elija su condado para encontrar notarios cercanos.\n\n**Antes de ir:**\n\n* Llame con anticipación para asegurarse de que haya un notario disponible.\n* Lleve una identificación con foto, como una licencia de conducir o un pasaporte. La persona cuidadora también debe llevar una.\n* Si no tiene uno de estos documentos, puede llevar a un testigo que declare bajo juramento que usted es quien dice ser. Ese testigo no puede ser la persona cuidadora.\n* No firme el formulario hasta que esté ante el notario.', 'How do I find a notary?': '¿Cómo encuentro un notario?', 'wv_delegation_next_steps': 'wv_delegation_next_steps', 'wvcode4984withfields': 'wvcode4984withfields', 'wv_delegation_of_parental_authority': 'wv_delegation_of_parental_authority', 'North Dakota form to give parental rights to someone else': 'Formulario de North Dakota para delegar facultades parentales a otra persona', 'This form lets you choose another person to make decisions for your child.\n\nYou can use this form if you are a parent or legal guardian. You can give away some or all of your parental rights and responsibilities. The person you choose will not be able to allow your child to marry or be adopted.\n\nYou can give someone the ability to make decisions for six months or less. If you need someone to make decisions for longer than six months, you may need a [guardianship](https://www.ndcourts.gov/legal-self-help/minor-guardianship).': 'Este formulario le permite elegir a otra persona para que tome decisiones por su hijo.\n\nPuede usarlo si es padre, madre o tutor legal. Puede delegar algunas o todas sus facultades y responsabilidades parentales. La persona elegida no podrá autorizar el matrimonio ni la adopción de su hijo.\n\nPuede otorgar autoridad para tomar decisiones durante seis meses o menos. Si necesita que alguien tome decisiones durante más de seis meses, quizás necesite una [tutela](https://www.ndcourts.gov/legal-self-help/minor-guardianship).', "- Have your child(ren)'s names and birth dates.\n- Have the name and address of the person you choose to care for your child(ren).\n- Make sure the person you choose is age 18 or older.": '- Tenga a mano los nombres y las fechas de nacimiento de sus hijos.\n- Tenga el nombre y la dirección de la persona que elija para cuidar de sus hijos.\n- Asegúrese de que esa persona tenga 18 años o más.', '- Sign the form in front of a notary public or court clerk to make it official.\n- Give copies to the person you have chosen and keep one for your records.': '- Firme el formulario ante un notario público o el secretario del tribunal para formalizarlo.\n- Entregue copias a la persona elegida y guarde una para sus archivos.', "Let's make sure this is the right form for you.": 'Asegurémonos de que este sea el formulario adecuado para usted.', "Contact your child's school, doctor, or day care to see if they will accept a power of attorney. This form is called a power of attorney. Some places will not accept this form.": 'Comuníquese con la escuela, el médico o la guardería de su hijo para preguntar si aceptarán un poder. Este formulario se llama poder. Algunas instituciones no lo aceptan.', 'https://www.ndcourts.gov/legal-self-help': 'https://www.ndcourts.gov/legal-self-help', "You might need a different form if:\n\n* Your child's school or provider does not accept a power of attorney\n\n* You want to delegate your power for more than six months\n\n* To learn more, visit the North Dakota courts web page on [minor guardianships](https://www.ndcourts.gov/legal-self-help/minor-guardianship).": 'Quizás necesite otro formulario si:\n\n* La escuela o el proveedor de su hijo no acepta un poder\n\n* Desea delegar su autoridad por más de seis meses\n\n* Para obtener más información, visite la página de los tribunales de North Dakota sobre [tutelas de menores](https://www.ndcourts.gov/legal-self-help/minor-guardianship).', 'What is your relationship to the children?': '¿Cuál es su parentesco o relación con los menores?', 'Your Address': 'Su dirección', 'Choose which rights and responsibilities to give': 'Elija qué facultades y responsabilidades desea delegar', 'Would you like to give all the rights and responsibilities that you have as a parent or guardian?': '¿Desea delegar todas las facultades y responsabilidades que tiene como padre, madre o tutor?', 'Length of time': 'Duración', 'Email contact': 'Contacto por correo electrónico', 'Notary Information (optional)': 'Información del notario (opcional)', 'If you are with a notary now, fill in the information below. If you are with a court clerk, click Next.': 'Si está con un notario ahora, complete la información de abajo. Si está con el secretario del tribunal, haga clic en Siguiente.', 'Who are you giving your power to?': '¿A quién le está delegando su autoridad?', 'How many children do you have?': '¿Cuántos hijos tiene?', "Your child's name and birthdate": 'Nombre y fecha de nacimiento de su hijo', 'Fill in your': 'Complete el nombre y la fecha de nacimiento de su', "child's name and birthdate": 'hijo', 'Name of notary or court clerk': 'Nombre del notario o del secretario del tribunal', 'Here is a preview of your form. Check it before you continue.': 'Esta es una vista previa de su formulario. Revíselo antes de continuar.', '**Your contact info**': '**Su información de contacto**', '**Your email**\n-': '**Su correo electrónico**\n-', '**Your relationship to the child(ren)**': '**Su parentesco o relación con los menores**', '**Your children**': '**Sus hijos**', ', born': ', con fecha de nacimiento', '**Person you are giving your power to**': '**Persona a quien le delega su autoridad**', '**Choice of powers to give**\nYes, delegate all powers.:': '**Facultades que desea delegar**\nSí, delegar todas las facultades:', 'No, I need to choose specific powers.:': 'No, necesito elegir facultades específicas:', 'Select the powers you want to delegate::': 'Seleccione las facultades que desea delegar:', 'Describe the authority you want to delegate::': 'Describa la autoridad que desea delegar:', '**Which decision-making powers are you giving?**': '**¿Qué facultades para tomar decisiones está delegando?**', 'Specific powers:': 'Facultades específicas:', 'All parental powers': 'Todas las facultades parentales', "**When this form's power will end**\n-": '**Cuándo terminará la autoridad otorgada por este formulario**\n-', '**Notary Information**\nDate of notary signing:': '**Información del notario**\nFecha de firma del notario:', 'Notary commission expiration date:': 'Fecha de vencimiento de la comisión del notario:', '**Notary commission expiration date**\nNotary commission expiration date:': '**Fecha de vencimiento de la comisión del notario**\nFecha de vencimiento de la comisión del notario:', 'Edit attorney_in_fact': 'Editar al apoderado', '. Your form is ready to download.\n\nUse the options on this page to view, download and send your form. Use the\n"Edit answers" button to fix any mistakes.': '. Su formulario está listo para descargar.\n\nUse las opciones de esta página para ver, descargar y enviar su formulario. Use el botón «Editar respuestas» para corregir cualquier error.', 'ND Power of Attorney Minor Short Form v2': 'Poder para un menor de North Dakota, formulario breve, versión 2', 'nd_power_of_attorney_minor_next_steps': 'nd_power_of_attorney_minor_next_steps', 'nd_power_of_attorney_minor_form': 'nd_power_of_attorney_minor_form', 'Nd power of attorney minor short form v2': 'Poder para un menor de North Dakota, formulario breve, versión 2', "The birthdate you entered says that this child\nor ward is older than 18.\n\nThis form is for appointing a caregiver for\na minor. Please review the child's information before\ncontinuing.": 'La fecha de nacimiento que ingresó indica que este hijo o persona bajo tutela tiene más de 18 años.\n\nEste formulario es para designar a una persona cuidadora para un menor. Revise la información del menor antes de continuar.', 'warning': 'warning', 'danger': 'danger', 'Delegate temporary authority for your child’s care': 'Delegue temporalmente la autoridad para cuidar de su hijo', 'A biological or adoptive parent.': 'El padre o la madre biológicos o adoptivos.', 'Someone a court picked to care for a child and make choices for them.': 'Una persona elegida por un tribunal para cuidar de un menor y tomar decisiones por él.', 'Someone who is not a parent that has been given legal and physical custody by a court.': 'Una persona que no es el padre ni la madre y a quien un tribunal le ha otorgado la custodia legal y física del menor.', 'A child who is appointed a guardian.': 'Un menor para quien se ha designado un tutor.', 'The rights and responsibilities a parent has to care and make decisions about the health, education, and safety of their child.': 'Los derechos y las responsabilidades que tiene un padre o una madre para cuidar de su hijo y tomar decisiones sobre su salud, educación y seguridad.', 'A person who is 18 years or older that you want to give parental powers to.': 'Una persona de 18 años o más a quien desea otorgar facultades parentales.', 'Fill out this form if you are a {parent}, {custodian}, or {guardian} of a minor child or {ward} in NJ wishing to temporarily give {parental powers} to someone else.': 'Complete este formulario si es {padre o madre}, {custodio} o {tutor} de un menor o una {persona bajo tutela} en New Jersey y desea delegar temporalmente {facultades parentales} a otra persona.', '* Collect names, addresses and phone numbers of the\n    * Person you share custody with (if applicable),\n    * {Caregiver} and\n    * Alternate caregiver\n* Collect names and birthdates of your children or wards.': '* Reúna los nombres, las direcciones y los números de teléfono de:\n    * La persona con quien comparte la custodia, si corresponde\n    * La {persona cuidadora}\n    * La persona cuidadora suplente\n* Reúna los nombres y las fechas de nacimiento de sus hijos o de las personas bajo su tutela.', '* You do not lose any of your parental powers when you give a caregiver power to care for your child through this form.\n* You can only give the caregiver powers that you have.\n* The caregiver you choose must be at least 18 years old.\n* The caregiver will have the powers for up to one year from the date of an event you will choose in this form.\n* You can renew the powers by repeating this process.\n* You can take back the powers at any time by telling the caregiver.': '* No pierde ninguna de sus facultades parentales al otorgarle a una persona cuidadora la autoridad para cuidar de su hijo mediante este formulario.\n* Solo puede otorgarle las facultades que usted tiene.\n* La persona cuidadora que elija debe tener al menos 18 años.\n* La persona cuidadora tendrá las facultades por un máximo de un año a partir de un hecho que usted elegirá en este formulario.\n* Puede renovar las facultades repitiendo este proceso.\n* Puede revocar las facultades en cualquier momento informándoselo a la persona cuidadora.', '* Sign the form in the presence of two witnesses. \n* The person you share custody with must also sign, if applicable. \n* A notary may also be needed, depending on the powers you give.\n* Give a copy to the caregiver and keep a copy for yourself.': '* Firme el formulario en presencia de dos testigos.\n* La persona con quien comparte la custodia también debe firmar, si corresponde.\n* También puede ser necesario un notario, según las facultades que otorgue.\n* Entregue una copia a la persona cuidadora y guarde otra para usted.', 'https://courtformsonline.org/': 'https://courtformsonline.org/', 'This form is for parents, guardians, and custodians of a minor child or ward in NJ who want to temporarily give parental powers to someone else.\n\nBased on your answer, this form is not right for you.': 'Este formulario es para padres, tutores y custodios de un menor o una persona bajo tutela en New Jersey que desean delegar temporalmente facultades parentales a otra persona.\n\nSegún su respuesta, este formulario no es adecuado para usted.', '**Choosing a caregiver**\nIn the next few screens, you will choose the person you want to take care of the': '**Elegir a una persona cuidadora**\nEn las siguientes pantallas, elegirá a la persona que desea que cuide del', '. This person must be at least 18 years old.\n\n**Choosing an alternate caregiver**\nYou will also choose a backup caregiver. This is someone who can take over if your first choice cannot or does not want to care for the': '. Esta persona debe tener al menos 18 años.\n\n**Elegir a una persona cuidadora suplente**\nTambién elegirá a una persona cuidadora de respaldo, que podrá hacerse cargo si la primera persona no puede o no desea cuidar del', '.\n\n**Parental powers and timeline**\nNext, you will choose which parental powers you want to give the caregiver. You will also choose when the caregiver will get those powers.\n\nRemember:\n\n* You can only give the caregiver powers that you have. \n\n* Giving the caregiver these powers does not take them away from you.\n\n* The powers last for one year. The year starts on the date you sign this form or the date an event you choose happens.\n\n* You can renew the powers for another year by completing this process again.\n\n* You can take back the powers at any time by telling the caregiver.': '.\n\n**Facultades parentales y plazos**\nA continuación, elegirá qué facultades parentales desea otorgarle a la persona cuidadora y cuándo las recibirá.\n\nRecuerde:\n\n* Solo puede otorgarle las facultades que usted tiene.\n\n* Otorgarle estas facultades no significa que usted las pierda.\n\n* Las facultades duran un año. Ese año comienza en la fecha en que usted firme este formulario o en la fecha en que ocurra un hecho que elija.\n\n* Puede renovar las facultades por otro año completando este proceso de nuevo.\n\n* Puede revocarlas en cualquier momento informándoselo a la persona cuidadora.', 'Caregiver': 'Persona cuidadora', 'Name an alternate caregiver if': 'Nombre a una persona cuidadora suplente por si', 'is unable or unwilling.': 'no puede o no desea hacerse cargo.', 'We allow the caregiver to': 'Autorizamos a la persona cuidadora a', 'I allow the caregiver to': 'Autorizo a la persona cuidadora a', 'Watch the': 'Cuidar del', 'for a short time': 'durante un período breve', 'An example may be when you go on a vacation, this person will watch the': 'Por ejemplo, mientras usted esté de vacaciones, esta persona cuidará del', 'Care for the': 'Atender las necesidades del', 'basic needs': 'en cuanto a cuidados básicos', 'Make travel and related decisions': 'Tomar decisiones sobre viajes y asuntos relacionados', 'Make financial and legal decisions': 'Tomar decisiones financieras y legales', 'Make other decisions': 'Tomar otras decisiones', 'These powers will start when': 'Estas facultades comenzarán cuando', 'One year after your choice above.': 'Un año después de lo que eligió arriba.', 'The caregiver powers should start if I': 'Las facultades de la persona cuidadora deben comenzar si yo', 'Become mentally unable to care for the': 'Quedo mentalmente incapacitado para cuidar del', 'Become physically unable to care for the': 'Quedo físicamente incapacitado para cuidar del', 'Will': '¿Va a firmar', 'sign?': '?', 'When you share custody with someone, generally they must also sign this form. If you select no, you will be asked to select or write a reason or reasons why they will not sign. Some reasons include that the person is unreachable, cannot be located, unable to consent because of a disability, etc.': 'Cuando comparte la custodia con otra persona, por lo general esa persona también debe firmar este formulario. Si selecciona que no, deberá seleccionar o escribir los motivos por los que no firmará. Por ejemplo, no se puede comunicar con esa persona, no se la puede localizar o no puede dar su consentimiento debido a una discapacidad.', 'will not sign the form because they': 'no firmará el formulario por el siguiente motivo:', 'Have not raised or financially supported the': 'No ha criado ni mantenido económicamente al', 'Efforts made to reach': 'Intentos realizados para contactar a', 'I have sole custody, because the other parent': 'Tengo la custodia exclusiva porque el otro padre o la otra madre', 'Person you share custody with': 'Persona con quien comparte la custodia', 'other parent': 'otro padre u otra madre', 'What is your full legal name?': '¿Cuál es su nombre legal completo?', 'Child or ward': 'Hijo o persona bajo tutela', 'child or ward': 'hijo o persona bajo tutela', '**Your Information**': '**Su información**', '**Person you share custody with**': '**Persona con quien comparte la custodia**', '**Appointed Caregiver**': '**Persona cuidadora designada**', '**Alternate Caregiver**': '**Persona cuidadora suplente**', '**Parental Powers**\n\nShort term power granted:': '**Facultades parentales**\n\nFacultad para cuidados a corto plazo otorgada:', 'Basic needs power granted:': 'Facultad para atender necesidades básicas otorgada:', 'Education power granted:': 'Facultad educativa otorgada:', 'Healthcare power granted:': 'Facultad de atención médica otorgada:', 'Travel power granted:': 'Facultad para viajes otorgada:', 'Financial power granted:': 'Facultad financiera otorgada:', 'Other powers granted:': 'Otras facultades otorgadas:', '**When the powers start**': '**Cuándo comienzan las facultades**', '**Starting events**\n\nMentally unable:': '**Hechos que activan las facultades**\n\nIncapacidad mental:', 'Physically unable:': 'Incapacidad física:', 'Immigration:': 'Inmigración:', 'Arrested:': 'Arresto:', 'Military:': 'Servicio militar:', 'Death:': 'Fallecimiento:', 'Other:': 'Otro:', '**Do you share custody?**': '**¿Comparte la custodia?**', '**Will': '**¿Va a firmar', 'sign?**': '?**', '**Why': '**Por qué', 'will not sign**\n\nEdit the reasons': 'no firmará**\n\nEditar los motivos', '**Why you have sole custody**\n\nEdit the reasons': '**Por qué tiene la custodia exclusiva**\n\nEditar los motivos', 'Edit children information': 'Editar información de los menores', 'Edit person you share custody with information': 'Editar información de la persona con quien comparte la custodia', 'Edit your information': 'Editar su información', 'Edit alternate caregiver information': 'Editar información de la persona cuidadora suplente', 'Form Complete!': '¡Formulario completado!', '. Your form is ready to download and print.  \n\n**Important:** You are not finished. You must print this form and sign it in front of two witnesses': '. Su formulario está listo para descargar e imprimir.\n\n**Importante:** Aún no ha terminado. Debe imprimir este formulario y firmarlo en presencia de dos testigos', 'before you are finished.\n\n\nUse the options on this page to view, download and send your form. Use the\n"Edit answers" button to fix any mistakes.': 'para terminar.\n\n\nUse las opciones de esta página para ver, descargar y enviar su formulario. Use el botón «Editar respuestas» para corregir cualquier error.', 'NJ Power of Attorney Delegation Fillable-with-fields-with-fields9-19': 'Poder de delegación de New Jersey, formulario con campos 9-19', 'nj_power_of_attorney_delegation_main': 'nj_power_of_attorney_delegation_main', 'nj_power_of_attorney_delegation_fillablewithfieldswithfields919_next_steps_2': 'nj_power_of_attorney_delegation_fillablewithfieldswithfields919_next_steps_2', 'Next Steps': 'Próximos pasos', 'Petition for temporary guardian appointment': 'Solicitud de designación de un tutor temporal', "- Make sure you have the child's birth certificate and the Affidavit Concerning Children (JD-FM-164).\n- Get all information about the child and the proposed guardian.": '- Asegúrese de tener el acta de nacimiento del menor y la Declaración jurada sobre menores (JD-FM-164).\n- Reúna toda la información sobre el menor y la persona propuesta como tutor.', '- Submit the completed petition along with the required documents to the appropriate probate court. There will be a document at the end of the interview that will tell you what to do next. \n\nYou can use this form if you are a parent or a court-appointed guardian of a minor. Make sure to file it in the probate district where the child resides.': '- Presente la solicitud completada junto con los documentos requeridos ante el tribunal de sucesiones correspondiente. Al final de la entrevista habrá un documento que le indicará qué hacer después.\n\nPuede usar este formulario si es padre, madre o tutor designado por un tribunal para un menor. Asegúrese de presentarlo en el distrito judicial de sucesiones donde reside el menor.', 'Petition details': 'Detalles de la solicitud', 'Child information': 'Información del menor', "Who is filling out this form? the child's Parent or a Court-appointed guardian?": '¿Quién está completando este formulario: el padre o la madre del menor, o un tutor designado por el tribunal?', 'Parent or Court-appointed guardian': 'Padre, madre o tutor designado por el tribunal', 'phone number?': 'número de teléfono?', 'Proposed Temporary Guardian date of birth': 'Fecha de nacimiento de la persona propuesta como tutor temporal', "Child's parents information": 'Información de los padres del menor', 'List ALL people who have guardianship rights over the child. (For each person, list name, address, telephone number, including the date of birth for any person who is under the age of 18, any person in the military service\nor any person under conservatorship or legal disability)': 'Enumere a TODAS las personas que tengan derechos de tutela sobre el menor. Para cada persona, indique su nombre, dirección y teléfono. Incluya la fecha de nacimiento de toda persona menor de 18 años, que preste servicio militar o que esté bajo curatela o tenga una incapacidad legal.', 'Reasons for guardianship': 'Motivos de la tutela', 'Illness, absence from the area, military leave, other': 'Enfermedad, ausencia de la zona, servicio militar u otro motivo', 'Legal proceedings': 'Procedimientos judiciales', 'When should the guardianship end? (1 year at most)': '¿Cuándo debe terminar la tutela? Un año como máximo.', '**Probate court**': '**Tribunal de sucesiones**', '; district': '; distrito', '**Child**': '**Menor**', '**Child information**': '**Información del menor**', '**Petitioner name**': '**Nombre del solicitante**', '**Petitioner address**': '**Dirección del solicitante**', '**Petitioner telephone number**': '**Teléfono del solicitante**', '**Petitioner status**': '**Calidad del solicitante**', '**Proposed temporary guardian**': '**Tutor temporal propuesto**', '; born': '; con fecha de nacimiento', '**People with guardianship rights**': '**Personas con derechos de tutela**', '**Reasons for guardianship**': '**Motivos de la tutela**', '**Connecticut residence**': '**Residencia en Connecticut**', '**Current proceedings**': '**Procedimientos actuales**', '**Past proceedings**': '**Procedimientos anteriores**', '**Safety service agreement**': '**Acuerdo de seguridad o de servicios**', '**Protective or restraining order**': '**Orden de protección o de restricción**', '**Child support order**': '**Orden de manutención infantil**', '**Termination date**': '**Fecha de finalización**', '. Your form is ready to download and deliver. DO NOT FORGET the child\'s birth certificate, the Affidavit Concerning Children (JD-FM-164) and the Confidential Information Sheet (PC-504CI)\n\nUse the options on this page to view, download and send your form. Use the\n"Edit answers" button to fix any mistakes.': '. Su formulario está listo para descargar y entregar. NO OLVIDE el acta de nacimiento del menor, la Declaración jurada sobre menores (JD-FM-164) y la Hoja de información confidencial (PC-504CI).\n\nUse las opciones de esta página para ver, descargar y enviar su formulario. Use el botón «Editar respuestas» para corregir cualquier error.', 'Petition Appointment of TG CT PC-504 with fields': 'Solicitud de designación de tutor temporal de Connecticut, PC-504, con campos', 'All forms to deliver to court': 'Todos los formularios para entregar al tribunal', 'petition_appointment_of_tg_ct_pc504_with_fields_next_steps': 'petition_appointment_of_tg_ct_pc504_with_fields_next_steps', 'CTPetitionAppointmentOfTemporaryGuardianship': 'CTPetitionAppointmentOfTemporaryGuardianship', 'Delegate parental power effectively': 'Delegue eficazmente las facultades parentales', 'Colorado Delegation of Guardian': 'Delegación de facultades por parte del padre, la madre o el tutor (Colorado)', '- Carefully choose your "Attorney in Fact", who will be the caregiver.\n- Locate a notary for the form.': '- Elija cuidadosamente a su «apoderado», quien será la persona cuidadora.\n- Busque un notario para el formulario.', '- Sign the document in front of a notary public.\n- Give the signed, notarized original to the named Attorney in Fact and keep a copy for your records.\n\nUse this form if you are a parent or guardian who needs to temporarily delegate your power. It is important to make sure that the person you are naming is trustworthy and can handle the responsibilities.': '- Firme el documento ante un notario público.\n- Entregue el original firmado y certificado por el notario al apoderado designado y guarde una copia para sus archivos.\n\nUse este formulario si es padre, madre o tutor y necesita delegar temporalmente su autoridad. Es importante asegurarse de que la persona designada sea de confianza y pueda asumir las responsabilidades.', 'Parent/Guardian Information': 'Información del padre, de la madre o del tutor', 'How long would you like this person to take care of the child?': '¿Por cuánto tiempo desea que esta persona cuide del menor?', 'When should this permission end? Enter a date up to 12 months after you sign this form.': '¿Cuándo debe terminar esta autorización? Ingrese una fecha que no supere los 12 meses después de firmar este formulario.', 'When and where was this document notarized?': '¿Cuándo y dónde se certificó este documento ante notario?', 'What is the name of the child?': '¿Cómo se llama el menor?', 'What is the name of the notary?': '¿Cómo se llama el notario?', 'notarized': 'certificado ante notario', 'Who would you like to take care of the child?': '¿Quién desea que cuide del menor?', 'Attorney in Fact': 'Apoderado', '**Parent/Guardian Information**\n\nRelationship to the minor or incapacitated:': '**Información del padre, de la madre o del tutor**\n\nParentesco o relación con el menor o la persona incapacitada:', 'Date of parent or guardian signature:': 'Fecha de firma del padre, de la madre o del tutor:', '**Authorization Details**\n\nEnd date of authorization:': '**Detalles de la autorización**\n\nFecha de finalización de la autorización:', '**Notarization Information**\n\nState where notarization occurred:': '**Información de la certificación notarial**\n\nEstado donde se realizó la certificación notarial:', 'Day of notarization:': 'Día de la certificación notarial:', 'Month of notarization:': 'Mes de la certificación notarial:', 'Year of notarization:': 'Año de la certificación notarial:', 'End date of notarization:': 'Fecha de vencimiento de la certificación notarial:', '**Notarized**': '**Certificado ante notario**', '**Relationship to the minor or incapacitated**\n\nRelationship to the minor or incapacitated:': '**Parentesco o relación con el menor o la persona incapacitada**\n\nParentesco o relación con el menor o la persona incapacitada:', '**Date of parent or guardian signature**\n\nDate of parent or guardian signature:': '**Fecha de firma del padre, de la madre o del tutor**\n\nFecha de firma del padre, de la madre o del tutor:', '**End date of authorization**\n\nEnd date of authorization:': '**Fecha de finalización de la autorización**\n\nFecha de finalización de la autorización:', '**State where notarization occurred**\n\nState where notarization occurred:': '**Estado donde se realizó la certificación notarial**\n\nEstado donde se realizó la certificación notarial:', '**Day of notarization**\n\nDay of notarization:': '**Día de la certificación notarial**\n\nDía de la certificación notarial:', '**Month of notarization**\n\nMonth of notarization:': '**Mes de la certificación notarial**\n\nMes de la certificación notarial:', '**Year of notarization**\n\nYear of notarization:': '**Año de la certificación notarial**\n\nAño de la certificación notarial:', '**End date of notarization**\n\nEnd date of notarization:': '**Fecha de vencimiento de la certificación notarial**\n\nFecha de vencimiento de la certificación notarial:', 'Edit notarized': 'Editar datos de la certificación notarial', 'Thank you. Your form is ready to download and deliver.': 'Gracias. Su formulario está listo para descargar y entregar.', 'colorado_delegation_of_guardian_next_steps': 'colorado_delegation_of_guardian_next_steps', 'colorado_delegation_of_guardian': 'colorado_delegation_of_guardian', 'File a Petition for Temporary Guardianship in Georgia': 'Presente una solicitud de tutela temporal en Georgia', "- Use this form to ask the court to name you as a child's temporary guardian. The child's parents must agree to the guardianship. If a parent does not agree, the court will want to know why and may not accept this form.": '- Use este formulario para pedirle al tribunal que le nombre tutor temporal de un menor. Los padres del menor deben estar de acuerdo con la tutela. Si uno de los padres no está de acuerdo, el tribunal querrá saber por qué y es posible que no acepte este formulario.', "- This form is for the person who wants to become the child's temporary guardian.": '- Este formulario es para la persona que desea ser el tutor temporal del menor.', '- You would use this form to legally step in and care for a child when their parents are temporarily unable to care for them, but the parents are still willing to cooperate or keep their parental rights.\n- This form could be used for medical decisions, school enrollment, if a parent becomes sick, or making everyday life decisions for the child.': '- Use este formulario para hacerse cargo legalmente del cuidado de un menor cuando sus padres no puedan cuidarlo temporalmente, pero aún estén dispuestos a cooperar o conserven sus derechos parentales.\n- Puede usarse para tomar decisiones médicas, inscribir al menor en la escuela, atenderlo si uno de los padres se enferma o tomar decisiones de la vida diaria por él.', "- Have information about the child and both parents ready.\n- Make sure you have a copy of the child's birth certificate. If you don't, you might risk the court rejecting the form or taking longer to process your request. \n- You may include copies of other documents, like a custody order or a parent's death certificate. If you don't have copies of other documents, you can still file this form without them.": '- Tenga lista la información del menor y de ambos padres.\n- Asegúrese de tener una copia del acta de nacimiento del menor. Si no la tiene, existe el riesgo de que el tribunal rechace el formulario o tarde más en tramitar su solicitud.\n- Puede incluir copias de otros documentos, como una orden de custodia o el certificado de defunción de uno de los padres. Si no tiene copias de esos otros documentos, aun así puede presentar este formulario.', '- Check your answers, then print at least three copies of the form.\n- You can sign the papers ahead of time in front of a Notary Public (a person at a bank or store who officially stamps legal papers). Or, you can bring everyone to the court house and sign them in front of a court clerk. No matter what, you cannot sign the papers alone at home —an official person must watch you write your name.\n- File the signed form with the Probate Court in your county.\n- Keep a copy for yourself.': '- Revise sus respuestas e imprima al menos tres copias del formulario.\n- Puede firmar los documentos por adelantado ante un notario público, una persona en un banco o una tienda que certifica documentos legales. O puede acudir al tribunal con todas las personas que deban firmar y hacerlo ante el secretario del tribunal. En ningún caso puede firmar los documentos a solas en su casa: una persona autorizada debe observar su firma.\n- Presente el formulario firmado ante el tribunal de sucesiones de su condado.\n- Guarde una copia para usted.', 'https://www.fultonprobatega.org/208/Minor-Guardianship-Conservatorship': 'https://www.fultonprobatega.org/208/Minor-Guardianship-Conservatorship', 'If a parent who has full legal rights -- called a natural guardian -- says no to the temporary guardian request, the judge will throw out the request right away without having a court hearing.\n\nBut if a parent who doesn\'t have those full legal rights says no, the court will set up a meeting or hearing to talk about it. If that is the case, start the form again and make sure to choose "other circumstances". Write the information in the "Other information" section later on the form. \n\nIf the child is unsafe, you may need to seek help through Juvenile Court.\n\n* To learn more, visit the Georgia courts web page on [minor guardianships](https://www.fultonprobatega.org/208/Minor-Guardianship-Conservatorship).': 'Si un padre o una madre con plenos derechos legales, a quien se llama tutor natural, se opone a la solicitud de tutela temporal, el juez desestimará la solicitud de inmediato sin celebrar una audiencia judicial.\n\nPero si se opone un padre o una madre que no tiene esos plenos derechos legales, el tribunal programará una reunión o audiencia para tratar el asunto. En ese caso, comience el formulario de nuevo y asegúrese de elegir «otras circunstancias». Explíquelas en la sección «Otra información» más adelante en el formulario.\n\nSi el menor no está a salvo, quizás deba solicitar ayuda al tribunal de menores.\n\n* Para obtener más información, visite la página de los tribunales de Georgia sobre [tutelas de menores](https://www.fultonprobatega.org/208/Minor-Guardianship-Conservatorship).', "'s phone number?": 'su número de teléfono?', 'Minor selection form': 'Formulario de elección del menor', 'Relationship to': 'Parentesco o relación con', 'What is the name of': '¿Cómo se llama', "'s mother?": 'su madre?', "'s Status": 'Situación', 'Has': '¿Ha', 'died?': 'fallecido?', "If you do not know the mother's address, check the box below.": 'Si no conoce la dirección de la madre, marque la casilla de abajo.', 'AL_DEFAULT_STATE': 'AL_DEFAULT_STATE', 'signed a form agreeing to this temporary guardianship?': 'firmado un formulario de consentimiento a esta tutela temporal?', 'Has a court ended': '¿Un tribunal ha terminado', "'s parental rights?": 'sus derechos parentales?', "'s Legal Custody": 'Custodia legal', 'Has a court order taken away': '¿Una orden judicial le ha quitado a', "'s custody?": 'la custodia?', 'Does a court order give': '¿Una orden judicial le otorga a', 'joint legal custody?': 'la custodia legal compartida?', 'sole legal custody?': 'la custodia legal exclusiva?', "'s Marital Status": 'Estado civil', 'Was': '¿Estaba', "married to the child's father when the child was conceived or at any time after that?": 'casada con el padre del menor cuando este fue concebido o en algún momento después?', 'married to anyone else when the child was conceived or born?': 'casada con otra persona cuando el menor fue concebido o cuando nació?', "'s Spouse Information": 'Información del cónyuge', 'If': 'Si', "was married to someone else when the child was born, fill in that person's information below.": 'estaba casada con otra persona cuando nació el menor, complete abajo la información de esa persona.', "'s father?": 'su padre?', "'s Consent and Custody": 'Consentimiento y custodia', 'Has a court order ended': '¿Una orden judicial ha terminado', "' joint legal custody?": 'la custodia legal compartida?', 'For example, this form could be used for:\n\n* Medical decisions\n* Enrolling a child in school\n* A parent is too sick to make decisions for the child\n* The parent needs help making decision for the child for some other reason': 'Por ejemplo, este formulario puede usarse para:\n\n* Tomar decisiones médicas\n* Inscribir a un menor en la escuela\n* Atender una situación en que un padre o una madre está demasiado enfermo para tomar decisiones por el menor\n* Ayudar a un padre o una madre a tomar decisiones por el menor por algún otro motivo', 'Other Information': 'Otra información', 'Fill in the name of the lawyer helping you with this form.': 'Ingrese el nombre del abogado que le ayuda con este formulario.', 'Read over your form before you finish it.': 'Revise su formulario antes de terminarlo.', 'Open the preview to check your form. Use the ‘Edit answers’ button to make changes.': 'Abra la vista previa para revisar su formulario. Use el botón «Editar respuestas» para hacer cambios.', 'Return to this screen when you are ready to continue.': 'Regrese a esta pantalla cuando esté listo para continuar.', 'Check your answers below. Click Edit to change your guardian information.': 'Revise sus respuestas de abajo. Haga clic en Editar para cambiar su información como tutor.', '**Your information**\n\nName:': '**Su información**\n\nNombre:', 'Address:': 'Dirección:', 'Phone:': 'Teléfono:', '**Second guardian information**\n\nName:': '**Información del segundo tutor**\n\nNombre:', 'condition': 'condition', "**Child's information**\n\nName:": '**Información del menor**\n\nNombre:', 'Birthdate:': 'Fecha de nacimiento:', '**Relationship with the child**\n\nRelationship:': '**Parentesco o relación con el menor**\n\nParentesco o relación:', "**Mother's information**\n\nName:": '**Información de la madre**\n\nNombre:', 'Mother deceased:': 'Madre fallecida:', 'Mother consent:': 'Consentimiento de la madre:', "**Mother's parental rights**\n\nRights terminated by court order:": '**Derechos parentales de la madre**\n\nTerminados por orden judicial:', "**Mother's legal custody**\n\nLost custody by court order:": '**Custodia legal de la madre**\n\nPérdida de la custodia por orden judicial:', 'Joint legal custody by court order:': 'Custodia legal compartida por orden judicial:', 'Sole legal custody by court order:': 'Custodia legal exclusiva por orden judicial:', "**Mother's marital status**\n\nMarried to the father during or after conception:": '**Estado civil de la madre**\n\nCasada con el padre durante o después de la concepción:', 'Married to another person during conception or birth:': 'Casada con otra persona durante la concepción o al nacer el menor:', "**Mother's spouse information**\n\nSpouse's name:": '**Información del cónyuge de la madre**\n\nNombre del cónyuge:', "Spouse's address:": 'Dirección del cónyuge:', "**Father's Information**\n\nName:": '**Información del padre**\n\nNombre:', 'Has Father died:': 'Padre fallecido:', "Father's consent:": 'Consentimiento del padre:', "**Father's parental rights**\n\nHave the Father's rights been terminated by a Court Order?": '**Derechos parentales del padre**\n\n¿Se han terminado los derechos del padre por orden judicial?', "**Father's legal custody**\n\nHas the Father lost custody via Court Order?": '**Custodia legal del padre**\n\n¿El padre ha perdido la custodia por orden judicial?', 'Does the Father have joint legal custody via Court Order?': '¿El padre tiene custodia legal compartida por orden judicial?', 'Does the Father have sole legal custody via Court Order?': '¿El padre tiene custodia legal exclusiva por orden judicial?', '**Guardianship details**\n\nReason:': '**Detalles de la tutela**\n\nMotivo:', '**Other Information**': '**Otra información**', "**Lawyer's information**\n\nName:": '**Información del abogado**\n\nNombre:', 'Phone Number:': 'Número de teléfono:', 'Bar number:': 'Número de inscripción en el colegio de abogados:', '**Court Information**\n\nCounty:': '**Información del tribunal**\n\nCondado:', 'Edit guardian information': 'Editar información del tutor', 'Edit mothers': 'Editar datos de la madre', 'Edit fathers': 'Editar datos del padre', '. Your form is ready to download, print, and sign. \n\nUse the options below to view, download, or send your form. Click ‘Edit answers’ to make changes.': '. Su formulario está listo para descargar, imprimir y firmar.\n\nUse las opciones de abajo para ver, descargar o enviar su formulario. Haga clic en «Editar respuestas» para hacer cambios.', 'Next Step Instructions': 'Instrucciones de próximos pasos', 'Temporary Guardianship Form': 'Formulario de tutela temporal', 'gpcsfwithfields_1_next_steps': 'gpcsfwithfields_1_next_steps', 'gpcsfwithfields 1': 'gpcsfwithfields 1', 'gpcsfwithfields_1': 'gpcsfwithfields_1', 'Massachusetts Temporary Agent Form': 'Formulario de agente temporal de Massachusetts', "Someone who is legally a child's parent.": 'Una persona que es legalmente el padre o la madre de un menor.', 'Someone who has been given the legal right to care for a child.': 'Una persona a quien se le ha otorgado el derecho legal de cuidar de un menor.', 'The parent, legal guardian, or legal custodian who is picking someone to care for the child.': 'El padre, la madre, el tutor legal o el custodio legal que elige a alguien para cuidar del menor.', 'The adult you choose to take care of your child and make choices for your child while you are not able to. Your agent must be 18 or older and must agree to do this.': 'El adulto que usted elige para cuidar de su hijo y tomar decisiones por él cuando usted no pueda hacerlo. Su agente debe tener 18 años o más y aceptar esta responsabilidad.', 'The person you choose to care for your child and make choices for your child while you are not able to.': 'La persona que usted elige para cuidar de su hijo y tomar decisiones por él cuando usted no pueda hacerlo.', 'A second person who can care for your child if the first person you choose is not available. The backup agent cannot act for you until you are detained or missing.': 'Una segunda persona que puede cuidar de su hijo si la primera persona elegida no está disponible. El agente suplente no puede actuar en su nombre hasta que usted esté detenido o no se sepa dónde está.', '- You can use this form if you are a {parent}, {legal guardian}, or {legal custodian}. It lets you choose someone to care for your child if you are suddenly separated from your child. The person you choose is your {agent}. Your agent must understand and agree to the responsibilities.\n- This form only takes effect if:\n    - you are detained by law enforcement,\n    - you are deported from the United States, or\n    - your agent does not know where you are for 24 hours.\n- It does not take effect for other reasons, such as a medical procedure, an illness, or work travel.\n- Once it takes effect, it lasts for 60 days, unless you change or cancel it in writing before then.': '- Puede usar este formulario si es {padre o madre}, {tutor legal} o {custodio legal}. Le permite elegir a alguien para cuidar de su hijo si se separan de repente. La persona elegida será su {apoderado}. Debe comprender y aceptar las responsabilidades.\n- Este formulario solo entra en vigor si:\n    - las autoridades lo detienen,\n    - usted es deportado de Estados Unidos, o\n    - su apoderado no sabe dónde está usted durante 24 horas.\n- No entra en vigor por otros motivos, como un procedimiento médico, una enfermedad o un viaje de trabajo.\n- Una vez que entra en vigor, dura 60 días, a menos que usted lo modifique o cancele por escrito antes.', '- Two witnesses.\n- Each witness must be at least 18, and your {agent} cannot be one of them.\n- Have your {agent} agree.\n- Get the other parent’s written permission if they are alive, easy to find, and able and willing to care for your child.': '- Dos testigos.\n- Cada testigo debe tener al menos 18 años, y su {apoderado} no puede ser uno de ellos.\n- Obtenga la aceptación de su {apoderado}.\n- Obtenga el permiso escrito del otro padre o de la otra madre si vive, se le puede localizar fácilmente y puede y desea cuidar de su hijo.', '- Have the form signed by witnesses and the chosen agent.\n- Have the form notarized.\n- Keep a copy for yourself and give copies to the chosen agent(s).': '- Obtenga las firmas de los testigos y del apoderado elegido.\n- Obtenga la certificación notarial del formulario.\n- Guarde una copia para usted y entregue copias a los apoderados elegidos.', 'Have your parental rights been terminated?': '¿Se han terminado sus derechos parentales?', 'Answer **Yes** if a court ended (took away) your parental rights.\n\nAlso answer **Yes** if you signed papers giving up your parental rights.': 'Responda **Sí** si un tribunal terminó sus derechos parentales, es decir, se los quitó.\n\nTambién responda **Sí** si firmó documentos para renunciar a sus derechos parentales.', 'Is there a court order that says you cannot give these rights and duties to someone else?': '¿Existe una orden judicial que le prohíbe delegar estos derechos y deberes a otra persona?', 'Answer **Yes** if a court order says you cannot give your rights and duties as a parent to someone else.\n\nAlso answer **Yes** if a court order gives custody of your child to someone else. The order does not have to use the words "you cannot give these rights."': 'Responda **Sí** si una orden judicial le prohíbe delegar sus derechos y deberes como padre o madre a otra persona.\n\nTambién responda **Sí** si una orden judicial le otorga a otra persona la custodia de su hijo. La orden no tiene que decir expresamente «no puede delegar estos derechos».', 'You are ineligible to complete this form.': 'No cumple los requisitos para completar este formulario.', "**Why can't I use this form?**\n\nYou said a court took away your rights as a parent. Or you signed papers to give them up.\n\nThis form lets a parent pass their rights to care for a child to another adult for a short time. But you can only give away something you have. You no longer have parental rights, so you cannot give them to someone else.\n\nDo you think this is a mistake? Do you want to know your choices? Talk to a lawyer. You can find free legal help at [masslegalhelp.org](https://www.masslegalhelp.org).": '**¿Por qué no puedo usar este formulario?**\n\nUsted indicó que un tribunal le quitó sus derechos parentales o que firmó documentos para renunciar a ellos.\n\nEste formulario permite que un padre o una madre delegue a otro adulto, por un período breve, sus derechos de cuidar de un menor. Pero solo puede delegar derechos que tiene. Usted ya no tiene derechos parentales, por lo que no puede delegarlos a otra persona.\n\n¿Cree que hay un error? ¿Quiere conocer sus opciones? Consulte a un abogado. Puede encontrar asistencia legal gratuita en [masslegalhelp.org](https://www.masslegalhelp.org).', "**Why can't I use this form?**\n\nYou said there is a court order that stops you from giving these rights and duties to someone else. This includes an order that gives custody of your child to someone else.\n\nEveryone has to follow a judge's order. This form cannot change or get around what the judge decided.\n\nIf you want the order changed, you need to ask the court. A lawyer can help you. You can find free legal help at [masslegalhelp.org](https://www.masslegalhelp.org).": '**¿Por qué no puedo usar este formulario?**\n\nUsted indicó que existe una orden judicial que le impide delegar estos derechos y deberes a otra persona. Esto incluye una orden que le otorga a otra persona la custodia de su hijo.\n\nTodas las personas deben cumplir las órdenes de un juez. Este formulario no puede cambiar ni eludir lo que decidió el juez.\n\nSi desea modificar la orden, debe pedírselo al tribunal. Un abogado puede ayudarle. Puede encontrar asistencia legal gratuita en [masslegalhelp.org](https://www.masslegalhelp.org).', 'Important information': 'Información importante', 'Read each statement and check the box to show you read it.': 'Lea cada declaración y marque la casilla para indicar que la leyó.', 'Your Information': 'Su información', "Are you the child's {parent}, {legal guardian}, or {legal custodian}? Tap a green word to see what it means.": '¿Usted es {padre o madre}, {tutor legal} o {custodio legal} del menor? Toque una palabra verde para ver su significado.', 'Did the other parent agree to you choosing an agent?': '¿El otro padre o la otra madre aceptó que usted eligiera un agente?', 'Tell us if your child’s other parent agreed to the agent or agents you chose. If you do not know who the other parent is, answer **No**.': 'Indique si el otro padre o la otra madre de su hijo aceptó al agente o los agentes que eligió. Si no sabe quién es, responda **No**.', 'The other parent': 'El otro padre o la otra madre', 'Write the other parent’s information here. (This section does not need to be completed before a notary.)': 'Escriba aquí la información del otro padre o de la otra madre. Esta sección no tiene que completarse ante un notario.', 'Why is the other parent not giving permission?': '¿Por qué el otro padre o la otra madre no da su permiso?', "You need the other parent's permission unless one of these is true. Choose the reason that fits.": 'Necesita el permiso del otro padre o de la otra madre, a menos que se dé una de estas circunstancias. Elija el motivo que corresponda.', 'Are you completing this form together with your agent(s)?': '¿Está completando este formulario junto con su agente o sus agentes?', 'Tap a green word to see who each person is.\n\n* You (the {appointing party})\n* {Temporary agent}\n* {Backup agent} (optional)': 'Toque una palabra verde para ver quién es cada persona.\n\n* Usted, la {parte que otorga la autorización}\n* {Agente temporal}\n* {Agente suplente}, opcional', 'Have the agent(s) review, date, and sign the form in front of the witnesses and notary.': 'Pida a los apoderados que revisen, fechen y firmen el formulario ante los testigos y el notario.', 'Is your {agent} 18 years old or above?': '¿Su {agente} tiene 18 años o más?', 'Your agent must be 18 years old or older. Only an adult can be a caregiver.': 'Su agente debe tener 18 años o más. Solo un adulto puede ser una persona cuidadora.', 'Choose a different person who is 18 or older. If you picked the wrong answer, tap **Undo** to change it.': 'Elija a otra persona que tenga 18 años o más. Si eligió la respuesta equivocada, toque **Deshacer** para cambiarla.', 'This is the day your agent read this form and agreed to be your agent.': 'Es el día en que su agente leyó este formulario y aceptó ser su agente.', 'Agent Details': 'Datos del agente', 'Write the name and address of the person you want to take care of your child or children. This person is called “the agent.” The agent can make any decision for your children that you could make.': 'Escriba el nombre y la dirección de la persona que desea que cuide de su hijo o sus hijos. Esta persona se llama «agente». El agente puede tomar las mismas decisiones por sus hijos que usted podría tomar.', 'The agent cannot change my child’s school.': 'El agente no puede cambiar a mi hijo de escuela.', 'Write down anything you don’t want the agent to do.': 'Escriba todo lo que no desea que haga el agente.', 'Tap the green words to {see an example}.': 'Toque las palabras verdes para {ver un ejemplo}.', 'Would you like to add a {backup agent}?': '¿Desea agregar a un {agente suplente}?', 'Tap the green words to see what a backup agent is.': 'Toque las palabras verdes para ver qué es un agente suplente.', 'Are you completing this form together with your backup agent?': '¿Está completando este formulario junto con su agente suplente?', 'This is the day your backup agent read this form and agreed to be your backup agent.': 'Es el día en que su agente suplente leyó este formulario y aceptó ser su agente suplente.', 'Backup Agent': 'Agente suplente', 'Write the backup agent’s name, address, and phone number here. The backup agent must agree that he or she cannot act for you until you are detained or missing.': 'Escriba aquí el nombre, la dirección y el teléfono del agente suplente. Esta persona debe aceptar que no puede actuar en su nombre hasta que usted esté detenido o no se sepa dónde está.', 'The birthdate you entered shows that': 'La fecha de nacimiento que ingresó indica que', 'years old. This form is for children under 18.\n\nIf the birthdate is wrong, tap **Back** to fix it. If it is right, you can still continue.': 'años. Este formulario es para menores de 18 años.\n\nSi la fecha de nacimiento es incorrecta, toque **Atrás** para corregirla. Si es correcta, aún puede continuar.', 'Who must sign and initial this form?\n\n- You\n- Your Agent\n- The other parent, if available\n- Your backup agent, if you chose one\n\nYou must sign the form in front of a notary and two witnesses. Your agent and backup agent cannot be witnesses.': '¿Quiénes deben firmar y poner sus iniciales en este formulario?\n\n- Usted\n- Su apoderado\n- El otro padre o la otra madre, si está disponible\n- Su apoderado suplente, si eligió uno\n\nDebe firmar el formulario ante un notario y dos testigos. Su apoderado y su apoderado suplente no pueden ser testigos.', 'Preview your form': 'Revise su formulario', 'Here is a preview of your form.': 'Esta es una vista previa de su formulario.', 'Return to this interview tab to continue.': 'Regrese a esta pestaña de la entrevista para continuar.', '**Appointing Party Information**\n\nUser1 home address:': '**Información de la persona que designa al apoderado**\n\nDirección de su domicilio:', 'User1 phone number:': 'Su número de teléfono:', 'User1 relationship status:': 'Su calidad respecto al menor:', '**Completing the form with your agent(s)**\n\nCompleting the form with your agent(s):': '**Completar el formulario con sus apoderados**\n\nEstá completando el formulario con sus apoderados:', '**Temporary Agent Details**\n\nTemporary agent printed name:': '**Datos del apoderado temporal**\n\nNombre en letra de molde del apoderado temporal:', 'Temporary agent home address:': 'Dirección del domicilio del apoderado temporal:', 'Temporary agent phone number:': 'Teléfono del apoderado temporal:', 'Temporary agent appointment date:': 'Fecha de designación del apoderado temporal:', '**Not allowed Acts**\n\nActs not allowed for agent:': '**Actos no permitidos**\n\nActos que el apoderado no puede realizar:', '**Backup Agent**\n\nAdd a backup agent:': '**Apoderado suplente**\n\nAgregar a un apoderado suplente:', '**Completing the form with your backup agent**\n\nCompleting the form with your backup agent:': '**Completar el formulario con su apoderado suplente**\n\nEstá completando el formulario con su apoderado suplente:', '**Backup Agent Information**\n\nAlternate agent printed name:': '**Información del apoderado suplente**\n\nNombre en letra de molde del apoderado suplente:', 'Alternate agent home address:': 'Dirección del domicilio del apoderado suplente:', 'Alternate agent phone number:': 'Teléfono del apoderado suplente:', 'Date of alternate agent appointment:': 'Fecha de designación del apoderado suplente:', '**Other Parent & Consent**\n\nConsent from non-appointing parent:': '**Otro padre u otra madre y consentimiento**\n\nConsentimiento del padre o de la madre que no designa al apoderado:', 'No consent from non-appointing parent:': 'No hay consentimiento del padre o de la madre que no designa al apoderado:', 'Reason consent was not received:': 'Motivo por el que no se obtuvo el consentimiento:', 'Name of other parent:': 'Nombre del otro padre o de la otra madre:', 'Address of other parent:': 'Dirección del otro padre o de la otra madre:', 'Phone number of other parent:': 'Teléfono del otro padre o de la otra madre:', 'Date of other parent consent:': 'Fecha de consentimiento del otro padre o de la otra madre:', 'You can list up to 4 children on this form.': 'Puede incluir hasta 4 menores en este formulario.', 'Temporary Agent Form': 'Formulario de agente temporal', 'temporary_agent_esp_2_next_steps': 'temporary_agent_esp_2_next_steps', 'temporary_agent_esp_2': 'temporary_agent_esp_2', 'Planning for family emergency packet': 'Paquete de planificación para una emergencia familiar', 'planning_for_family_emergency_packet': 'planning_for_family_emergency_packet', 'What is your hourly pay for this full-time job?': '¿Cuánto le pagan por hora en este trabajo de tiempo completo?', 'What are your wages for this full-time job?': '¿Cuál es su salario en este trabajo de tiempo completo?', 'What is your hourly pay for this part-time job?': '¿Cuánto le pagan por hora en este trabajo de tiempo parcial?', 'What are your wages for this part-time job?': '¿Cuál es su salario en este trabajo de tiempo parcial?', 'Do not use any of these characters in the name: `( ) { } * ^ #`.': 'No use ninguno de estos caracteres en el nombre: `( ) { } * ^ #`.', 'Start your guardianship petition today': 'Comience hoy su solicitud de tutela', 'Maryland Petition for Guardianship of Minor': 'Solicitud de tutela de un menor en Maryland', '- Gather all needed information about the minor and your connection to them.\n- Have any required documents, like birth certificates, ready to include.': '- Reúna toda la información necesaria sobre el menor y su relación con él.\n- Tenga listos los documentos requeridos, como las actas de nacimiento, para adjuntarlos.', '- Check your petition for accuracy and completeness.\n- Send the petition to the right court along with any required fees.\n\nYou can use this form if you are seeking guardianship of a minor child. If the minor is not a child, a different form is needed. Make sure to fill out separate petitions for each minor unless they are full siblings in the same situation. Half-siblings need separate petitions.\n\nThis petition asks the court to appoint a guardian of the **person** of a minor. It does not ask for guardianship of the minor’s property.': '- Revise que su solicitud sea correcta y esté completa.\n- Preséntela ante el tribunal correspondiente junto con las tasas requeridas.\n\nPuede usar este formulario si solicita la tutela de un menor. Para una persona adulta se necesita otro formulario. Complete solicitudes separadas para cada menor, a menos que sean hermanos de padre y madre y se encuentren en la misma situación. Los medios hermanos necesitan solicitudes separadas.\n\nEsta solicitud pide al tribunal que designe a un tutor de la **persona** de un menor. No solicita la tutela de los bienes del menor.', 'Are you 18 years of age or older?': '¿Tiene 18 años o más?', 'https://www.mdlab.org': 'https://www.mdlab.org', 'You must be 18 or older to use this form': 'Debe tener 18 años o más para usar este formulario', "Because you answered that you are under 18, you can't file a petition for guardianship of a minor with this form.\n\nIf you are under 18 and need help with a guardianship or custody situation, you can ask a trusted adult to help you, or contact [Maryland Legal Aid](https://www.mdlab.org) for free legal help.\n\nIf you answered by mistake, you can go back and change your answer.": 'Como indicó que tiene menos de 18 años, no puede presentar una solicitud de tutela de un menor con este formulario.\n\nSi es menor de 18 años y necesita ayuda con una situación de tutela o custodia, puede pedir ayuda a un adulto de confianza o comunicarse con [Maryland Legal Aid](https://www.mdlab.org) para obtener asistencia legal gratuita.\n\nSi respondió por error, puede volver atrás y cambiar su respuesta.', 'Who is filling out this petition?': '¿Quién está completando esta solicitud?', 'Your attorney details': 'Sus datos como abogado', "Skip this if there isn't one.": 'Omita este campo si no tiene uno.', 'Date of signing': 'Fecha de firma', 'Which kind of court are you filing in?': '¿Ante qué tipo de tribunal presentará la solicitud?', 'Which county are you filing in?': '¿En qué condado presentará la solicitud?', 'If you are filing in Baltimore City, choose Baltimore City.': 'Si la presentará en la ciudad de Baltimore, elija Baltimore City.', "What is the court's address?": '¿Cuál es la dirección del tribunal?', "What is the court's phone number?": '¿Cuál es el número de teléfono del tribunal?', 'Who are': '¿Quiénes son', "Enter the legal parents' full names. Leave the second blank if there is only one known parent.": 'Ingrese los nombres completos de los padres legales. Deje el segundo campo en blanco si solo se conoce a uno de los padres.', 'Does': '¿', 'live in': 'vive en', 'Where in': '¿En qué lugar de', 'staying now?': 'se encuentra ahora?', 'Who is asking to be': '¿Quién está solicitando ser', 'Who is the prospective guardian of': '¿Quién es la persona propuesta como tutor de', 'Their relationship to': 'Su parentesco o relación con', 'Is there another child on this petition?': '¿Hay otro menor en esta solicitud?', 'A single petition can cover full siblings in the same situation. Half-siblings, and children who are not in the same situation, need separate petitions.': 'Una sola solicitud puede incluir a hermanos de padre y madre que se encuentren en la misma situación. Los medios hermanos y los menores que no estén en la misma situación necesitan solicitudes separadas.', "This petition has room for six children, so you can't add more. If there are other children, start a separate petition for them.": 'Esta solicitud tiene espacio para seis menores y no puede agregar más. Si hay otros menores, presente una solicitud separada para ellos.', 'How is your client related to the child or children?': '¿Qué parentesco o relación tiene su cliente con el menor o los menores?', 'How are you related to the child or children?': '¿Qué parentesco o relación tiene usted con el menor o los menores?', 'For example: grandmother, aunt, family friend.': 'Por ejemplo: abuela, tía, amigo de la familia.', 'Is any child a beneficiary of the Department of Veterans Affairs?': '¿Alguno de los menores recibe beneficios del Departamento de Asuntos de los Veteranos?', 'If yes, the court will need a certificate from the Department of Veterans Affairs. You will attach it to your petition.': 'Si responde que sí, el tribunal necesitará un certificado del Departamento de Asuntos de los Veteranos. Deberá adjuntarlo a su solicitud.', 'Has your client been convicted of a crime listed in Estates and Trusts §11-114?': '¿Su cliente ha sido condenado por un delito incluido en la sección 11-114 del artículo Sucesiones y Fideicomisos (Estates and Trusts)?', 'Have you been convicted of a crime listed in Estates and Trusts §11-114?': '¿Ha sido condenado por un delito incluido en la sección 11-114 del artículo Sucesiones y Fideicomisos (Estates and Trusts)?', 'Tell us about the conviction': 'Cuéntenos sobre la condena', 'been convicted of a crime listed in Estates and Trusts §11-114?': 'sido condenado por un delito incluido en la sección 11-114 del artículo Sucesiones y Fideicomisos (Estates and Trusts)?', "Prospective guardian's conviction": 'Condena de la persona propuesta como tutor', 'Why is guardianship needed?': '¿Por qué se necesita la tutela?', 'Briefly explain in your own words.': 'Explíquelo brevemente con sus propias palabras.', 'Other court cases': 'Otros casos judiciales', 'List all other court cases about the child or children, including juvenile court, and all cases involving the petitioner or prospective guardian in any court. Write "None" if there are none.': 'Enumere todos los demás casos judiciales sobre el menor o los menores, incluidos los casos ante tribunales de menores, y todos los casos en cualquier tribunal que involucren al solicitante o a la persona propuesta como tutor. Escriba «None» («ninguno») si no hay casos.', 'Contact details for': 'Datos de contacto de', 'Do the children have any siblings who are not on this petition?': '¿Los menores tienen hermanos que no estén incluidos en esta solicitud?', 'Is there another sibling to tell us about?': '¿Hay otro hermano del que deba informarnos?', 'Tell us about the': 'Cuéntenos sobre el', 'sibling': 'hermano', 'Does any of the following apply to the child or children?': '¿Alguna de las siguientes opciones se aplica al menor o a los menores?', 'Check all that apply. We will ask for their details next.': 'Marque todas las opciones que correspondan. A continuación le pediremos los datos de esas personas o entidades.', 'The guardian who has already been appointed': 'El tutor ya designado', 'The person holding a power of attorney': 'La persona que tiene un poder', "The child's attorney": 'El abogado del menor', 'The person who has taken responsibility for the child': 'La persona que ha asumido la responsabilidad del menor', 'The government agency paying benefits': 'La entidad gubernamental que paga beneficios', "Enter the agency's name in the first box and leave the last name blank if it doesn't apply.": 'Ingrese el nombre de la entidad en el primer campo y deje el apellido en blanco si no corresponde.', "The person with an interest in the child's property": 'La persona con un interés en los bienes del menor', "The person who controls the child or the child's property": 'La persona que tiene control sobre el menor o sus bienes', 'The person or agency eligible to be guardian': 'La persona o entidad que reúne los requisitos para ser tutor', 'The other heir at law': 'El otro heredero por ley', 'Your name and contact details': 'Su nombre y sus datos de contacto', "Enter the attorney's information.": 'Ingrese la información del abogado.', "What is your client's name?": '¿Cómo se llama su cliente?', "What is your client's address?": '¿Cuál es la dirección de su cliente?', "What is your client's phone number?": '¿Cuál es el número de teléfono de su cliente?', "What is your client's email address?": '¿Cuál es la dirección de correo electrónico de su cliente?', 'Optional.': 'Opcional.', 'When was your client born?': '¿Cuándo nació su cliente?', 'When were you born?': '¿Cuándo nació usted?', 'Has the child lived anywhere else in the last five years?': '¿El menor ha vivido en otro lugar en los últimos cinco años?', 'Do not count the child\'s current home. Answer "Yes" if the child has lived at any other address, or with anyone else, during the past five years.': 'No cuente el hogar actual del menor. Responda «Sí» si el menor ha vivido en otra dirección o con otra persona durante los últimos cinco años.', 'Where else has the child lived? (': '¿En qué otro lugar ha vivido el menor? (', 'place)': 'lugar)', 'Tell us who the child lived with, the address, and about when. You can add more places on the next screen.': 'Indique con quién vivió el menor, la dirección y las fechas aproximadas. Puede agregar más lugares en la siguiente pantalla.', 'Is there another place the child lived in the last five years?': '¿Hay otro lugar donde el menor haya vivido en los últimos cinco años?', '**18 or older**': '**18 años o más**', '**Who is filing**': '**Quién presenta la solicitud**', '**Attorney**': '**Abogado**', '**Petitioner**': '**Solicitante**', '**Court**': '**Tribunal**', '**County**': '**Condado**', '**Relationship to the children**': '**Parentesco o relación con los menores**', "**Petitioner's criminal history**\n\nConvicted:": '**Antecedentes penales del solicitante**\n\nCondenado:', "**Prospective guardian's criminal history**\n\nConvicted:": '**Antecedentes penales de la persona propuesta como tutor**\n\nCondenado:', '**Veterans Affairs benefits**': '**Beneficios de Asuntos de los Veteranos**', '**Reason for guardianship**': '**Motivo de la tutela**', '**Siblings**': '**Hermanos**', '**Other interested people**\n\nEdit the list of people and their details.': '**Otras personas interesadas**\n\nEdite la lista de personas y sus datos.', '**Where the child has lived**': '**Lugares donde ha vivido el menor**', '**Other court cases**': '**Otros casos judiciales**', 'Edit petitioner': 'Editar solicitante', 'Edit attorney': 'Editar abogado', 'This petition has room for six children. Start a separate petition for any others.': 'Esta solicitud tiene espacio para seis menores. Presente una solicitud separada para los demás.', 'Edit siblings': 'Editar hermanos', 'Edit places the child has lived': 'Editar lugares donde ha vivido el menor', 'Next steps (keep for yourself)': 'Próximos pasos (para guardar)', 'Petition for Guardianship of a Minor': 'Solicitud de tutela de un menor', 'labeled_labeled_ccgn001withfieldswithfields_next_steps': 'labeled_labeled_ccgn001withfieldswithfields_next_steps', 'labeled_labeled_ccgn001withfieldswithfields': 'labeled_labeled_ccgn001withfieldswithfields', 'Fill out the Caregiver Authorization Form': 'Complete el formulario de autorización para la persona cuidadora', "Use this form for a child under 18 who lives with an adult caregiver in California.\nThe caregiver must be at least 18 years old.\n\nThe form can be used for school enrollment and school-related medical care.\nA relative caregiver can also complete the additional section for other medical and dental care.\n\nIf you are helping someone, enter the caregiver's information. The caregiver must\nreview and sign the affidavit. A parent's signature, notarization, and court filing are not required.": 'Use este formulario para un menor de 18 años que vive con una persona cuidadora adulta en California.\nLa persona cuidadora debe tener al menos 18 años.\n\nEl formulario puede usarse para la inscripción escolar y la atención médica relacionada con la escuela.\nSi la persona cuidadora es un familiar, también puede completar la sección adicional para otra atención médica y dental.\n\nSi está ayudando a otra persona, ingrese la información de la persona cuidadora. Esa persona debe revisar y firmar la declaración jurada. No se requiere la firma de los padres, certificación notarial ni presentación ante un tribunal.', "This affidavit is for an adult caregiver. Another adult who lives with the child may be able to use it.\n\nFor help with school enrollment, contact the school district's liaison or\n[read about other caregiving options](https://selfhelp.courts.ca.gov/guardianship/other-options).": 'Esta declaración jurada es para una persona cuidadora adulta. Otro adulto que viva con el menor quizás pueda usarla.\n\nPara obtener ayuda con la inscripción escolar, comuníquese con la persona de enlace del distrito escolar o [lea sobre otras opciones de cuidado](https://selfhelp.courts.ca.gov/guardianship/other-options).', 'The additional medical section is for relative caregivers. Examples include grandparents,\naunts, uncles, siblings, first cousins, and stepparents. See the full definition below.': 'La sección médica adicional es para personas cuidadoras que sean familiares. Algunos ejemplos son los abuelos, las tías, los tíos, los hermanos, los primos hermanos y los padrastros o las madrastras. Consulte la definición completa de abajo.', 'A relative is an adult related to the child by blood, adoption, or affinity (relationship through marriage) within\nthe fifth degree of kinship. This includes stepparents, stepsiblings, relatives\nwhose status is preceded by great, great-great, or grand, and spouses of those\nrelatives, even if the marriage ended through death or divorce.': 'Un familiar es una persona adulta relacionada con el menor por consanguinidad, adopción o afinidad (parentesco por matrimonio) hasta el quinto grado. Esto incluye a padrastros, madrastras, hermanastros y todos los parientes cuyo vínculo esté precedido por las palabras «bis», «tatar» o «abuelo/a», así como al cónyuge de cualquiera de estas personas, aun cuando el matrimonio haya terminado por fallecimiento o divorcio.', "These are the statements in item 6 of the affidavit. Select a statement only if the\nwhole statement is true. If you are helping, answer from the caregiver's point of view.\n\nBoth statements can apply, for example, if one parent was notified and did not object,\nbut the other parent cannot be reached. Not having contacted someone yet does not,\nby itself, mean they cannot be contacted.": 'Estas son las declaraciones del punto 6 de la declaración jurada. Seleccione una declaración solo si es verdadera en su totalidad. Si está ayudando a otra persona, responda desde el punto de vista de la persona cuidadora.\n\nAmbas declaraciones pueden corresponder; por ejemplo, si se notificó a uno de los padres y no se opuso, pero no se puede contactar al otro. No haber contactado a alguien todavía no significa, por sí solo, que no se pueda contactar a esa persona.', "Item 8 of the additional medical section asks for the caregiver's identification number.\nIf the caregiver does not have a California license, state ID, or consular card, the form allows\nanother form of identification, such as a Medi-Cal or Social Security number.": 'El punto 8 de la sección médica adicional pide el número de identificación de la persona cuidadora. Si no tiene una licencia de California, una identificación estatal ni una tarjeta consular, el formulario permite otra identificación, como un número de Medi-Cal o del Seguro Social.', 'Based on the date of birth you entered (': 'Según la fecha de nacimiento que ingresó (', '** is **': '** tiene **', "years old** today.\n\nA Caregiver's Authorization Affidavit can **only** be used for a minor child under 18 years of age. Once a person turns 18, they are an adult and can make their own educational and medical decisions.": 'años** hoy.\n\nLa declaración jurada de autorización de la persona cuidadora **solo** puede usarse para un menor de 18 años. Al cumplir los 18 años, la persona es adulta y puede tomar sus propias decisiones educativas y médicas.', 'Enter the home address where they live together.': 'Ingrese la dirección del hogar donde viven juntos.', 'Check the names, address, and selected statements before signing.\nThe signing date on the form is': 'Revise los nombres, la dirección y las declaraciones seleccionadas antes de firmar.\nLa fecha de firma en el formulario es', 'This version completes items 1–4 for school enrollment and school-related medical care.\nItems 5–8 are blank. It does not complete the additional section for other medical or dental care.': 'Esta versión completa los puntos 1 a 4 para la inscripción escolar y la atención médica relacionada con la escuela.\nLos puntos 5 a 8 están en blanco. No completa la sección adicional para otra atención médica o dental.', '**Person completing the interview**': '**Persona que completa la entrevista**', '**Home address**': '**Dirección del domicilio**', '**Use of the form**': '**Uso del formulario**', '**Relative caregiver**': '**Persona cuidadora que es familiar**', '**Item 6 confirmations**\n\nNotified the parents or legal custodians and received no objection:': '**Confirmaciones del punto 6**\n\nSe notificó a los padres o custodios legales y no hubo objeciones:', 'Unable to contact the parents or legal custodians:': 'No se pudo contactar a los padres o custodios legales:', "**Caregiver's birth date**": '**Fecha de nacimiento de la persona cuidadora**', '**Identification**': '**Identificación**', '**Signature**': '**Firma**', '**Signing date**': '**Fecha de firma**', 'Edit caregiver': 'Editar persona cuidadora', 'Edit child': 'Editar menor', 'Print the affidavit and have': 'Imprima la declaración jurada y pida a', 'review and sign it. Use the actual signing date.': 'que la revise y la firme. Use la fecha real de firma.', 'Have': 'Pida a', 'review the signed affidavit before giving copies to the school or health care providers.': 'que revise la declaración jurada firmada antes de entregar copias a la escuela o a los proveedores de atención médica.', 'This version is for school enrollment and school-related medical care. The additional medical section is blank.': 'Esta versión es para la inscripción escolar y la atención médica relacionada con la escuela. La sección médica adicional está en blanco.', 'Using your caregiver affidavit': 'Cómo usar su declaración jurada de persona cuidadora', 'Next Steps & Instructions Guide (Separate Document)': 'Guía de próximos pasos e instrucciones (documento separado)', 'Complete Caregiver Packet (Affidavit + Next Steps)': 'Paquete completo para la persona cuidadora (declaración jurada y próximos pasos)', 'Affidavit Copies for School and Healthcare Providers': 'Copias de la declaración jurada para la escuela y los proveedores de atención médica', 'caregiver_next_steps_instructions': 'caregiver_next_steps_instructions', 'caregiver_authorization_affidavit_form_finalwithfields': 'caregiver_authorization_affidavit_form_finalwithfields', 'School-related medical care includes vaccinations and exams required for school\nenrollment or participation in school activities.': 'La atención médica relacionada con la escuela incluye vacunas y exámenes requeridos para la inscripción o la participación en actividades escolares.', 'A caregiver who is not a relative can use this affidavit for school enrollment\nand school-related medical care. The additional section for other medical and\ndental care is for relative caregivers.': 'Una persona cuidadora que no sea familiar puede usar esta declaración jurada para la inscripción escolar y la atención médica relacionada con la escuela. La sección adicional para otra atención médica y dental es para personas cuidadoras que sean familiares.', 'Neither statement in item 6 was selected. The additional medical section is not\ncomplete with these answers. Do not select a statement unless it is true.\n\nIf someone with legal custody has objected, this affidavit does not resolve that\ndisagreement. Read about other options or get legal help before relying on it\nfor that medical decision.': 'No se seleccionó ninguna de las declaraciones del punto 6. Con estas respuestas, la sección médica adicional no está completa. No seleccione una declaración a menos que sea verdadera.\n\nSi una persona con custodia legal se ha opuesto, esta declaración jurada no resuelve ese desacuerdo. Lea sobre otras opciones u obtenga asistencia legal antes de usarla para autorizar esa decisión médica.', 'An identification number is needed to complete the additional medical section.\nYou can still prepare the school-related version without entering one.': 'Se necesita un número de identificación para completar la sección médica adicional. Aun así, puede preparar la versión para asuntos escolares sin ingresar uno.', "[California Courts explains other options for caring for a child](https://selfhelp.courts.ca.gov/guardianship/other-options).\nThe [Alliance for Children's Rights](https://allianceforchildrensrights.org/resources/caregivers-affidavit/)\nalso has information about caregiver affidavits.\n\nA caregiver affidavit does not change the parents' or legal guardians' rights.\nGet legal help if there is a disagreement about the child's care.": "[Los Tribunales de California explican otras opciones para cuidar de un menor](https://selfhelp.courts.ca.gov/guardianship/other-options).\nLa organización [Alliance for Children's Rights](https://allianceforchildrensrights.org/resources/caregivers-affidavit/) también ofrece información sobre las declaraciones juradas de personas cuidadoras.\n\nUna declaración jurada de persona cuidadora no modifica los derechos de los padres ni de los tutores legales. Obtenga asistencia legal si hay un desacuerdo sobre el cuidado del menor.", 'Use the actual signing date. If it changes, update the date before signing.': 'Use la fecha real de firma. Si cambia, actualícela antes de firmar.', 'must review the affidavit and complete the signature on the next screens.\nIf you are helping, let the caregiver review the form and sign it.': 'debe revisar la declaración jurada y firmarla en las siguientes pantallas.\nSi está ayudando a otra persona, deje que la persona cuidadora revise y firme el formulario.', 'Parties': 'Personas involucradas', 'Contacts & Addresses': 'Contactos y direcciones', 'Case Details': 'Detalles del caso', 'Notarization & Witnesses': 'Certificación notarial y testigos', 'Sign & Submit': 'Firmar y presentar', 'Parents or guardians': 'Padres o tutores', 'Caregiver & children': 'Persona cuidadora y menores', 'Sign & download': 'Firmar y descargar', 'You must accept the terms of use to continue.': 'Debe aceptar las condiciones de uso para continuar.', 'Parent Information': 'Información de los padres', 'Child Information': 'Información del menor', 'Caregiver Information': 'Información de la persona cuidadora', 'Preview and Review your answers': 'Vista previa y revisión de sus respuestas', 'Submit': 'Presentar', 'This person appears to be 18 or older. They must be under 18 for this form.': 'Esta persona parece tener 18 años o más. Debe ser menor de 18 años para usar este formulario.', 'About you': 'Sobre usted', 'Your children': 'Sus hijos', 'The caregiver': 'La persona cuidadora', 'Powers and dates': 'Facultades y fechas', 'Review and download': 'Revisar y descargar', "The end date can't be the same as the start date. That would be longer than 1 year. Pick the day before, or earlier.": 'La fecha de finalización no puede ser la misma que la fecha de inicio. Eso superaría 1 año. Elija el día anterior o una fecha más temprana.', "The birthday can't be in the future. Check the date and try again.": 'La fecha de nacimiento no puede estar en el futuro. Revísela e inténtelo de nuevo.', 'Begin here': 'Comience aquí', 'Your contact & family': 'Su contacto y familia', 'Choose a caretaker': 'Elija a una persona cuidadora', 'Sign & submit': 'Firmar y presentar', 'Check the birthdate. Your child must be under 18 if you want to add them to this form.': 'Revise la fecha de nacimiento. Su hijo debe ser menor de 18 años para incluirlo en este formulario.', 'Introduction': 'Introducción', 'Custody Information': 'Información de la custodia', 'Caregiver & Alternate': 'Persona cuidadora y suplente', 'Appointment Details': 'Detalles de la designación', 'Review': 'Revisar', 'Print': 'Imprimir', 'Choose at least one power to give the caregiver.': 'Elija al menos una facultad para otorgarle a la persona cuidadora.', 'Choose at least one event.': 'Elija al menos un hecho.', 'Describe the other event.': 'Describa el otro hecho.', 'Choose at least one reason.': 'Elija al menos un motivo.', 'Petiton details': 'Detalles de la solicitud', 'Child details': 'Datos del menor', 'Petitioner and guardian information': 'Información del solicitante y del tutor', 'Rights and reasons for guardianship': 'Derechos y motivos de la tutela', 'Legal proceedings and guardianship terms': 'Procedimientos judiciales y condiciones de la tutela', 'Review, sign, and submit': 'Revisar, firmar y presentar', 'People': 'Personas', 'About You': 'Sobre usted', 'Sign and Submit': 'Firmar y presentar', 'Parties (Child, Parents, Lawyers)': 'Personas involucradas (menor, padres y abogados)', 'Case & Guardianship Details': 'Detalles del caso y de la tutela', 'Basic Information': 'Información básica', 'Agent Information': 'Información del agente', 'Children Information': 'Información de los menores', 'Print and Sign': 'Imprimir y firmar', 'Submission': 'Presentación', 'Please check every box to show you read each statement.': 'Marque todas las casillas para indicar que leyó cada declaración.', 'Your backup agent must be 18 years old or older. Only an adult can be a caregiver.': 'Su agente suplente debe tener 18 años o más. Solo un adulto puede ser una persona cuidadora.', 'People Involved': 'Personas involucradas', 'Review & Submit': 'Revisar y presentar', 'This petition has room for six children. Choose No to finish this petition, then start a separate petition for any other children.': 'Esta solicitud tiene espacio para seis menores. Elija No para terminar esta solicitud y luego comience otra para los demás menores.', 'Half-siblings, and children who are not in the same situation, need their own petition. Choose No above to finish this petition, then start a new petition for the other child.': 'Los medios hermanos y los menores que no estén en la misma situación necesitan su propia solicitud. Elija No arriba para terminar esta solicitud y luego comience otra para el otro menor.', 'Caregiver details': 'Datos de la persona cuidadora', "Child's info": 'Información del menor', 'Edit answers': 'Editar respuestas', 'Download': 'Descargar', 'View': 'Ver', 'January': 'enero', 'February': 'febrero', 'March': 'marzo', 'April': 'abril', 'May': 'mayo', 'June': 'junio', 'July': 'julio', 'August': 'agosto', 'September': 'septiembre', 'October': 'octubre', 'November': 'noviembre', 'December': 'diciembre', '{month} has only {days} days.': '{month} solo tiene {days} días.', 'Actions': 'Acciones', 'Appointment': 'Nombramiento', 'authorization': 'autorización', 'Day': 'Día', 'Month': 'Mes', ':save: Save answer set': ':save: Guardar juego de respuestas', 'Save an answer set': 'Guardar un juego de respuestas', 'Give this answer set a name you can remember later': 'Dele un nombre a este juego de respuestas que pueda recordar más tarde', 'Tap "next" to keep answering any unanswered questions and finish the interview.': 'Toque "siguiente" para seguir respondiendo las preguntas sin responder y terminar la entrevista.', 'You can upload a file containing an answer set that you exported from this or a different server.': 'Puede subir un archivo que contiene un juego de respuestas que exportó desde este o desde otro servidor.', 'Back to your form': 'Volver al formulario', 'Share this website': 'Comparta este sitio web', '**Note**: the person you share this link with will be able to see and\nedit your answers on this form.': '**Nota**: la persona con la que comparta este enlace podrá ver y editar sus respuestas en este formulario.', 'email_or_sms': 'email_or_sms', "Message <span class='visually-hidden'>to friend</span>": "Mensaje <span class='visually-hidden'>para un amigo</span>", "Message <span class='visually-hidden'>with answers</span>": "Mensaje <span class='visually-hidden'>con las respuestas</span>", 'download_json': 'download_json', 'Copy': 'Copiar', 'Copy to clipboard': 'Copiar al portapapeles', 'Copied!': '¡Copiado!', 'Back to form': 'Volver al formulario', 'About this form': 'Acerca de este formulario', 'Do you want to delete your answers?': '¿Quiere borrar sus respuestas?', 'Your progress on this document will be completely erased. Any\nactions that were scheduled, such as reminders from this website,\nwill also be removed.\n\nClick "Exit and delete my answers" to delete your progress,\nor "Back" if you want to keep working.': 'Se borrará completamente su progreso en este documento. Las\nacciones que estaban programadas, como recordatorios de esta página web,\nse eliminarán igualmente.\n\nHaga clic en "Salir y borrar mis respuestas" para borrar su progreso,\no "Volver" si desea seguir trabajando.', 'Something went wrong': 'Hubo un error', 'Here is your work in progress': 'Aquí está su trabajo en progreso', 'Technical information': 'Información técnica', 'Get a copy of the documents in email': 'Obtenga una copia de los documentos por correo electrónico', 'Include an editable copy': 'Incluir una copia editable', 'We could not make your documents': 'No pudimos crear sus documentos', 'Please wait while we make your documents': 'Por favor espere mientras preparamos sus documentos', 'True': 'Sí', 'We could not generate a preview of your document': 'No pudimos crear una vista previa de su documento', 'Please wait while we generate a preview of your document': 'Por favor espere mientras generamos una vista previa de su documento', 'Green words are legal terms or a short way of referring to something that needs more explanation. The definition or explanation pops up when you tap the green words.': 'Las palabras verdes son términos legales o una manera breve de referirse a algo que necesita una mayor explicación. La definición o explicación aparece cuando toca las palabras verdes.', 'Okay, you are the **Plaintiff** or Petitioner in this case. The other \nside is the **Defendant** or Respondent.': 'Bueno, usted es el **Demandante** o el Peticionario en este caso. La otra  parte se denomina el **Demandado** o el Acusado.', 'plaintiff': 'plaintiff', 'Okay, you are the **Defendant** or Respondent in this case. The other \nside is the **Plaintiff** or Petitioner.': 'Bueno, usted es el **Demandado** o el Acusado en este caso. La otra  parte se denomina el **Demandante** o el Peticionario.', 'defendant': 'defendant', 'If you are the first person to file a form in the case, you \nstarted the case. You are the "Plaintiff" or the "Petitioner."\n\nIf you are responding to a case or court papers someone else filed, you\nare the "Defendant" or the "Respondent."': 'Si es la primera persona en presentar un formulario en el caso,  entonces usted es quien inició el caso. Usted sería el “Demandante” o el “Peticionario”.  \n\nSi está respondiendo a un caso o documentos del tribunal que presentó otra persona, usted sería el “Demandado” o el “Acusado”.', 'How do I know?': '¿Cómo puedo saberlo?', 'started': 'started', 'responded': 'responded', 'Title (optional)': 'Título (opcional)', 'Is this a person, or a business?': '¿Es un individuo o un negocio?', 'Name of business or organization': 'Nombre del negocio o de la organización', 'Person': 'Individuo', 'Business or organization': 'Negocio u organización', 'Apartment': 'Apartamento', 'Female': 'Mujer', 'Male': 'Hombre', 'Nonbinary': 'No binario', 'Prefer not to say': 'Prefiero no decir', 'Prefer to write something else': 'Prefiero escribir otra cosa', 'Self-described gender': 'Género, descripción propia', 'Unknown': 'Desconocido', 'Some forms require you to select either "Male" or "Female". If you do not select\n"Male" or "Female", your form may include an empty checkbox.': 'En algunos formularios, es obligación que seleccione “Hombre” o “Mujer”. Si no selecciona “Hombre” o “Mujer”, es posible que su formulario incluya una casilla de verificación vacía.', 'State / Province': 'Estado / Provincia', 'Country': 'País', 'This address is impounded': 'Esta dirección está confiscada', '**IMPOUNDED**': '**CONFISCADA**', "If you do not have a phone number or email, provide\nspecific contact instructions. For example, use a friend's phone number.\nBut the friend must be someone you can rely on to give you a\nmessage.": 'Si no tiene un número de teléfono o correo electrónico, proporcione instrucciones específicas acerca de cómo contactarlo. Por ejemplo, puede proveer el teléfono de un amigo. Sin embargo, el amigo debe ser una persona de quien pueda depender para que le dé un mensaje.', 'Why do I need to give my contact information?': '¿Por qué necesito dar mi información de contacto?', 'What is the case number used to track this case in court?': '¿Cuál es el número de caso utilizado para hacerle un seguimiento a este caso en el tribunal?', 'Do you have a case number used to track this case in court?': '¿Tiene un número de caso que se utilice para hacerle un seguimiento a este caso en el tribunal?', 'Do you need to list a witness for this form?': '¿Necesita incluir el nombre de algún testigo en este formulario?', 'Do you need to add another witness?': '¿Necesita agregar otro testigo?', 'What is the name of the person who died?': '¿Como se llama la persona que falleció?', "How many <span class='visually-hidden'>children</span>?": "¿Cuántos <span class='visually-hidden'>hijos</span>?", 'Do you have any witnesses?': '¿Tiene algún testigo?', "How many <span class='visually-hidden'>witnesses</span>?": "¿Cuántos <span class='visually-hidden'>testigos</span>?", 'Edit your answers about people on the other side of your case': 'Edite sus respuestas sobre las personas en el otro lado de su caso', 'In some jurisdictions, attorneys will have an identification number. \nFor example, in Massachusetts, all attorneys have a BBO (Board of \nBar Overseers) number that is 6 digits long.': 'En algunas jurisdicciones, los abogados tienen un número de identificación.  Por ejemplo, en Massachusetts, todos los abogados tienen un número de BBO (Junta de  Supervisores del colegio de abogados) de 6 dígitos.', 'What is an attorney ID?': '¿Qué es una identificación de abogado?', 'When do you plan to file these forms that we are working on?': '¿Cuándo planea presentar estos formularios que estamos completando?', 'Do you need an interpreter?': '¿Necesita un intérprete?', 'You have the right to an interpreter.\n\nIf there is a chance you may not understand everything that is said in \nEnglish, or if other people may not be able to understand you, ask for an \ninterpreter.\n\nYou do not have to speak only through the interpreter, but you may have one \nif you need one.': 'Tiene derecho a recibir los servicios de un intérprete.  \n\nSi es posible que no comprenda todo lo que está en  Inglés, o si otras personas no pueden entenderlo, solicite un  intérprete.  \n\nNo es necesario que hable solo a través del intérprete, pero puede tener uno  si lo necesita.', 'Signing Under Oath': 'Firmar bajo juramento', 'Your form must be signed under oath.\nThat means everything you say must be true as far as you know.\nYou may be punished by a judge if you intentionally\nsay something that is not true.': 'Debe firmar el formulario bajo juramento. Eso quiere decir que todo lo que diga debe ser verdad, a su leal saber y entender. Un juez podría castigarlo si intencionalmente declara algo que no es cierto.', 'How do I pick a court?': '¿Cómo elijo un tribunal?', 'Suite': 'Suite', 'What is the name of the appeals court your case is in?': '¿Cómo se llama el tribunal de apelaciones en el que se encuentra su caso?', 'Your documents are almost ready': 'Sus documentos están casi listos', 'How do you want to sign them?': '¿Cómo los quiere firmar?', "I will sign <span class='visually-hidden'>desktop</span>": "Voy a firmar <span class='visually-hidden'>en la computadora</span>", "I will sign <span class='visually-hidden'>mobile</span>": "Voy a firmar <span class='visually-hidden'>en el celular</span>", "I will sign <span class='visually-hidden'>desktop with print</span>": "Voy a firmar <span class='visually-hidden'>en la computadora e imprimir</span>", "I will sign <span class='visually-hidden'>mobile with print</span>": "Voy a firmar <span class='visually-hidden'>en el celular e imprimir</span>", 'Sign your forms': 'Firme sus formularios', 'How do I use this screen?': '¿Cómo uso esta pantalla?', 'Continue on the device you started the interview on': 'Siga usando el dispositivo en el que comenzó la entrevista', 'Thank you for signing. You can close this browser on your phone.\nKeep going on the computer you started the interview on.': 'Gracias por firmar. Puede cerrar este navegador en su teléfono. \nContinúe el proceso en la computadora en la que comenzó la entrevista.', 'Special instructions for the cover page': 'Instrucciones especiales para la portada', 'Include information that you want the clerk to know. The clerk is the person\nwho will receive your paperwork and put it in an official court file. The\nclerk is not a decision maker on your case.\n\nDo not include information that is meant for the judge or the other party.\nDo not include information that is meant to be part of your official case.\n\nThere is a chance this information may end up in the public court file, so\ndo not include sensitive or private information.': 'Incluya la información que quiere que el secretario sepa. El secretario es la persona\n que recibirá su documentación y la pondrá en un archivo oficial del tribunal. El\n secretario no toma decisiones en su caso. \n\nNo incluya información destinada al juez o a la otra parte. \nNo incluya información que deba ser parte de su caso oficial. \n\nEs posible que esta información termine en el expediente público del tribunal, por lo que\n no incluya información delicada o privada.', 'What to include?': '¿Qué debe incluir?', 'Final Review With Cover Page': 'Revisión final con portada', 'Review of your answers': 'Revisión de sus respuestas', 'Did you start this case, or are you responding to a case\nthat someone else started?': '¿Usted inició este caso o está respondiendo a un caso que fue iniciado por otra persona?', '**Okay**. You will have a chance to upload multiple documents. \nYou can also add additional pages to this document.': '**OK**. Tendrá la oportunidad de subir múltiples documentos. \nTambién le puede añadir páginas adicionales a este documento.', 'You will have a chance to upload additional pages for this document later.': 'Tendrá la oportunidad de subir páginas adicionales para este documento más tarde.', 'Preview your documents so far': 'Previsualizar sus documentos hasta ahora', 'Thumbnail': 'Miniatura', 'Total pages': 'Número total de páginas', 'Review your documents': 'Revisar sus documentos', 'Review your document pages': 'Revisar las páginas de su documento', 'en': 'en', 'es': 'es', 'ar': 'ar', 'kea': 'kea', 'yue': 'yue', 'cmn': 'cmn', 'fr': 'fr', 'ht': 'ht', 'pt': 'pt', 'other': 'otro', 'Language': 'Idioma', 'Example: "I normally sleep at 5th and Main."': 'Ejemplo: "Normalmente duermo en la calle 5 y Main".', 'What name does the minor want to be called?': '¿Qué nombre quiere el menor de edad que le llamen?', 'What name does the petitioner want to be called?': '¿Qué nombre quiere el demandante que le llamen?', 'Has the minor changed their name before?': '¿El menor de edad ha cambiado su nombre anteriormente?', 'Is there another time that the minor changed their name?': '¿El menor de edad ha cambiado su nombre alguna otra vez?', "What was the minor's first legal name?": '¿Cuál fue el primer nombre legal del menor de edad?', 'Write the name as it appeared on their first birth certificate.': 'Escriba el nombre tal como aparecía en su primer certificado de nacimiento.', 'A pronoun is a word that can be used in place of your name. For example: he, she, or they.\nLearn more at [pronouns.org](https://pronouns.org/)': 'Un pronombre es una palabra que se puede utilizar en lugar de su nombre. Por ejemplo: él, ella, o ellos.\nMás información en [pronouns.org](https://pronouns.org/)', 'Check one or more pronouns that you want people to use to refer to you': 'Marque uno o más pronombres que desee que usen las personas al referirse a usted', 'Choose one or more pronouns': 'Elija uno o más pronombres', 'he/him/his': 'he/him/his', 'she/her/hers': 'she/her/hers', 'they/them/theirs': 'they/them/theirs', 'ze/zir/zirs': 'ze/zir/zirs', 'Something else': 'Otra cosa', 'Self described pronouns': 'Pronombres auto descritos', 'Jr': 'Jr', 'Junior': 'Junior', 'Sr': 'Sr', 'Senior': 'Senior', 'I': 'I', 'II': 'II', 'III': 'III', 'IV': 'IV', 'V': 'V', 'VI': 'VI', 'Esq.': 'Esq.', 'Ph.D.': 'Ph.D.', 'M.D.': 'M.D.', 'J.D.': 'J.D.', 'D.D.S.': 'D.D.S.', 'D.V.M.': 'D.V.M.', 'Ed.D.': 'Ed.D.', 'Ret.': 'Ret.', 'OBE': 'OBE', 'CBE': 'CBE', 'MBE': 'MBE', 'QC': 'QC', 'KC': 'KC', 'Bart.': 'Bart.', 'Bt.': 'Bt.', 'Mr.': 'Mr.', 'Mrs.': 'Mrs.', 'Miss': 'Miss', 'Ms.': 'Ms.', 'Mx.': 'Mx.', 'Dr.': 'Dr.', 'Prof.': 'Prof.', 'Hon.': 'Hon.', 'Rev.': 'Rev.', 'Sir': 'Sir', 'Lord': 'Lord', 'Lady': 'Lady', 'Dame': 'Dame', 'Maj.': 'Maj.', 'Gen.': 'Gen.', 'Capt.': 'Capt.', 'Lt.': 'Lt.', 'Sgt.': 'Sgt.', 'Fr.': 'Fr.', 'Sr.': 'Sr.', "### Is this the right form for you?\nIf you are a parent or guardian in Maine and need someone else to care for your children temporarily, this form is for you. It grants your chosen agent the power to make decisions about your children's health, education, and general welfare.\n\n### Before you get started\n- Gather the necessary information about your children and the person you want to appoint.\n- Make sure you understand the powers you are granting and the limitations.\n\n### When you are finished\n- Sign the document in the presence of two witnesses and a notary public.\n- Provide copies to the appointed agent and any relevant institutions (like schools or healthcare providers).": '### ¿Es este el formulario adecuado para usted?\nEste formulario es para usted si es padre, madre o tutor en Maine y necesita que otra persona cuide temporalmente de sus hijos. Le otorga al apoderado que usted elija la autoridad para tomar decisiones sobre la salud, la educación y el bienestar general de sus hijos.\n\n### Antes de comenzar\n- Reúna la información necesaria sobre sus hijos y la persona que desea designar.\n- Asegúrese de comprender las facultades que está otorgando y sus límites.\n\n### Cuando termine\n- Firme el documento en presencia de dos testigos y un notario público.\n- Entregue copias al apoderado designado y a las instituciones correspondientes, como las escuelas o los proveedores de atención médica.', 'Preview your form before you sign it': 'Obtenga una vista previa de su formulario antes de firmarlo', 'Edit users': 'Editar usuarios', 'Edit other_parties': 'Editar apoderado', 'Edit children': 'Editar menores', 'P\n': 'P\n', 'Download all': 'Descargar todo', 'Download as one PDF': 'Descargar como un solo PDF', 'What is your contact information?': '¿Cuál es su información de contacto?', "Does the list above look wrong? If your case was filed in\na court we didn't list, choose from the full list below.": '¿La lista de arriba parece estar mal? Si su caso se presentó en un tribunal que no hemos mencionado, elija de la lista completa a continuación.', 'Full name. Like: Eastern Housing Court': 'Nombre completo. Tal como: Tribunal de Vivienda del Este', 'E.g., Housing, District, Superior': 'Por ejemplo: Vivienda, Distrito, Superior', 'E.g., Eastern, Suffolk, East Boston': 'Por ejemplo: Este, Suffolk, Este de Boston', 'MA': 'MA', 'Board of Bar Overseers, a regulatory board that tracks lawyers. All Massachusetts lawyers will have this number.': 'Junta de supervisores del colegio de abogados, una junta reguladora que monitorea a los abogados. Todos los abogados de Massachusetts tienen este número.', 'He/him/his': 'Él', 'She/her/hers': 'Ella', 'They/them/theirs': 'Ellos', 'Ze/zir/zirs': 'Elle/Elles', 'link_only': 'link_only', 'petitioner': 'petitioner', 'unknown': 'unknown', 'respondent': 'respondent', 'states_true': 'states_true', 'married': 'married', 'widowed': 'widowed', 'divorced': 'divorced', 'separated': 'separated', 'never_married': 'never_married', 'phone': 'phone', 'this_device': 'this_device', 'typed_signature': 'typed_signature', 'sign_after_printing': 'sign_after_printing', 'parent': 'padre o madre', 'guardian': 'tutor', 'digital': 'digital', 'blank': 'blank', "## You can use this form if\n\n- Your child goes to school in Rhode Island\n- You are the parent or legal guardian of a child in a school in Rhode Island\n\n## What this form does\n\n  This form lets a trusted adult (a caregiver) get your child's school records. The caregiver can also make school decisions for your child if you are unavailable.\n\nAn illness, arrest, or other emergency can prevent you from making school decisions for your child. This form allows a trusted adult to step in to make school decisions for your child when you cannot.\n\nThis does not make the caregiver your child's {legal guardian}.\n\n## Signing this form\n\n**You must sign this form in front of a {notary}.** Rhode Island school districts require it before a caregiver can register a child.\n\nNeed a notary? You may be able to find one for free at your public library, your bank, or by calling United Way's 2-1-1 helpline.": '## Puede usar este formulario si\n\n- Su hijo asiste a una escuela en Rhode Island\n- Usted es el padre, la madre o el tutor legal de un menor que asiste a una escuela en Rhode Island\n\n## Qué hace este formulario\n\n  Este formulario permite que un adulto de confianza (una persona cuidadora) obtenga los expedientes escolares de su hijo. Esa persona también puede tomar decisiones escolares por su hijo si usted no está disponible.\n\nUna enfermedad, un arresto u otra emergencia pueden impedirle tomar decisiones escolares por su hijo. Este formulario permite que un adulto de confianza tome esas decisiones cuando usted no pueda hacerlo.\n\nEsto no convierte a la persona cuidadora en el {tutor legal} de su hijo.\n\n## Cómo firmar este formulario\n\n**Debe firmar este formulario ante un {notario}.** Los distritos escolares de Rhode Island lo exigen antes de que una persona cuidadora pueda inscribir a un menor.\n\n¿Necesita un notario? Quizás pueda encontrar uno gratis en su biblioteca pública, en su banco o llamando a la línea 2-1-1 de United Way.', 'This tool helps you fill out Rhode Island\'s Educational Guardian form in 3 steps:\n\nStep 1. Write or select your answers to the following questions.<br>\nStep 2. Preview before printing.<br>\nStep 3. Download and print the final form. \n\nThis site is not a lawyer. If you would like a lawyer, find [your local legal aid provider](https://www.lsc.gov/what-legal-aid/find-legal-aid).\n\n  <span class="fs-5">**Click any underlined word, like {caregiver}, for its meaning.**</span>\n': 'Esta herramienta le ayuda a completar el formulario de tutor educativo de Rhode Island en 3 pasos:\n\nPaso 1. Escriba o seleccione sus respuestas a las siguientes preguntas.<br>\nPaso 2. Revise la vista previa antes de imprimir.<br>\nPaso 3. Descargue e imprima el formulario final.\n\nEste sitio no es un abogado. Si desea consultar a un abogado, encuentre [un proveedor de asistencia legal en su zona](https://www.lsc.gov/what-legal-aid/find-legal-aid).\n\n  <span class="fs-5">**Haga clic en cualquier palabra subrayada, como {persona cuidadora}, para ver su significado.**</span>\n', 'This tool helps you fill out Rhode Island\'s Educational Guardian form in 3 steps:\n\nStep 1. Write or select your answers to the following questions.<br>\nStep 2. Preview before printing.<br>\nStep 3. Download and print the final form. \n\nThis site is not a lawyer. If you would like a lawyer, find [your local legal aid provider](https://www.lsc.gov/what-legal-aid/find-legal-aid).\n\n  <span class="fs-5">**Click any underlined word, like {caregiver}, for its meaning.**</span>': 'Esta herramienta le ayuda a completar el formulario de tutor educativo de Rhode Island en 3 pasos:\n\nPaso 1. Escriba o seleccione sus respuestas a las siguientes preguntas.<br>\nPaso 2. Revise la vista previa antes de imprimir.<br>\nPaso 3. Descargue e imprima el formulario final.\n\nEste sitio no es un abogado. Si desea consultar a un abogado, encuentre [un proveedor de asistencia legal en su zona](https://www.lsc.gov/what-legal-aid/find-legal-aid).\n\n  <span class="fs-5">**Haga clic en cualquier palabra subrayada, como {persona cuidadora}, para ver su significado.**</span>', 'Edit caregivers': 'Editar personas cuidadoras', 'no_notary': 'no_notary', 'print_for_notary': 'print_for_notary', 'You can use this form if you are a parent or legal guardian and want to choose someone to make healthcare decisions for your child. It is important to ensure that the chosen person is trustworthy and understands your wishes regarding medical care.\n\n### Before you get started\n- Gather the necessary information about your child and the chosen caregiver.\n- Make sure both parents are in agreement with the appointment.\n\n### When you are finished\n- Sign the document in front of a notary public to make it legally binding.\n- Provide a copy to the chosen caregiver and keep one for your records.': 'Puede usar este formulario si es padre, madre o tutor legal y desea elegir a alguien para que tome decisiones sobre la atención médica de su hijo. Es importante asegurarse de que la persona elegida sea de confianza y comprenda sus deseos sobre la atención médica.\n\n### Antes de comenzar\n- Reúna la información necesaria sobre su hijo y la persona cuidadora elegida.\n- Asegúrese de que ambos padres estén de acuerdo con la designación.\n\n### Cuando termine\n- Firme el documento ante un notario público para que sea legalmente vinculante.\n- Entregue una copia a la persona cuidadora elegida y guarde otra para sus archivos.', 'In order for the form to be valid, you must get a {notary} to sign this form.\n\nAll Rhode Island Notaries Public are empowered to perform notarial acts for the general public.\n\n\n##### Where can I access a free Notary?\n* Community Action Partnership of Providence (CAPP)\n* Public libraries near you\n* Bank with which you have a bank account\n* United Way of Rhode Island (Dial 2-1-1) - they will be able to direct you to notary services and language services': 'Para que el formulario sea válido, debe obtener la firma de un {notario}.\n\nTodos los notarios públicos de Rhode Island están facultados para realizar actos notariales para el público en general.\n\n\n##### ¿Dónde puedo conseguir un notario gratuito?\n* Community Action Partnership of Providence (CAPP)\n* Bibliotecas públicas cercanas\n* El banco donde tiene una cuenta\n* United Way of Rhode Island (marque 2-1-1): pueden orientarle sobre servicios notariales y de idiomas', '##### Both parents or guardians are required to be on the form if both share custody of child': '##### Ambos padres o tutores deben figurar en el formulario si ambos comparten la custodia del menor', 'All done': 'Todo listo', 'Ridurableminor-with-fields\n': 'Ridurableminor-with-fields\n', 'court_emails.yml': 'court_emails.yml', 'BBO': 'BBO', 'What is the docket number for your case?': '¿Cuál es el número de expediente de su caso?', 'Do you have a docket number for this case?': '¿Tiene un número de expediente para este caso?', 'What is the docket number for this case?': '¿Cuál es el número de expediente de este caso?', 'No': 'No', 'yes': 'yes', 'future': 'future', 'no': 'no', 'unsure': 'unsure', 'False': 'No', 'immediately': 'immediately', "This form lets you choose another person to make decisions for your child.\n\nYou can use this form if you are a parent or legal guardian. You can give away some or all of your parental rights and responsibilities. The person you choose will not be able to allow your child to marry or be adopted.\n\nYou can give someone the ability to make decisions for six months or less. If you need someone to make decisions for longer than six months, you may need a [guardianship](https://www.ndcourts.gov/legal-self-help/minor-guardianship).\n\n### Before you get started\n- Have your child(ren)'s names and birth dates.\n- Have the name and address of the person you choose to care for your child(ren).\n- Make sure the person you choose is age 18 or older.\n\n### When you are finished\n- Sign the form in front of a notary public or court clerk to make it official.\n- Give copies to the person you have chosen and keep one for your records.": 'Este formulario le permite elegir a otra persona para que tome decisiones por su hijo.\n\nPuede usarlo si es padre, madre o tutor legal. Puede delegar algunas o todas sus facultades y responsabilidades parentales. La persona elegida no podrá autorizar el matrimonio ni la adopción de su hijo.\n\nPuede otorgar autoridad para tomar decisiones durante seis meses o menos. Si necesita que alguien tome decisiones durante más de seis meses, quizás necesite una [tutela](https://www.ndcourts.gov/legal-self-help/minor-guardianship).\n\n### Antes de comenzar\n- Tenga a mano los nombres y las fechas de nacimiento de sus hijos.\n- Tenga el nombre y la dirección de la persona que elija para cuidar de sus hijos.\n- Asegúrese de que esa persona tenga 18 años o más.\n\n### Cuando termine\n- Firme el formulario ante un notario público o el secretario del tribunal para formalizarlo.\n- Entregue copias a la persona elegida y guarde una para sus archivos.', 'Before you start': 'Antes de empezar', 'Fill out this form if you are a {parent}, {custodian}, or {guardian} of a minor child or {ward} in NJ wishing to temporarily give {parental powers} to someone else.\n\n### Before you get started\n* Collect names, addresses and phone numbers of the\n    * Person you share custody with (if applicable),\n    * {Caregiver} and\n    * Alternate caregiver\n* Collect names and birthdates of your children or wards.\n\n### Important information to know\n* You do not lose any of your parental powers when you give a caregiver power to care for your child through this form.\n* You can only give the caregiver powers that you have.\n* The caregiver you choose must be at least 18 years old.\n* The caregiver will have the powers for up to one year from the date of an event you will choose in this form.\n* You can renew the powers by repeating this process.\n* You can take back the powers at any time by telling the caregiver.\n\n### When you are finished\n* Sign the form in the presence of two witnesses. \n* The person you share custody with must also sign, if applicable. \n* A notary may also be needed, depending on the powers you give.\n* Give a copy to the caregiver and keep a copy for yourself.': 'Complete este formulario si es {padre o madre}, {custodio} o {tutor} de un menor o una {persona bajo tutela} en New Jersey y desea delegar temporalmente {facultades parentales} a otra persona.\n\n### Antes de comenzar\n* Reúna los nombres, las direcciones y los números de teléfono de:\n    * La persona con quien comparte la custodia, si corresponde\n    * La {persona cuidadora}\n    * La persona cuidadora suplente\n* Reúna los nombres y las fechas de nacimiento de sus hijos o de las personas bajo su tutela.\n\n### Información importante que debe saber\n* No pierde ninguna de sus facultades parentales al otorgarle a una persona cuidadora la autoridad para cuidar de su hijo mediante este formulario.\n* Solo puede otorgarle las facultades que usted tiene.\n* La persona cuidadora que elija debe tener al menos 18 años.\n* La persona cuidadora tendrá las facultades por un máximo de un año a partir de un hecho que usted elegirá en este formulario.\n* Puede renovar las facultades repitiendo este proceso.\n* Puede revocar las facultades en cualquier momento informándoselo a la persona cuidadora.\n\n### Cuando termine\n* Firme el formulario en presencia de dos testigos.\n* La persona con quien comparte la custodia también debe firmar, si corresponde.\n* También puede ser necesario un notario, según las facultades que otorgue.\n* Entregue una copia a la persona cuidadora y guarde otra para usted.', 'This form is not right for you': 'Este formulario no es el adecuado para usted', 'restart_children': 'restart_children', 'exit': 'exit', 'signed': 'signed', 'later': 'later', "## Before you get started\n- Make sure you have the child's birth certificate and the Affidavit Concerning Children (JD-FM-164).\n- Get all information about the child and the proposed guardian.\n\n## When you are finished\n- Submit the completed petition along with the required documents to the appropriate probate court. There will be a document at the end of the interview that will tell you what to do next. \n\nYou can use this form if you are a parent or a court-appointed guardian of a minor. Make sure to file it in the probate district where the child resides.": '## Antes de comenzar\n- Asegúrese de tener el acta de nacimiento del menor y la Declaración jurada sobre menores (JD-FM-164).\n- Reúna toda la información sobre el menor y la persona propuesta como tutor.\n\n## Cuando termine\n- Presente la solicitud completada junto con los documentos requeridos ante el tribunal de sucesiones correspondiente. Al final de la entrevista habrá un documento que le indicará qué hacer después.\n\nPuede usar este formulario si es padre, madre o tutor designado por un tribunal para un menor. Asegúrese de presentarlo en el distrito judicial de sucesiones donde reside el menor.', '### Before you get started\n- Carefully choose your "Attorney in Fact", who will be the caregiver.\n- Locate a notary for the form.\n\n### When you are finished\n- Sign the document in front of a notary public.\n- Give the signed, notarized original to the named Attorney in Fact and keep a copy for your records.\n\nUse this form if you are a parent or guardian who needs to temporarily delegate your power. It is important to make sure that the person you are naming is trustworthy and can handle the responsibilities.': '### Antes de comenzar\n- Elija cuidadosamente a su «apoderado», quien será la persona cuidadora.\n- Busque un notario para el formulario.\n\n### Cuando termine\n- Firme el documento ante un notario público.\n- Entregue el original firmado y certificado por el notario al apoderado designado y guarde una copia para sus archivos.\n\nUse este formulario si es padre, madre o tutor y necesita delegar temporalmente su autoridad. Es importante asegurarse de que la persona designada sea de confianza y pueda asumir las responsabilidades.', "## What is this form?\n- Use this form to ask the court to name you as a child's temporary guardian. The child's parents must agree to the guardianship. If a parent does not agree, the court will want to know why and may not accept this form. \n\n## Who should be filling out this form?\n- This form is for the person who wants to become the child's temporary guardian.\n  \n## Why would I use this form? \n- You would use this form to legally step in and care for a child when their parents are temporarily unable to care for them, but the parents are still willing to cooperate or keep their parental rights.\n- This form could be used for medical decisions, school enrollment, if a parent becomes sick, or making everyday life decisions for the child. \n  \n## To fill in the form:\n- Have information about the child and both parents ready.\n- Make sure you have a copy of the child's birth certificate. If you don't, you might risk the court rejecting the form or taking longer to process your request. \n- You may include copies of other documents, like a custody order or a parent's death certificate. If you don't have copies of other documents, you can still file this form without them.\n\n## When you are finished:\n- Check your answers, then print at least three copies of the form.\n- You can sign the papers ahead of time in front of a Notary Public (a person at a bank or store who officially stamps legal papers). Or, you can bring everyone to the court house and sign them in front of a court clerk. No matter what, you cannot sign the papers alone at home —an official person must watch you write your name.\n- File the signed form with the Probate Court in your county.\n- Keep a copy for yourself.": '## ¿Qué es este formulario?\n- Use este formulario para pedirle al tribunal que le nombre tutor temporal de un menor. Los padres del menor deben estar de acuerdo con la tutela. Si uno de los padres no está de acuerdo, el tribunal querrá saber por qué y es posible que no acepte este formulario. \n\n## ¿Quién debe completar este formulario?\n- Este formulario es para la persona que desea ser el tutor temporal del menor.\n  \n## ¿Por qué usaría este formulario?\n- Use este formulario para hacerse cargo legalmente del cuidado de un menor cuando sus padres no puedan cuidarlo temporalmente, pero aún estén dispuestos a cooperar o conserven sus derechos parentales.\n- Puede usarse para tomar decisiones médicas, inscribir al menor en la escuela, atenderlo si uno de los padres se enferma o tomar decisiones de la vida diaria por él. \n  \n## Para completar el formulario:\n- Tenga lista la información del menor y de ambos padres.\n- Asegúrese de tener una copia del acta de nacimiento del menor. Si no la tiene, existe el riesgo de que el tribunal rechace el formulario o tarde más en tramitar su solicitud.\n- Puede incluir copias de otros documentos, como una orden de custodia o el certificado de defunción de uno de los padres. Si no tiene copias de esos otros documentos, aun así puede presentar este formulario.\n\n## Cuando termine:\n- Revise sus respuestas e imprima al menos tres copias del formulario.\n- Puede firmar los documentos por adelantado ante un notario público, una persona en un banco o una tienda que certifica documentos legales. O puede acudir al tribunal con todas las personas que deban firmar y hacerlo ante el secretario del tribunal. En ningún caso puede firmar los documentos a solas en su casa: una persona autorizada debe observar su firma.\n- Presente el formulario firmado ante el tribunal de sucesiones de su condado.\n- Guarde una copia para usted.', 'Edit attorneys': 'Editar los abogados', 'scenario_1': 'scenario_1', 'scenario_2': 'scenario_2', 'scenario_3': 'scenario_3', 'scenario_4': 'scenario_4', '### Is this form right for you?\n- You can use this form if you are a {parent}, {legal guardian}, or {legal custodian}. It lets you choose someone to care for your child if you are suddenly separated from your child. The person you choose is your {agent}. Your agent must understand and agree to the responsibilities.\n- This form only takes effect if:\n    - you are detained by law enforcement,\n    - you are deported from the United States, or\n    - your agent does not know where you are for 24 hours.\n- It does not take effect for other reasons, such as a medical procedure, an illness, or work travel.\n- Once it takes effect, it lasts for 60 days, unless you change or cancel it in writing before then.\n\n\n### What do you need to complete this form?\n- Two witnesses.\n- Each witness must be at least 18, and your {agent} cannot be one of them.\n- Have your {agent} agree.\n- Get the other parent’s written permission if they are alive, easy to find, and able and willing to care for your child.\n\n### When you are done\n- Have the form signed by witnesses and the chosen agent.\n- No notarization is required for this temporary-agent form.\n- Keep a copy for yourself and give copies to the chosen agent(s).\n\n': '### ¿Es este el formulario adecuado para usted?\n- Puede usar este formulario si es {padre o madre}, {tutor legal} o {custodio legal}. Le permite elegir a alguien para cuidar de su hijo si se separan de repente. La persona elegida será su {agente}. Debe comprender y aceptar las responsabilidades.\n- Este formulario solo entra en vigor si:\n    - las autoridades lo detienen,\n    - usted es deportado de Estados Unidos, o\n    - su agente no sabe dónde está usted durante 24 horas.\n- No entra en vigor por otros motivos, como un procedimiento médico, una enfermedad o un viaje de trabajo.\n- Una vez que entra en vigor, dura 60 días, a menos que usted lo modifique o cancele por escrito antes.\n\n\n### ¿Qué necesita para completar este formulario?\n- Dos testigos.\n- Cada testigo debe tener al menos 18 años, y su {agente} no puede ser uno de ellos.\n- Obtenga la aceptación de su {agente}.\n- Obtenga el permiso escrito del otro padre o de la otra madre si vive, se le puede localizar fácilmente y puede y desea cuidar de su hijo.\n\n### Cuando termine\n- Obtenga las firmas de los testigos y del agente elegido.\n- Este formulario de agente temporal no requiere certificación notarial.\n- Guarde una copia para usted y entregue copias a los agentes elegidos.\n\n', '### Is this form right for you?\n- You can use this form if you are a {parent}, {legal guardian}, or {legal custodian}. It lets you choose someone to care for your child if you are suddenly separated from your child. The person you choose is your {agent}. Your agent must understand and agree to the responsibilities.\n- This form only takes effect if:\n    - you are detained by law enforcement,\n    - you are deported from the United States, or\n    - your agent does not know where you are for 24 hours.\n- It does not take effect for other reasons, such as a medical procedure, an illness, or work travel.\n- Once it takes effect, it lasts for 60 days, unless you change or cancel it in writing before then.\n\n\n### What do you need to complete this form?\n- Two witnesses.\n- Each witness must be at least 18, and your {agent} cannot be one of them.\n- Have your {agent} agree.\n- Get the other parent’s written permission if they are alive, easy to find, and able and willing to care for your child.\n\n### When you are done\n- Have the form signed by witnesses and the chosen agent.\n- No notarization is required for this temporary-agent form.\n- Keep a copy for yourself and give copies to the chosen agent(s).': '### ¿Es este el formulario adecuado para usted?\n- Puede usar este formulario si es {padre o madre}, {tutor legal} o {custodio legal}. Le permite elegir a alguien para cuidar de su hijo si se separan de repente. La persona elegida será su {agente}. Debe comprender y aceptar las responsabilidades.\n- Este formulario solo entra en vigor si:\n    - las autoridades lo detienen,\n    - usted es deportado de Estados Unidos, o\n    - su agente no sabe dónde está usted durante 24 horas.\n- No entra en vigor por otros motivos, como un procedimiento médico, una enfermedad o un viaje de trabajo.\n- Una vez que entra en vigor, dura 60 días, a menos que usted lo modifique o cancele por escrito antes.\n\n\n### ¿Qué necesita para completar este formulario?\n- Dos testigos.\n- Cada testigo debe tener al menos 18 años, y su {agente} no puede ser uno de ellos.\n- Obtenga la aceptación de su {agente}.\n- Obtenga el permiso escrito del otro padre o de la otra madre si vive, se le puede localizar fácilmente y puede y desea cuidar de su hijo.\n\n### Cuando termine\n- Obtenga las firmas de los testigos y del agente elegido.\n- Este formulario de agente temporal no requiere certificación notarial.\n- Guarde una copia para usted y entregue copias a los agentes elegidos.', 'Have the agent(s) review, date, and sign the form. You must sign before two adult witnesses who are not your agent.\n': 'Pida a los agentes que revisen, fechen y firmen el formulario. Usted debe firmar ante dos testigos adultos que no sean su agente.\n', 'Have the agent(s) review, date, and sign the form. You must sign before two adult witnesses who are not your agent.': 'Pida a los agentes que revisen, fechen y firmen el formulario. Usted debe firmar ante dos testigos adultos que no sean su agente.', 'Who must sign and initial this form?\n\n- You\n- Your Agent\n- The other parent, if available\n- Your backup agent, if you chose one\n\nYou must sign the form in front of two witnesses who are at least 18. Your agent and backup agent cannot be witnesses. This form does not require notarization.\n': '¿Quiénes deben firmar y poner sus iniciales en este formulario?\n\n- Usted\n- Su agente\n- El otro padre o la otra madre, si está disponible\n- Su agente suplente, si eligió uno\n\nDebe firmar el formulario ante dos testigos de al menos 18 años. Su agente y su agente suplente no pueden ser testigos. Este formulario no requiere certificación notarial.\n', 'Who must sign and initial this form?\n\n- You\n- Your Agent\n- The other parent, if available\n- Your backup agent, if you chose one\n\nYou must sign the form in front of two witnesses who are at least 18. Your agent and backup agent cannot be witnesses. This form does not require notarization.': '¿Quiénes deben firmar y poner sus iniciales en este formulario?\n\n- Usted\n- Su agente\n- El otro padre o la otra madre, si está disponible\n- Su agente suplente, si eligió uno\n\nDebe firmar el formulario ante dos testigos de al menos 18 años. Su agente y su agente suplente no pueden ser testigos. Este formulario no requiere certificación notarial.', 'legal_guardian': 'legal_guardian', 'legal_custodian': 'legal_custodian', 'deceased': 'deceased', 'whereabouts_unknown': 'whereabouts_unknown', 'unwilling': 'unwilling', 'unable': 'unable', 'TAFDC': 'TAFDC', 'Edit incomes': 'Editar ingresos', 'Edit values': 'Editar valores', 'What is your job title?': '¿Cuál es su título laboral?', "---\n\nEmployer's contact information": '---\n\nInformación de contacto del empleador', 'Other incomes': 'Otros ingresos', 'Other deductions': 'Otras deducciones', 'How many jobs do you have?': '¿Cuántos empleos tiene?', 'Edit jobs': 'Editar empleos', 'What kind of expenses do you have?': '¿Qué tipo de gastos tiene?', 'Edit expenses': 'Editar gastos', 'What sources of income do you have, not including employment?': '¿Qué fuentes de ingresos tiene (sin incluir el empleo)?', 'Tell us about this asset': 'Háblenos sobre este activo', 'How many assets do you have?': '¿Cuántos activos tiene?', 'Tell us about your vehicle': 'Háblenos sobre su vehículo', 'How many vehicles do you have?': '¿Cuántos vehículos tiene?', 'Tell us about the value': 'Cuéntenos sobre el valor', 'Medicare': 'Medicare', '### Before you start\n- Gather all needed information about the minor and your connection to them.\n- Have any required documents, like birth certificates, ready to include.\n\n### When you are done\n- Check your petition for accuracy and completeness.\n- Send the petition to the right court along with any required fees.\n\nYou can use this form if you are seeking guardianship of a minor child. If the minor is not a child, a different form is needed. Make sure to fill out separate petitions for each minor unless they are full siblings in the same situation. Half-siblings need separate petitions.\n\nThis petition asks the court to appoint a guardian of the **person** of a minor. It does not ask for guardianship of the minor’s property.': '### Antes de comenzar\n- Reúna toda la información necesaria sobre el menor y su relación con él.\n- Tenga listos los documentos requeridos, como las actas de nacimiento, para adjuntarlos.\n\n### Cuando termine\n- Revise que su solicitud sea correcta y esté completa.\n- Preséntela ante el tribunal correspondiente junto con las tasas requeridas.\n\nPuede usar este formulario si solicita la tutela de un menor. Para una persona adulta se necesita otro formulario. Complete solicitudes separadas para cada menor, a menos que sean hermanos de padre y madre y se encuentren en la misma situación. Los medios hermanos necesitan solicitudes separadas.\n\nEsta solicitud pide al tribunal que designe a un tutor de la **persona** de un menor. No solicita la tutela de los bienes del menor.', 'expense': 'expense', 'income': 'income', 'attorney': 'abogado', 'prospective guardian': 'persona propuesta como tutor', 'circuit': 'circuit', 'orphans': 'orphans', 'guardians': 'guardians', 'power_of_attorney': 'power_of_attorney', 'minor_attorney': 'minor_attorney', 'responsible_person': 'responsible_person', 'government_agency': 'government_agency', 'interested_person': 'interested_person', 'control_person': 'control_person', 'eligible_guardian': 'eligible_guardian', 'heirs': 'heirs', 'cdl': 'cdl', 'ca_id': 'ca_id', 'consular': 'consular', 'medical': 'medical', 'ssn': 'ssn', 'authorized_caregiver': 'authorized_caregiver', 'helper': 'helper', 'unavailable': 'unavailable', 'school': 'school', 'review': 'review', 'options': 'options', 'paper': 'paper', 'electronic': 'electronic', 'Children': 'Niños', 'Petitioners': 'Peticionarios', 'prospective_guardian': 'persona propuesta como tutor', 'Yes': 'Sí'})
